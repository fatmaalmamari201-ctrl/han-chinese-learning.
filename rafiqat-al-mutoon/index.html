function levelOpts(sel){return LEVELS.map(l=>`<option value="${l.id}" ${l.id===sel?'selected':''}>${escapeHTML(l.title)} — ${escapeHTML(l.caption)}</option>`).join('')}
function getDay(s){return db.days[s]||{date:s,attended:false,book:db.profile?.book||'athkar',newText:'',newFrom:'',newTo:'',newPages:0,reviewBook:db.profile?.book||'athkar',reviewText:'',reviewFrom:'',reviewTo:'',reviewPages:0,note:'',saved:false}}
function daysList(){return Object.values(db.days).filter(x=>x&&x.saved).sort((a,b)=>a.date.localeCompare(b.date))}
function thisWeekStart(s){let d=parse(s);d.setDate(d.getDate()-d.getDay());return dt(d)}
function weekDays(s){let start=thisWeekStart(s);return Array.from({length:5},(_,i)=>add(start,i))}
function weekCount(){return weekDays(today).filter(d=>db.days[d]?.attended).length}
function daysAttended(){return daysList().filter(x=>x.attended).length}
function streak(){const finished=daysList();if(!finished.length)return 0;let d=today;if(workDay(d)&&!db.days[d]?.attended)d=add(d,-1);while(!workDay(d))d=add(d,-1);let n=0;for(let x=0;x<999;x++){if(!db.days[d]?.attended)break;n++;d=add(d,-1);while(!workDay(d))d=add(d,-1)}return n}
function recitations(){return daysList().filter(x=>x.newPages>0&&(x.newText||x.newTo||x.newFrom)).map(x=>({id:x.date,book:x.book||db.profile.book,from:x.newFrom,to:x.newTo,pages:x.newPages,date:x.date}))}
function dueItems(){const stages=[1,3,7,14];const completed=new Set(db.reviews.map(x=>x.key));return recitations().flatMap(r=>stages.map(n=>({key:r.id+'-'+n,origin:r,due:add(r.date,n),interval:n}))).filter(x=>x.due<=today&&!completed.has(x.key)).sort((a,b)=>a.due.localeCompare(b.due))}
function totals(){const xs=daysList();return {newPages:xs.reduce((a,x)=>a+clamp(x.newPages,0,999),0),reviewPages:xs.reduce((a,x)=>a+clamp(x.reviewPages,0,999),0)+db.reviews.reduce((a,x)=>a+clamp(x.pages,0,999),0)}}
function latestCheckpoint(id){return daysList().filter(x=>x.book===id&&x.newTo).at(-1)}
function render(){document.getElementById('root').innerHTML=db.profile?appHtml():onboardHtml();document.title='رفيقة المتون | الحفظ والمراجعة';if(db.profile){if(tab==='home')syncCard();if(tab==='stats')renderChart()}}
function onboardHtml(){return `<main class="overlay"><div class="welcome"><div class="symbol">🌼</div><h1>رفيقة المتون</h1><p>مساحة بسيطة ترافقك في التسميع والحفظ والمراجعة، خطوة بخطوة</p><form id="join-form" class="form-stack"><div class="field"><label for="join-name">اسم الطالبة</label><input id="join-name" name="name" maxlength="70" placeholder="اكتبي الاسم كما تودين ظهوره في بطاقة الحضور" required autofocus></div><div class="field"><label for="join-level">المستوى الحالي</label><select id="join-level" name="level">${levelOpts('pre')}</select></div><div class="field"><label for="join-book">المتن الذي تحفظينه الآن</label><select id="join-book" name="book">${bookOpts('pre','athkar')}</select></div><div class="notice">🌱 سيكون عدّاد الحضور من الأحد إلى الخميس فقط. وتُحفظ بياناتك على هذا الجهاز دون حساب أو نشر عام.</div><button class="button full" type="submit">ابدئي رحلتك ←</button></form><div class="foot">أداة متابعة شخصية مستقلة، وليست نظام الحضور الرسمي للحلقات.</div></div></main>`}
function navButton(id,ico,label){return `<button data-tab="${id}" class="${tab===id?'active':''}">${ico} <span>${label}</span></button>`}
function appHtml(){const top=`<header class="top"><div class="brand"><div class="mark">۞</div><div><div class="brand-title">رفيقة المتون <span style="color:#74b692">✿</span></div><div class="small muted">رحلتك في الحفظ، بهدوء ووضوح</div></div></div><div class="top-right"><span class="badge">🌷 ${escapeHTML(db.profile.name)}</span><span class="pill">توقيت المدينة المنورة</span></div></header><nav class="nav">${navButton('home','🌼','اليوم')}${navButton('plan','🔁','مراجعتي')}${navButton('library','📚','المتون')}${navButton('stats','📈','إنجازي')}${navButton('settings','⚙️','إعداداتي')}</nav>`;return `<div class="app">${top}<main>${tab==='home'?homeHtml():tab==='plan'?planHtml():tab==='library'?libraryHtml():tab==='stats'?statsHtml():settingsHtml()}</main><footer class="foot">رفيقة المتون • حفظ محلي خاص • المصادر من موقع الشيخ د. عبد المحسن القاسم • غير تابع رسميًا لإدارة الحلقات</footer></div><nav class="bnav">${navButton('home','🌼','اليوم')}${navButton('plan','🔁','مراجعتي')}${navButton('library','📚','المتون')}${navButton('stats','📈','إنجازي')}</nav>`}
function homeHtml(){let t=totals();let x=getDay(selected);let wk=weekDays(today);return `<div class="grid" style="gap:16px"><section class="main-hero"><div class="hero-content"><span class="hero-kicker">يوم جديد في رحلة العلم ✨</span><h1>أهلًا بكِ، ${escapeHTML(db.profile.name)} 🌿</h1><div class="hero-sub">${weekdayNames[weekday(today)]} · ${formatDate(today)} · ${workDay(today)?'يوم تسميع':'إجازة الحلقة — المراجعة متاحة'}</div><div class="hero-stats"><div class="hero-stat"><strong>${streak()} 🔥</strong><span>سلسلة أيام التسميع</span></div><div class="hero-stat"><strong>${weekCount()}/5</strong><span>حضور هذا الأسبوع</span></div><div class="hero-stat"><strong>${t.newPages}</strong><span>صفحات حفظ مسجّلة</span></div></div></div></section><div class="grid cols"><section class="card"><div class="section-head"><div><div class="eyebrow">🌼 بطاقتك اليومية</div><h2>التسميع الجديد والمراجعة</h2></div><div class="datebar"><button data-shift="-1" aria-label="اليوم السابق">❯</button><strong>${formatDate(selected)}</strong><button data-shift="1" aria-label="اليوم التالي" ${selected===today?'disabled':''}>❮</button></div></div>${!workDay(selected)?'<div class="alert" style="margin-bottom:14px">اليوم عطلة للحلقة. يمكنكِ تسجيل مراجعة شخصية، لكن لا يُحتسب حضور حلقة.</div>':''}<form id="day-form" class="form-stack"><div class="form-section"><div class="title-row"><h3>💛 التسميع الجديد</h3><span class="chip gold">الحفظ</span></div><div class="field"><label>المتن</label><select name="book" id="day-book">${allBookOpts(x.book)}</select></div><div class="field"><label>وصف المحفوظ (اختياري)</label><input name="newText" maxlength="180" value="${escapeHTML(x.newText)}" placeholder="مثل: باب فضل الذكر / الأحاديث ١–٤"></div><div class="form-row triple"><div class="field"><label>من صفحة / موضع</label><input name="newFrom" maxlength="45" value="${escapeHTML(x.newFrom)}" placeholder="مثل ١٢"></div><div class="field"><label>إلى صفحة / موضع</label><input name="newTo" maxlength="45" value="${escapeHTML(x.newTo)}" placeholder="مثل ١٢"></div><div class="field"><label>عدد الصفحات</label><input name="newPages" inputmode="decimal" type="number" min="0" step="0.5" max="999" value="${x.newPages||0}"></div></div></div><div class="form-section"><div class="title-row"><h3>💗 مراجعة اليوم</h3><span class="chip rose">تثبيت الحفظ</span></div><div class="field"><label>المتن المرَاجَع</label><select name="reviewBook">${allBookOpts(x.reviewBook)}</select></div><div class="field"><label>وصف المراجعة (اختياري)</label><input name="reviewText" maxlength="180" value="${escapeHTML(x.reviewText)}" placeholder="مثل: مراجعة آخر صفحتين"></div><div class="form-row triple"><div class="field"><label>من صفحة / موضع</label><input name="reviewFrom" maxlength="45" value="${escapeHTML(x.reviewFrom)}" placeholder="من"></div><div class="field"><label>إلى صفحة / موضع</label><input name="reviewTo" maxlength="45" value="${escapeHTML(x.reviewTo)}" placeholder="إلى"></div><div class="field"><label>عدد الصفحات</label><input name="reviewPages" inputmode="decimal" type="number" min="0" step="0.5" max="999" value="${x.reviewPages||0}"></div></div></div><div class="field"><label class="checkline"><input type="checkbox" name="attended" ${x.attended?'checked':''} ${!workDay(selected)?'disabled':''}>حضرتُ حلقة التسميع اليوم</label><span class="hint">يُحسب الحضور فقط عند التأشير عليه وحفظ البطاقة، ولا يُسجّل تلقائيًا بمجرد فتح التطبيق.</span></div><button type="submit" class="button full">✓ حفظ بطاقة اليوم</button></form></section><div class="grid"><section class="card"><div class="section-head"><h2>✉️ بطاقة الحضور الجاهزة</h2><span class="badge">تعبئة تلقائية</span></div><div id="card-preview" class="preview"></div><div class="btnrow"><button class="button secondary" data-copy="card">نسخ بطاقة الحضور</button><button class="button ghost" data-share="card">مشاركة</button></div><p class="hint" style="margin-top:10px">انسخيها وأرسليها بنفسك إلى مجموعة الحلقة. لا نرسل شيئًا بالنيابة عنك.</p></section><section class="card"><div class="section-head"><h2>📅 حضور الأسبوع</h2><span class="chip">الأحد – الخميس</span></div><div class="week">${wk.map(d=>`<div class="weekday ${db.days[d]?.attended?'done':''} ${d===today?'today':''}"><span class="day">${weekdayNames[weekday(d)]}</span><strong>${parse(d).getDate()}</strong><div class="status">${db.days[d]?.attended?'✓ حضرت':d>today?'قادم':'—'}</div></div>`).join('')}</div><p class="hint" style="margin-top:14px">${weekCount()} من ٥ أيام في الأسبوع الحالي، دون احتساب الجمعة والسبت.</p></section><section class="card"><div class="section-head"><h2>🌱 أين وصلتِ؟</h2><span class="chip">${escapeHTML(lIndex().title)}</span></div><strong>${escapeHTML(curBook().title)}</strong><p class="muted small" style="margin:5px 0 12px">${latestCheckpoint(curBook().id)?'آخر موضع جديد: '+escapeHTML(latestCheckpoint(curBook().id).newTo)+' — '+formatDate(latestCheckpoint(curBook().id).date):'لم يُسجَّل موضع حفظ بعد.'}</p><div class="split"><span class="muted small">مراجعات مقترحة مستحقة</span><b>${dueItems().length}</b></div><div class="btnrow"><button class="button secondary" data-tab="plan">افتحي المراجعات ←</button></div></section></div></div></div>`}
function allBookOpts(sel){return LEVELS.map(l=>`<optgroup label="${escapeHTML(l.title)}">${bookOpts(l.id,sel)}</optgroup>`).join('')}
function autoCard(x){let a=(x.newText||[x.newFrom,x.newTo].filter(Boolean).join(' إلى '));let b=(x.reviewText||[x.reviewFrom,x.reviewTo].filter(Boolean).join(' إلى '));return `🌼بطاقة حضور 🌼\n🤍 الإسم: ${db.profile?.name||''}\n💛 الحفظ: ${a||'—'}${a?' | '+BOOKS[x.book]?.title:''}\n🌼 عدد صفحات الحفظ: ${x.newPages||0}\n💛المراجعه: ${b||'—'}${b?' | '+BOOKS[x.reviewBook]?.title:''}\n🌼عدد الصفحات: ${x.reviewPages||0}`}
function dataFromForm(form){const d=Object.fromEntries(new FormData(form).entries());let newBook=BOOKS[d.book]?d.book:db.profile.book;let reviewBook=BOOKS[d.reviewBook]?d.reviewBook:newBook;return {date:selected,attended:workDay(selected)&&!!form.elements.attended?.checked,book:newBook,newText:String(d.newText||'').trim().slice(0,180),newFrom:String(d.newFrom||'').trim().slice(0,45),newTo:String(d.newTo||'').trim().slice(0,45),newPages:clamp(d.newPages,0,999),reviewBook,reviewText:String(d.reviewText||'').trim().slice(0,180),reviewFrom:String(d.reviewFrom||'').trim().slice(0,45),reviewTo:String(d.reviewTo||'').trim().slice(0,45),reviewPages:clamp(d.reviewPages,0,999),saved:true}}
function syncCard(){let form=document.getElementById('day-form');let x=form?dataFromForm(form):getDay(selected);let v=document.getElementById('card-preview');if(v)v.textContent=autoCard(x)}
function planHtml(){const due=dueItems();const recent=daysList().slice(-12).reverse();return `<section class="main-hero"><div class="hero-content"><span class="hero-kicker">مراجعة صغيرة اليوم، حفظ ثابت غدًا</span><h1>🌿 ركن المراجعة</h1><div class="hero-sub">بعد كل تسميع جديد تُقترح مراجعات بعد ١، ٣، ٧ و١٤ يومًا. يمكنكِ إتمامها حتى أيام الإجازة.</div><div class="hero-stats"><div class="hero-stat"><strong>${due.length}</strong><span>مراجعة مستحقة</span></div><div class="hero-stat"><strong>${db.reviews.length}</strong><span>مراجعات أُنجزت</span></div></div></div></section><div class="grid cols" style="margin-top:16px"><div class="card"><div class="section-head"><h2>🔁 مراجعاتك المستحقة</h2><span class="chip rose">مجدولة تلقائيًا</span></div>${due.length?`<div class="rows">${due.slice(0,20).map(a=>`<div class="item"><div class="itemtop"><div><b>${escapeHTML(BOOKS[a.origin.book]?.title||'متن')}</b><p class="small muted">${escapeHTML([a.origin.from,a.origin.to].filter(Boolean).join(' إلى ')||db.days[a.origin.date]?.newText||'موضع الحفظ المسجّل')} • ${a.origin.pages} صفحة</p><p class="micro muted">بعد ${a.interval} ${a.interval===1?'يوم':'أيام'} من الحفظ • موعد ${formatDate(a.due)}</p></div><button class="button secondary" data-finish="${a.key}">تمت ✓</button></div></div>`).join('')}</div>`:`<div class="empty">✨ لا توجد مراجعات مستحقة الآن. احفظي يومك وارفعي موضع التسميع ليبدأ جدول المراجعة.</div>`}<div class="hint" style="margin-top:13px">عند الضغط على «تمت» تُسجل مراجعة للموضع المذكور، ولا تُحتسب حضورًا للحلقة. يمكنكِ تحديد مراجعات إضافية في بطاقة اليوم.</div></div><div class="grid"><section class="card"><div class="section-head"><h2>🪻 موضعك الحالي</h2><span class="badge">${escapeHTML(lIndex().title)}</span></div><div class="field"><label>المتن الذي تتابعينه الآن</label><select id="current-book">${allBookOpts(db.profile.book)}</select></div><p class="hint" style="margin-top:10px">اختاري متنًا آخر عند الانتقال إليه. سجلات المتون السابقة لا تضيع.</p><div class="line"></div><div class="split"><strong>${escapeHTML(curBook().title)}</strong><span class="chip">${daysList().filter(x=>x.book===curBook().id&&x.newPages>0).length} جلسات</span></div><p class="muted small" style="margin-top:8px">${latestCheckpoint(curBook().id)?'آخر حفظ إلى: '+escapeHTML(latestCheckpoint(curBook().id).newTo):'لم تحفظي موضعًا مسجّلًا بعد'}</p></section><section class="card"><div class="section-head"><h2>📜 آخر السجلات</h2></div>${recent.length?recent.map(d=>`<div class="list-link"><div><strong class="small">${formatDate(d.date)}</strong><div class="muted micro">حفظ ${d.newPages||0} · مراجعة ${d.reviewPages||0} صفحة</div></div><button class="mini-btn" data-godate="${d.date}">عرض</button></div>`).join(''):'<div class="empty">لا توجد سجلات بعد</div>'}</section></div></div>`}
function libraryHtml(){let l=LEVELS.find(x=>x.id===libraryLevel)||LEVELS[0];return `<section class="main-hero"><div class="hero-content"><span class="hero-kicker">مكتبة من المصدر الأصلي</span><h1>📚 متون طالب العلم</h1><div class="hero-sub">المستويات والمتون والقراءات والشروح، بروابط مباشرة إلى موقع الشيخ د. عبد المحسن القاسم.</div></div></section><section class="card" style="margin-top:16px"><div class="section-head"><h2>اختاري المستوى</h2><span class="chip">${LEVELS.length} مستويات</span></div><div class="levels">${LEVELS.map(k=>`<button class="level-btn ${libraryLevel===k.id?'active':''}" data-level="${k.id}">${escapeHTML(k.short)}</button>`).join('')}</div><div class="split" style="margin:20px 0 14px"><div><div class="eyebrow">${escapeHTML(l.title)}</div><h2>${escapeHTML(l.caption)}</h2></div><span class="chip">${l.books.length} ${l.books.length===1?'متن':'متون'}</span></div><div class="grid two">${l.books.map(b=>{let k=BOOKS[b[0]],last=latestCheckpoint(k.id),current=db.profile.book===k.id;return `<article class="book ${current?'current':''}"><div class="itemtop"><div><span class="micro muted">${escapeHTML(l.title)}</span><strong>${escapeHTML(k.title)}</strong></div>${current?'<span class="chip">متنك الحالي</span>':''}</div>${last?`<div class="small muted">آخر وصول: ${escapeHTML(last.newTo)} · ${formatDate(last.date)}</div>`:'<div class="small muted">لم تسجّلي حفظًا لهذا المتن بعد</div>'}<div class="resources"><a class="res" href="${k.reading}" target="_blank" rel="noopener noreferrer">📖 قراءة PDF</a><a class="res" href="${k.audio||SOUND}" target="_blank" rel="noopener noreferrer">🎧 تسجيلات</a><a class="res" href="${k.sharh||SHARH}" target="_blank" rel="noopener noreferrer">📜 الشروح</a></div><div class="btnrow"><button class="mini-btn" data-choosebook="${k.id}">اجعليه متني الحالي</button></div></article>`}).join('')}</div><div class="notice" style="margin-top:16px">📌 روابط القراءة قد تفتح ملف المستوى كاملًا، وروابط الصوت والشروح قد تفتح فهرسًا للاختيار منه. لم ننقل نصوص المتون أو الأحاديث إلى التطبيق لتجنب اختلاف الطبعات وأخطاء النسخ.</div></section><section class="card" style="margin-top:16px"><div class="section-head"><h2>🔎 مراجع موثوقة</h2></div><div class="grid two"><a class="list-link" href="${BASE}/books-cats/mutoon/" target="_blank" rel="noopener noreferrer">مكتبة متون طالب العلم <span>↗</span></a><a class="list-link" href="${SOUND}" target="_blank" rel="noopener noreferrer">فهرس القراءات الصوتية <span>↗</span></a><a class="list-link" href="${SHARH}" target="_blank" rel="noopener noreferrer">فهرس الشروح <span>↗</span></a><a class="list-link" href="https://a-alqasim.com/books/02sharhalqawaidalarba/" target="_blank" rel="noopener noreferrer">شرح القواعد الأربع (الرابط الذي أرسلته) <span>↗</span></a></div><p class="hint" style="margin-top:10px">«التمهيدي» في بعض الطبعات القديمة يقابل الأذكار والآداب، ويسمى «الأول» في ترتيب الموقع الحالي. اتبعي مسمى حلقتكِ عند تعبئة البطاقة.</p></section>`}
function statsHtml(){let t=totals(),xs=daysList(),a=thisWeekStart(today);return `<section class="main-hero"><div class="hero-content"><span class="hero-kicker">كل يوم صغير يصنع أثرًا كبيرًا</span><h1>📈 رحلتك بالأرقام</h1><div class="hero-sub">إحصاءات فعلية مبنية على بطاقاتك المحفوظة فقط، دون افتراض حضور أو مراجعة.</div></div></section><div class="grid three metrics" style="margin-top:16px"><div class="metric green"><div class="meta">إجمالي الحضور</div><div class="num">${daysAttended()}</div><div class="micro muted">أيام التسميع</div></div><div class="metric rose"><div class="meta">صفحات الحفظ</div><div class="num">${t.newPages}</div><div class="micro muted">تسميع جديد</div></div><div class="metric amber"><div class="meta">صفحات المراجعة</div><div class="num">${t.reviewPages}</div><div class="micro muted">مسجّلة فعلًا</div></div></div><div class="grid cols" style="margin-top:16px"><section class="card"><div class="section-head"><h2>🌼 نشاط 14 يومًا</h2><span class="chip">صفحات الحفظ + المراجعة</span></div><div class="bar-area" id="stats-bars"></div><div class="chartnote">العمود يمثل عدد الصفحات المسجّلة في اليوم (لا مجرد فتح التطبيق).</div></section><section class="card"><div class="section-head"><h2>🔥 استمراريتك</h2></div><div class="grid two"><div class="metric green"><div class="meta">السلسلة الحالية</div><div class="num">${streak()}</div><div class="micro muted">أيام تسميع متتالية</div></div><div class="metric"><div class="meta">حضور هذا الأسبوع</div><div class="num">${weekCount()}/5</div><div class="micro muted">الأحد إلى الخميس</div></div></div><p class="hint" style="margin-top:12px">الجمعة والسبت لا يكسران السلسلة. الحضور يُسجّل عند اختيار «حضرت» في البطاقة.</p></section></div><section class="card" style="margin-top:16px"><div class="section-head"><h2>🗓️ تقويم الحضور</h2><div class="datebar"><button data-month="-1">❯</button><strong id="month-title">${new Intl.DateTimeFormat('ar-OM',{month:'long',year:'numeric'}).format(parse(calendarAnchor))}</strong><button data-month="1">❮</button></div></div><div class="cal">${['أح','اث','ثل','أر','خم','جم','سب'].map(w=>`<div class="micro muted" style="text-align:center">${w}</div>`).join('')}${calendarCells()}</div><div class="chips" style="margin-top:12px"><span class="chip">🟢 حضور</span><span class="chip">🟠 يوم به حفظ/مراجعة</span><span class="chip">الرمادي: إجازة</span></div></section><section class="card" style="margin-top:16px"><div class="section-head"><h2>📖 الحفظ بحسب المتن</h2></div>${levelMatnStats()}</section>`}
function calendarCells(){const d=parse(calendarAnchor),ym=d.getFullYear(),mm=d.getMonth(),first=new Date(ym,mm,1),n=new Date(ym,mm+1,0).getDate();const blanks=Array.from({length:first.getDay()},()=>'<div></div>');return blanks.concat(Array.from({length:n},(_,i)=>{const day=dt(new Date(ym,mm,i+1)),r=db.days[day];return `<button class="calcell ${!workDay(day)?'nonwork':''} ${r?.attended?'hit':''} ${day===today?'current':''}" data-godate="${day}" ${day>today?'disabled':''}><b>${i+1}</b>${r?.attended?'✓':r?.saved&&(r.newPages||r.reviewPages)?'<span class="dot"></span>':' '}</button>`})).join('')}
function levelMatnStats(){let used=new Set(daysList().filter(x=>x.newPages>0).map(x=>x.book));if(!used.size)return '<div class="empty">بعد أول تسميع محفوظ ستظهر تفاصيل المتن هنا.</div>';return [...used].map(id=>{let xs=daysList().filter(x=>x.book===id),n=xs.reduce((s,x)=>s+(Number(x.newPages)||0),0);let last=latestCheckpoint(id);return `<div class="list-link"><div><b>${escapeHTML(BOOKS[id]?.title||'متن')}</b><p class="small muted">${xs.length} جلسات · آخر موضع ${escapeHTML(last?.newTo||'—')}</p></div><strong style="color:#34886b">${n} صفحة</strong></div>`}).join('')}
function renderChart(){let bar=document.getElementById('stats-bars');if(!bar)return;let arr=Array.from({length:14},(_,i)=>{let date=add(today,i-13),x=db.days[date];let n=(Number(x?.newPages)||0)+(Number(x?.reviewPages)||0)+db.reviews.filter(r=>r.date===date).reduce((a,r)=>a+(Number(r.pages)||0),0);return {date,n}});let max=Math.max(1,...arr.map(x=>x.n));bar.innerHTML=arr.map(x=>`<div class="bar-item" title="${formatDate(x.date)}: ${x.n} صفحة"><b>${x.n||''}</b><div class="bar" style="height:${Math.max(2,(x.n/max)*120)}px;${x.n?'':'background:#edf2ed'}"></div><small>${parse(x.date).getDate()}</small></div>`).join('')}
function settingsHtml(){return `<div class="grid cols"><section class="card"><div class="section-head"><h2>⚙️ إعدادات الطالبة</h2></div><form id="settings-form" class="form-stack"><div class="field"><label>الاسم على بطاقة الحضور</label><input name="name" maxlength="70" required value="${escapeHTML(db.profile.name)}"></div><div class="field"><label>المستوى</label><select name="level" id="settings-level">${levelOpts(db.profile.level)}</select></div><div class="field"><label>المتن الحالي</label><select name="book" id="settings-book">${bookOpts(db.profile.level,db.profile.book)}</select></div><button class="button" type="submit">حفظ التغييرات</button></form><div class="line"></div><h3>🪴 أين تحفظ البيانات؟</h3><p class="hint" style="margin-top:8px">تُحفظ بيانات الحضور والتسميع على هذا الجهاز في المتصفح نفسه. لا يوجد حساب مستخدم أو مزامنة بين الأجهزة، ولا ترى إدارة الحلقة بياناتك من خلال هذا التطبيق.</p></section><div class="grid"><section class="card"><div class="section-head"><h2>🔐 النسخ الاحتياطي</h2></div><p class="hint">نزّلي نسخة من سجلاتك إلى هاتفك حتى لا تضيع عند تغيير الجهاز أو حذف بيانات المتصفح.</p><div class="btnrow"><button class="button" data-export="1">↓ تنزيل نسخة احتياطية</button><label class="button secondary" style="cursor:pointer">↑ استعادة نسخة<input type="file" accept="application/json,.json" id="import-file" style="display:none"></label></div></section><section class="card"><div class="section-head"><h2>💌 عن البرنامج</h2></div><p class="hint">رفيقة المتون أداة غير رسمية تساعد الطالبات على متابعة حفظهن ومراجعتهن وتوليد بطاقة الحضور. لا تتصل بأنظمة المسجد النبوي، ولا تتحقق من الحضور الفعلي أو صحة التسميع لدى المعلمة.</p><p class="hint" style="margin-top:8px">النصوص الشرعية في الكتب المرجعية الأصلية، ويُنصح بالرجوع للمعلمة عند اختلاف ترقيم الصفحات أو الطبعات.</p><button class="mini-btn danger" style="margin-top:15px" data-clear="1">مسح جميع بيانات هذه الطالبة</button></section></div></div>`}
let toastTimer;
function toast(msg){document.querySelector('.toast')?.remove();let x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.append(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),3200)}
function copyText(s){if(navigator.clipboard?.writeText){return navigator.clipboard.writeText(s).catch(()=>legacyCopy(s))}return Promise.resolve(legacyCopy(s))}
function legacyCopy(s){let t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();if(!ok)window.prompt('انسخي بطاقة الحضور:',s)}
function saveDay(form){let x=dataFromForm(form);if(!x.attended&&!x.newPages&&!x.reviewPages&&!x.newText&&!x.reviewText){toast('أدخلي حفظًا أو مراجعة أو أكدي الحضور أولًا');return}db.days[selected]=x;persist();render();toast('حُفظت بطاقة اليوم 🌼')}
function markReview(key){let due=dueItems().find(x=>x.key===key);if(!due)return;db.reviews.push({key,date:today,pages:due.origin.pages,book:due.origin.book,from:due.origin.from,to:due.origin.to});persist();render();toast('رائع! سُجّلت مراجعتك 🌿')}
function exportData(){const b=new Blob([JSON.stringify({type:'rafiqah-almutoon',version:1,createdAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='رفيقة-المتون-نسخة-احتياطية-'+today+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('تم إنشاء النسخة الاحتياطية')}
function validateBackup(o){if(!o||o.type!=='rafiqah-almutoon'||o.version!==1||!o.data||!o.data.profile||typeof o.data.profile.name!=='string'||o.data.profile.name.length>70||!LEVELS.some(l=>l.id===o.data.profile.level)||!BOOKS[o.data.profile.book]||!o.data.days||Array.isArray(o.data.days)||typeof o.data.days!=='object'||!Array.isArray(o.data.reviews)||Object.keys(o.data.days).length>15000||o.data.reviews.length>30000)return false;for(const [k,v]of Object.entries(o.data.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!v||typeof v!=='object'||(v.date&&v.date!==k)||!BOOKS[v.book||o.data.profile.book]||String(v.newText||'').length>180||String(v.reviewText||'').length>180)return false}return true}
document.addEventListener('submit',e=>{if(e.target.id==='join-form'){e.preventDefault();let f=e.target,level=f.elements.level.value,name=f.elements.name.value.trim().slice(0,70),book=f.elements.book.value;if(!name||!BOOKS[book])return;db.profile={name,level,book};persist();render();toast('أهلًا بكِ في رحلتك 🌼')}else if(e.target.id==='day-form'){e.preventDefault();saveDay(e.target)}else if(e.target.id==='settings-form'){e.preventDefault();let f=e.target,name=f.elements.name.value.trim().slice(0,70);if(!name)return;db.profile={name,level:f.elements.level.value,book:f.elements.book.value};persist();render();toast('تم حفظ إعداداتك')}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='join-level'){let l=t.value;t.form.elements.book.innerHTML=bookOpts(l,(LEVELS.find(x=>x.id===l)||LEVELS[0]).books[0][0])}if(t.id==='settings-level'){let l=t.value;t.form.elements.book.innerHTML=bookOpts(l,(LEVELS.find(x=>x.id===l)||LEVELS[0]).books[0][0])}if(t.closest('#day-form'))syncCard();if(t.id==='current-book'){let id=t.value;if(BOOKS[id]){db.profile.book=id;db.profile.level=BOOKS[id].level;persist();render();toast('تم تحديث المتن الحالي')}}if(t.id==='import-file'){const file=t.files[0];if(!file)return;if(file.size>3e6){toast('الملف كبير جدًا');return}file.text().then(text=>{let parsed;try{parsed=JSON.parse(text)}catch{}if(!validateBackup(parsed)){toast('ملف النسخة الاحتياطية غير صالح');return}if(!confirm('سيستبدل الاستيراد جميع البيانات الحالية. هل تريدين المتابعة؟'))return;db=parsed.data;persist();tab='home';selected=today;render();toast('تم استعادة بياناتك')}).catch(()=>toast('تعذر قراءة الملف'))}});
document.addEventListener('input',e=>{if(e.target.closest('#day-form'))syncCard()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-level],[data-shift],[data-month],[data-choosebook],[data-godate],[data-finish],[data-copy],[data-share],[data-export],[data-clear]');if(!t)return;const d=t.dataset;if(d.tab){tab=d.tab;selected=today;render();window.scrollTo(0,0)}else if(d.level){libraryLevel=d.level;render()}else if(d.shift){let next=add(selected,Number(d.shift));if(next<=today){selected=next;render()}}else if(d.month){let x=parse(calendarAnchor);x.setDate(1);x.setMonth(x.getMonth()+Number(d.month));calendarAnchor=dt(x);render()}else if(d.choosebook){const book=BOOKS[d.choosebook];if(book){db.profile.book=book.id;db.profile.level=book.level;persist();render();toast('اخترتِ المتن الحالي 🌿')}}else if(d.godate){selected=d.godate;tab='home';render();window.scrollTo(0,0)}else if(d.finish){markReview(d.finish)}else if(d.copy||d.share){const form=document.getElementById('day-form');let card=autoCard(form?dataFromForm(form):getDay(selected));if(d.share&&navigator.share){navigator.share({text:card}).catch(()=>{})}else{copyText(card).then(()=>toast('نُسخت بطاقة الحضور 🌼')).catch(()=>toast('اختاري النص وانسخيه يدويًا'))}}else if(d.export){exportData()}else if(d.clear){if(confirm('هل تريدين فعلًا مسح جميع بطاقاتك ومراجعاتك واسمك من هذا المتصفح؟')){if(confirm('تأكيد أخير: هل لديك نسخة احتياطية؟')){db=emptyDB();persist();tab='home';selected=today;render();toast('تم مسح البيانات المحلية')}}}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>

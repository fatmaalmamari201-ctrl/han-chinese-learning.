let nawawiCorpus=null,nawawiState='idle',nawawiFailure='';
function loadNawawiCorpus(){
 if(nawawiState!=='idle')return;
 nawawiState='loading';
 fetch('./data/nawawi42.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(v=>{
  if(!Array.isArray(v.items)||v.items.length!==42||v.items.some((x,i)=>x.n!==i+1||!x.text||!x.explanation))throw Error('invalid data');
  nawawiCorpus=v.items;nawawiState='ready';if(tab==='library'&&activeLibraryBook==='nawawi')render();
 }).catch(e=>{nawawiFailure=String(e);nawawiState='error';if(tab==='library'&&activeLibraryBook==='nawawi')render()});
}
function nawawiReaderHtml(){
 if(nawawiState==='idle')loadNawawiCorpus();
 if(nawawiState==='loading')return `<div class="hadith-status" role="status">⏳ جار تحميل نصوص الأحاديث الـ42 وشروحها…</div>`;
 if(nawawiState==='error')return `<div class="notice">تعذر تحميل نصوص الأحاديث الآن؛ تحققي من الاتصال أو افتحي التطبيق في المتصفح مباشرة. يمكنك الرجوع إلى الكتاب الرسمي من زر «كتاب الحفظ».</div>`;
 return `<div class="source-note"><b>📘 متن كامل + شرح لكل حديث:</b> هنا 42 حديثاً من «الأربعين النووية» بنصوصها وشروحها من قاعدة بيانات مفتوحة الاستخدام، مع صوت مرقّم من مشروع مفتوح المصدر مستقل. <b>قد تختلف الألفاظ والضبط عن نسخة حفظ الحلقة.</b> للمراجعة النهائية اعتمدي النسخة الرسمية للشيخ عبد المحسن القاسم. الأحاديث الثمانية الإضافية لابن رجب لم تُدرج نصوصها هنا بعد.</div>
 <div class="hadith-collection">${nawawiCorpus.map((h,i)=>{
  const id='nawawi-'+h.n,meta=MATN_INDEX.nawawi.flatMap(c=>c.items).find(x=>x.id===id),status=unitState('nawawi',id);

  return `<details class="hadith-card" ${i===0?'open':''} data-unitrow="1" data-search="${escapeHTML((h.text+' '+(meta?.title||'')).slice(0,500))}">
   <summary><span class="hadith-num">${h.n}</span><span class="hadith-heading">الحديث ${h.n} ${status.memorized?'✓ محفوظ':''}<small class="muted" style="display:block;font-weight:500">${escapeHTML(head)}${parts[0]?.length>75?'…':''}</small></span></summary>
   <div class="hadith-body"><div class="hadith-text-full">${escapeHTML(raw).replace(/\n/g,'<br>')}</div>
   <div class="listen-box"><div class="listen-title">🎧 استمعي إلى الحديث ${h.n}</div><audio controls preload="none" src="${h.audio}" aria-label="تلاوة الحديث ${h.n}">متصفحك لا يدعم تشغيل الصوت.</audio><a class="mini-btn" href="${h.audio}" target="_blank" rel="noopener noreferrer">فتح الصوت في نافذة مستقلة</a><span class="unit-note">التسجيل من مشروع مستقل مفتوح المصدر؛ ليس تسجيل الحلقات الرسمي، ويحتاج اتصالاً بالإنترنت.</span></div>
   <details class="hadith-sharh"><summary>📜 اقرئي شرح الحديث ${h.n} (مصدر مستقل)</summary><div class="sharh-text">${escapeHTML(h.explanation)}<p class="source-note"><a href="https://files.a-alqasim.com/books/SharhAlMutoon/04SharhAlArbaeenAnNawawiyah/04SharhAlArbaeenAnNawawiyahFULL.pdf" target="_blank" rel="noopener noreferrer"><u>📖 الشرح الرسمي الكامل للأربعين النووية للمطابقة قبل التسميع</u></a></p></div></details>
   <div class="unit-actions"><button data-useunit="nawawi|${id}">💛 ضعيه في بطاقة تسميع اليوم</button><button class="${status.memorized?'done':''}" data-memunit="nawawi|${id}">${status.memorized?'✓ حفظته':'○ حفظته'}</button><button data-reviewunit="nawawi|${id}">🔁 راجعته ${status.reviewCount||''}</button></div>
   </div></details>`;
 }).join('')}</div>

}

const STORE='rafiqah-almutoon-v1';
const pad=n=>String(n).padStart(2,'0');
const dt=(d)=>{let x=new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const parse=(s)=>new Date(s+'T12:00:00');
const add=(s,n)=>{let d=parse(s);d.setDate(d.getDate()+n);return dt(d)};
const saintDate=()=>{const d=new Date();const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const t=Object.fromEntries(p.map(a=>[a.type,a.value]));return t.year+'-'+t.month+'-'+t.day};
const today=saintDate();
const weekday=s=>parse(s).getDay();
const workDay=s=>[0,1,2,3,4].includes(weekday(s));
const weekdayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const formatDate=s=>new Intl.DateTimeFormat('ar-OM',{dateStyle:'long',timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'));
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,min,max)=>Math.max(min,Math.min(max,Number(n)||0));
const emptyDB=()=>({version:1,profile:null,days:{},reviews:[],units:{},createdAt:today});
let db=emptyDB();try{const raw=JSON.parse(localStorage.getItem(STORE));if(raw&&typeof raw==='object'&&raw.version===1&&raw.days&&raw.reviews){db={...emptyDB(),...raw}}}catch{}
let tab='home',selected=today,libraryLevel='pre',calendarAnchor=today;
if(!db.units||typeof db.units!=='object')db.units={};

function curBook(){return BOOKS[db.profile?.book]||BOOKS.athkar}
function lIndex(){return LEVELS.find(x=>x.id===db.profile?.level)||LEVELS[0]}
function bookOpts(level,selectedId){let l=LEVELS.find(x=>x.id===level)||LEVELS[0];return l.books.map(b=>`<option value="${b[0]}" ${selectedId===b[0]?'selected':''}>${escapeHTML(b[1])}</option>`).join('')}
function levelOpts(sel){return LEVELS.map(l=>`<option value="${l.id}" ${l.id===sel?'selected':''}>${escapeHTML(l.title)} — ${escapeHTML(l.caption)}</option>`).join('')}
function getDay(s){return db.days[s]||{date:s,attended:false,book:db.profile?.book||'athkar',newText:'',newFrom:'',newTo:'',newPages:0,reviewBook:db.profile?.book||'athkar',reviewText:'',reviewFrom:'',reviewTo:'',reviewPages:0,note:'',saved:false}}
function daysList(){return Object.values(db.days).filter(x=>x&&x.saved).sort((a,b)=>a.date.localeCompare(b.date))}
function thisWeekStart(s){let d=parse(s);d.setDate(d.getDate()-d.getDay());return dt(d)}
function weekDays(s){let start=thisWeekStart(s);return Array.from({length:5},(_,i)=>add(start,i))}
function weekCount(){return weekDays(today).filter(d=>db.days[d]?.attended).length}
function daysAttended(){return daysList().filter(x=>x.attended).length}
function streak(){const finished=daysList();if(!finished.length)return 0;let d=today;if(workDay(d)&&!db.days[d]?.attended)d=add(d,-1);while(!workDay(d))d=add(d,-1);let n=0;for(let x=0;x<999;x++){if(!db.days[d]?.attended)break;n++;d=add(d,-1);while(!workDay(d))d=add(d,-1)}return n}
function recitations(){return daysList().filter(x=>x.newPages>0&&(x.newText||x.newTo||x.newFrom)).map(x=>({id:x.date,book:x.book||db.profile.book,from:x.newFrom,to:x.newTo,pages:x.newPages,date:x.date}))}
function dueItems(){const stages=[1,3,7,14];const completed=new Set(db.reviews.map(x=>x.key));return recitations().flatMap(r=>stages.map(n=>({key:r.id+'-'+n,origin:r,due:add(r.date,n),interval:n}))).filter(x=>x.due<=today&&!completed.has(x.key)).sort((a,b)=>a.due.localeCompare(b.due))}
function totals(){const xs=daysList();return {newPages:xs.reduce((a,x)=>a+clamp(x.newPages,0,999),0),reviewPages:xs.reduce((a,x)=>a+clamp(x.reviewPages,0,999),0)+db.reviews.reduce((a,x)=>a+clamp(x.pages,0,999),0)}}
function latestCheckpoint(id){return daysList().filter(x=>x.book===id&&x.newTo).at(-1)}

<div class="split"><strong>${escapeHTML(curBook().title)}</strong><span class="chip">${daysList().filter(x=>x.book===curBook().id&&x.newPages>0).length} جلسات</span></div><p class="muted small" style="margin-top:8px">${latestCheckpoint(curBook().id)?'آخر حفظ إلى: '+escapeHTML(latestCheckpoint(curBook().id).newTo):'لم تحفظي موضعًا مسجّلًا بعد'}</p></section><section class="card"><div class="section-head"><h2>📜 آخر السجلات</h2></div>${recent.length?recent.map(d=>`<div class="list-link"><div><strong class="small">${formatDate(d.date)}</strong><div class="muted micro">حفظ ${d.newPages||0} · مراجعة ${d.reviewPages||0} صفحة</div></div><button class="mini-btn" data-godate="${d.date}">عرض</button></div>`).join(''):'<div class="empty">لا توجد سجلات بعد</div>'}</section></div></div>`}

 const k=BOOKS[activeLibraryBook],book=k.id,chapters=MATN_INDEX[book]||[],num=unitsCount(book),done=bookUnitsDone(book),audio=VERIFIED_AUDIO[book]||k.audio||SOUND,sharh=VERIFIED_SHARH[book]||k.sharh||SHARH,reading=VERIFIED_PDF[book]||k.reading;
 return `<section class="main-hero"><div class="hero-content"><span class="hero-kicker">الآن دون البحث بين عشرات الصفحات</span><h1>📖 اقرئي، اسمعي، راجعي</h1><div class="hero-sub">المستوى ← المتن ← الحديث. نصوص وشروح كاملة للأربعين النووية (42 حديثاً)، وبقية المتون مدرجة بروابط وفهارس المصدر بوضوح.</div></div></section>

 ${book==='athkar'||book==='nawawi'?`<p class="hint">${book==='athkar'?'الكتاب يحتوي أبوابًا متعددة؛ قد يضم كل باب أكثر من حديث، لذلك لا يعادل عدد الأبواب عدد الأحاديث.':'كل رقم حديث هو وحدة مستقلة في فهرس التسجيلات. النص الكامل في نسخة المتن الموثقة.'}</p>`:''}

 ${book==='nawawi'?`<h2 style="margin-top:24px">③ الحديث بنصّه، وتحتَه الصوت والشرح</h2>${nawawiReaderHtml()}`:(num?`<div class="mindex"><h2 style="margin-top:20px">③ تصفح أبواب المتن</h2><p class="source-note"><b>تنبيه:</b> هذه أبواب فهرسية وليست نصوص الأحاديث. نصوص هذا المتن وتسجيلاته التفصيلية لم تُطابق لكل حديث بعد، لذلك لا ندعي اكتمالها.</p><details class="read-inside"><summary>📖 فتح نسخة الحفظ الرسمية داخل التطبيق</summary><iframe loading="lazy" title="متن ${escapeHTML(k.title)}" src="${reading}" referrerpolicy="no-referrer"></iframe><p class="unit-note">إذا لم يفتح الملف داخل هذه النافذة، استخدمي زر كتاب الحفظ في الأعلى.</p></details><div class="field library-find"><input id="index-search" placeholder="🔎 ابحثي في أبواب ${escapeHTML(k.title)}" autocomplete="off"></div><div id="indexed-chapters">${chapters.map((c,idx)=>`<details class="chapter" ${idx===0?'open':''}><summary><span>${escapeHTML(c.title)}</span><span class="chip" style="margin-inline-start:auto">${c.items.length}</span></summary><div class="chapter-items">${c.items.map(u=>unitHtml(k,u,reading,audio,sharh)).join('')}</div></details>`).join('')}</div></div>`:`<div class="notice" style="margin-top:14px">🪴 هذا المتن مدرج في المستويات، لكن نصوصه وأبوابه التفصيلية لم تُدرج بعد. استخدمي المصدر الرسمي للقراءة والتسجيلات.</div>`)}
 <div class="library-note">🔎 <b>أمانة علمية:</b> تقسيم «الأذكار والآداب» معتمد على أسماء أبواب الصوت في موقع الشيخ، وقد يضم الباب أحاديث عدة. بعض روابط الصوت تفتح <b>فهرس التسجيلات الأصلي</b>، وليس ملفًا يبدأ تلقائيًا عند باب معين؛ لأن رابط الملف المباشر لم يتأكد بعد. الأربعون النووية تعرض النصوص الكاملة لـ42 حديثاً وشروحها من مصدر مفتوح منفصل؛ ولم نطابق باقي المتون حديثاً بحديث بعد.</div>
 </section><section class="card" style="margin-top:16px"><div class="section-head"><h2>🌼 طريقك إلى التسميع</h2></div><p class="hint">اختاري «تسميع هذا المقطع» من الباب الذي تحفظينه، فتُملأ خانة الحفظ في بطاقة اليوم دون تسجيل حضورك تلقائيًا. وعند الانتهاء اختاري «حفظت هذا المقطع» لمتابعة تغطية المتن.</p></section>`;
}
function unitHtml(k,u,reading,audio,sharh){

 <p class="unit-note">${VERIFIED_AUDIO[k.id]?'التسجيلات الرسمية تحتوي قائمة المقاطع المرتبة بنفس الرقم.':'هذا رابط التسجيلات المتاحة للمتن؛ لم يُثبت ملف صوت مستقل لهذا الموضع.'}</p>

}
function statsHtml(){let t=totals(),xs=daysList(),a=thisWeekStart(today);return `<section class="main-hero"><div class="hero-content"><span class="hero-kicker">كل يوم صغير يصنع أثرًا كبيرًا</span><h1>📈 رحلتك بالأرقام</h1><div class="hero-sub">إحصاءات فعلية مبنية على بطاقاتك المحفوظة فقط، دون افتراض حضور أو مراجعة.</div></div></section><div class="grid three metrics" style="margin-top:16px"><div class="metric green"><div class="meta">إجمالي الحضور</div><div class="num">${daysAttended()}</div><div class="micro muted">أيام التسميع</div></div><div class="metric rose"><div class="meta">صفحات الحفظ</div><div class="num">${t.newPages}</div><div class="micro muted">تسميع جديد</div></div><div class="metric amber"><div class="meta">صفحات المراجعة</div><div class="num">${t.reviewPages}</div><div class="micro muted">مسجّلة فعلًا</div></div></div><div class="grid cols" style="margin-top:16px"><section class="card"><div class="section-head"><h2>🌼 نشاط 14 يومًا</h2><span class="chip">صفحات الحفظ + المراجعة</span></div><div class="bar-area" id="stats-bars"></div><div class="chartnote">العمود يمثل عدد الصفحات المسجّلة في اليوم (لا مجرد فتح التطبيق).</div></section><section class="card"><div class="section-head"><h2>🔥 استمراريتك</h2></div><div class="grid two"><div class="metric green"><div class="meta">السلسلة الحالية</div><div class="num">${streak()}</div><div class="micro muted">أيام تسميع متتالية</div></div><div class="metric"><div class="meta">حضور هذا الأسبوع</div><div class="num">${weekCount()}/5</div><div class="micro muted">الأحد إلى الخميس</div></div></div><p class="hint" style="margin-top:12px">الجمعة والسبت لا يكسران السلسلة. الحضور يُسجّل عند اختيار «حضرت» في البطاقة.</p></section></div><section class="card" style="margin-top:16px"><div class="section-head"><h2>🗓️ تقويم الحضور</h2><div class="datebar"><button data-month="-1">❯</button><strong id="month-title">${new Intl.DateTimeFormat('ar-OM',{month:'long',year:'numeric'}).format(parse(calendarAnchor))}</strong><button data-month="1">❮</button></div></div><div class="cal">${['أح','اث','ثل','أر','خم','جم','سب'].map(w=>`<div class="micro muted" style="text-align:center">${w}</div>`).join('')}${calendarCells()}</div><div class="chips" style="margin-top:12px"><span class="chip">🟢 حضور</span><span class="chip">🟠 يوم به حفظ/مراجعة</span><span class="chip">الرمادي: إجازة</span></div></section><section class="card" style="margin-top:16px"><div class="section-head"><h2>📖 الحفظ بحسب المتن</h2></div>${levelMatnStats()}</section>`}
function calendarCells(){const d=parse(calendarAnchor),ym=d.getFullYear(),mm=d.getMonth(),first=new Date(ym,mm,1),n=new Date(ym,mm+1,0).getDate();const blanks=Array.from({length:first.getDay()},()=>'<div></div>');return blanks.concat(Array.from({length:n},(_,i)=>{const day=dt(new Date(ym,mm,i+1)),r=db.days[day];return `<button class="calcell ${!workDay(day)?'nonwork':''} ${r?.attended?'hit':''} ${day===today?'current':''}" data-godate="${day}" ${day>today?'disabled':''}><b>${i+1}</b>${r?.attended?'✓':r?.saved&&(r.newPages||r.reviewPages)?'<span class="dot"></span>':' '}</button>`})).join('')}
function levelMatnStats(){let used=new Set(daysList().filter(x=>x.newPages>0).map(x=>x.book));if(!used.size)return '<div class="empty">بعد أول تسميع محفوظ ستظهر تفاصيل المتن هنا.</div>';return [...used].map(id=>{let xs=daysList().filter(x=>x.book===id),n=xs.reduce((s,x)=>s+(Number(x.newPages)||0),0);let last=latestCheckpoint(id);return `<div class="list-link"><div><b>${escapeHTML(BOOKS[id]?.title||'متن')}</b><p class="small muted">${xs.length} جلسات · آخر موضع ${escapeHTML(last?.newTo||'—')}</p></div><strong style="color:#34886b">${n} صفحة</strong></div>`}).join('')}
function renderChart(){let bar=document.getElementById('stats-bars');if(!bar)return;let arr=Array.from({length:14},(_,i)=>{let date=add(today,i-13),x=db.days[date];let n=(Number(x?.newPages)||0)+(Number(x?.reviewPages)||0)+db.reviews.filter(r=>r.date===date).reduce((a,r)=>a+(Number(r.pages)||0),0);return {date,n}});let max=Math.max(1,...arr.map(x=>x.n));bar.innerHTML=arr.map(x=>`<div class="bar-item" title="${formatDate(x.date)}: ${x.n} صفحة"><b>${x.n||''}</b><div class="bar" style="height:${Math.max(2,(x.n/max)*120)}px;${x.n?'':'background:#edf2ed'}"></div><small>${parse(x.date).getDate()}</small></div>`).join('')}
function settingsHtml(){return `<div class="grid cols"><section class="card"><div class="section-head"><h2>⚙️ إعدادات الطالبة</h2></div><form id="settings-form" class="form-stack"><div class="field"><label>الاسم على بطاقة الحضور</label><input name="name" maxlength="70" required value="${escapeHTML(db.profile.name)}"></div><div class="field"><label>المستوى</label><select name="level" id="settings-level">${levelOpts(db.profile.level)}</select></div><div class="field"><label>المتن الحالي</label><select name="book" id="settings-book">${bookOpts(db.profile.level,db.profile.book)}</select></div><button class="button" type="submit">حفظ التغييرات</button></form><div class="line"></div><h3>🪴 أين تحفظ البيانات؟</h3><p class="hint" style="margin-top:8px">تُحفظ بيانات الحضور والتسميع على هذا الجهاز في المتصفح نفسه. لا يوجد حساب مستخدم أو مزامنة بين الأجهزة، ولا ترى إدارة الحلقة بياناتك من خلال هذا التطبيق.</p></section><div class="grid"><section class="card"><div class="section-head"><h2>🔐 النسخ الاحتياطي</h2></div><p class="hint">نزّلي نسخة من سجلاتك إلى هاتفك حتى لا تضيع عند تغيير الجهاز أو حذف بيانات المتصفح.</p><div class="btnrow"><button class="button" data-export="1">↓ تنزيل نسخة احتياطية</button><label class="button secondary" style="cursor:pointer">↑ استعادة نسخة<input type="file" accept="application/json,.json" id="import-file" style="display:none"></label></div></section><section class="card"><div class="section-head"><h2>💌 عن البرنامج</h2></div><p class="hint">رفيقة المتون أداة غير رسمية تساعد الطالبات على متابعة حفظهن ومراجعتهن وتوليد بطاقة الحضور. لا تتصل بأنظمة المسجد النبوي، ولا تتحقق من الحضور الفعلي أو صحة التسميع لدى المعلمة.</p><p class="hint" style="margin-top:8px">42 حديثاً من الأربعين النووية بنصوصها وشروحها من مصدر مفتوح مستقل؛ وبقية المتون يرجع فيها إلى الكتاب الأصلي. ويُنصح بالرجوع للمعلمة عند اختلاف الترقيم أو الطبعات.</p><button class="mini-btn danger" style="margin-top:15px" data-clear="1">مسح جميع بيانات هذه الطالبة</button></section></div></div>`}
let toastTimer;
function toast(msg){document.querySelector('.toast')?.remove();let x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.append(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),3200)}
function copyText(s){if(navigator.clipboard?.writeText){return navigator.clipboard.writeText(s).catch(()=>legacyCopy(s))}return Promise.resolve(legacyCopy(s))}
function legacyCopy(s){let t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();if(!ok)window.prompt('انسخي بطاقة الحضور:',s)}
function saveDay(form){let x=dataFromForm(form);if(!x.attended&&!x.newPages&&!x.reviewPages&&!x.newText&&!x.reviewText){toast('أدخلي حفظًا أو مراجعة أو أكدي الحضور أولًا');return}db.days[selected]=x;persist();render();toast('حُفظت بطاقة اليوم 🌼')}
function markReview(key){let due=dueItems().find(x=>x.key===key);if(!due)return;db.reviews.push({key,date:today,pages:due.origin.pages,book:due.origin.book,from:due.origin.from,to:due.origin.to});persist();render();toast('رائع! سُجّلت مراجعتك 🌿')}
function exportData(){const b=new Blob([JSON.stringify({type:'rafiqah-almutoon',version:1,createdAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='رفيقة-المتون-نسخة-احتياطية-'+today+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('تم إنشاء النسخة الاحتياطية')}
function validateBackup(o){if(!o||o.type!=='rafiqah-almutoon'||o.version!==1||!o.data||!o.data.profile||typeof o.data.profile.name!=='string'||o.data.profile.name.length>70||!LEVELS.some(l=>l.id===o.data.profile.level)||!BOOKS[o.data.profile.book]||!o.data.days||Array.isArray(o.data.days)||typeof o.data.days!=='object'||!Array.isArray(o.data.reviews)||Object.keys(o.data.days).length>15000||o.data.reviews.length>30000)return false;for(const [k,v]of Object.entries(o.data.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!v||typeof v!=='object'||(v.date&&v.date!==k)||!BOOKS[v.book||o.data.profile.book]||String(v.newText||'').length>180||String(v.reviewText||'').length>180)return false}return true}
document.addEventListener('submit',e=>{if(e.target.id==='join-form'){e.preventDefault();let f=e.target,level=f.elements.level.value,name=f.elements.name.value.trim().slice(0,70),book=f.elements.book.value;if(!name||!BOOKS[book])return;db.profile={name,level,book};persist();render();toast('أهلًا بكِ في رحلتك 🌼')}else if(e.target.id==='day-form'){e.preventDefault();saveDay(e.target)}else if(e.target.id==='settings-form'){e.preventDefault();let f=e.target,name=f.elements.name.value.trim().slice(0,70);if(!name)return;db.profile={name,level:f.elements.level.value,book:f.elements.book.value};persist();render();toast('تم حفظ إعداداتك')}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='join-level'){let l=t.value;t.form.elements.book.innerHTML=bookOpts(l,(LEVELS.find(x=>x.id===l)||LEVELS[0]).books[0][0])}if(t.id==='settings-level'){let l=t.value;t.form.elements.book.innerHTML=bookOpts(l,(LEVELS.find(x=>x.id===l)||LEVELS[0]).books[0][0])}if(t.closest('#day-form'))syncCard();if(t.id==='current-book'){let id=t.value;if(BOOKS[id]){db.profile.book=id;db.profile.level=BOOKS[id].level;persist();render();toast('تم تحديث المتن الحالي')}}if(t.id==='import-file'){const file=t.files[0];if(!file)return;if(file.size>3e6){toast('الملف كبير جدًا');return}file.text().then(text=>{let parsed;try{parsed=JSON.parse(text)}catch{}if(!validateBackup(parsed)){toast('ملف النسخة الاحتياطية غير صالح');return}if(!confirm('سيستبدل الاستيراد جميع البيانات الحالية. هل تريدين المتابعة؟'))return;db=parsed.data;persist();tab='home';selected=today;render();toast('تم استعادة بياناتك')}).catch(()=>toast('تعذر قراءة الملف'))}});
document.addEventListener('input',e=>{if(e.target.closest('#day-form'))syncCard();if(e.target.id==='index-search'){const q=e.target.value.trim().toLocaleLowerCase('ar');document.querySelectorAll('.chapter').forEach(c=>{let visible=0;c.querySelectorAll('[data-unitrow]').forEach(x=>{const match=x.dataset.search.toLocaleLowerCase('ar').includes(q);x.hidden=!match;if(match)visible++});c.hidden=!visible;if(q&&visible)c.open=true})}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-level],[data-openbook],[data-memunit],[data-reviewunit],[data-useunit],[data-shift],[data-month],[data-choosebook],[data-godate],[data-finish],[data-copy],[data-share],[data-export],[data-clear]');if(!t)return;const d=t.dataset;if(d.tab){tab=d.tab;selected=today;render();window.scrollTo(0,0)}else if(d.level){libraryLevel=d.level;activeLibraryBook=(LEVELS.find(x=>x.id===libraryLevel)||LEVELS[0]).books[0][0];render()}else if(d.openbook){if(BOOKS[d.openbook]){activeLibraryBook=d.openbook;render()}}else if(d.memunit||d.reviewunit){const token=d.memunit||d.reviewunit;const [bk,un]=token.split('|');if(BOOKS[bk]&&MATN_INDEX[bk]?.some(c=>c.items.some(u=>u.id===un))){let key=bk+':'+un;let old=db.units[key]||{};if(d.memunit){db.units[key]={...old,memorized:!old.memorized,memorizedAt:!old.memorized?today:null}}else{db.units[key]={...old,reviewCount:(old.reviewCount||0)+1,lastReviewed:today}}persist();render();toast(d.memunit?'تم تحديث حالة الحفظ 🌼':'تم تسجيل مراجعة المقطع 🌿')}}else if(d.useunit){const [bk,un]=d.useunit.split('|');let unit=MATN_INDEX[bk]?.flatMap(c=>c.items).find(u=>u.id===un);if(unit&&BOOKS[bk]){tab='home';selected=today;render();let f=document.getElementById('day-form');if(f){f.elements.book.value=bk;f.elements.newText.value=unit.title;f.elements.newFrom.value=String(unit.number);f.elements.newTo.value=String(unit.number);syncCard()}window.scrollTo(0,0);toast('أضفنا الموضع إلى بطاقة اليوم؛ احفظي البطاقة بعد التسميع')}}else if(d.shift){let next=add(selected,Number(d.shift));if(next<=today){selected=next;render()}}else if(d.month){let x=parse(calendarAnchor);x.setDate(1);x.setMonth(x.getMonth()+Number(d.month));calendarAnchor=dt(x);render()}else if(d.choosebook){const book=BOOKS[d.choosebook];if(book){db.profile.book=book.id;db.profile.level=book.level;persist();render();toast('اخترتِ المتن الحالي 🌿')}}else if(d.godate){selected=d.godate;tab='home';render();window.scrollTo(0,0)}else if(d.finish){markReview(d.finish)}else if(d.copy||d.share){const form=document.getElementById('day-form');let card=autoCard(form?dataFromForm(form):getDay(selected));if(d.share&&navigator.share){navigator.share({text:card}).catch(()=>{})}else{copyText(card).then(()=>toast('نُسخت بطاقة الحضور 🌼')).catch(()=>toast('اختاري النص وانسخيه يدويًا'))}}else if(d.export){exportData()}else if(d.clear){if(confirm('هل تريدين فعلًا مسح جميع بطاقاتك ومراجعاتك واسمك من هذا المتصفح؟')){if(confirm('تأكيد أخير: هل لديك نسخة احتياطية؟')){db=emptyDB();persist();tab='home';selected=today;render();toast('تم مسح البيانات المحلية')}}}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>

تقييد النهي ببيع أخيه يقتضي أنه لا يحرم على بيع الكافر، وهو وجه لابن خالويه، والصحيح لا فرق لأنه من باب الوفاء بالذمة والعهد. \nقوله ﷺ: « التقوى ههنا » وأشار بيده إلى صدره وأراد القلب، وقدتقدم قوله ﷺ: « ألا وإن في الجسد مضغة إذا صلحت صلح الجسد كله » قوله صلى الله عليه وسلك: « ولا يخذله » أي عند أمره بالمعروف أو نهيه عن المنكر، أو عند مطالبته بحق من الحقوق، بل ينصره ويعينه ويدفع عنه الأذى ما استطاع. \nوقوله ﷺ: « ولا يحقره » أي فلا يحكم على نفسه بأنه خير من غيره، بل يحكم على غيره بأنه خير منه، أو لا يحكم بشيء فإن العاقبة منطوية ولا يدري العبد بما يختم له، فإذا رأى صغيراً مسلماً حكم بأنه خير منه باعتبار أنه أخف ذنوباً منه، وإن رأى من هو أكبر سناً منه حكم له بالخيرية باعتبار أنه أقدم هجره مه في الإسلام، وإن رأى كافراً لم يقطع له بالنار لا حتمال أنه يسلم فيموت مسلماً. \nقوله ﷺ: « بحسب امرىء من الشر ». أي يكفيه من الشر « أن يحقر أخاه » يعني أن هذا شر عظيم يكفي فاعله عقوبة هذا الذنب.. \nقوله ﷺ: « كل المسلم إلخ » قال في حجة الوداع: « إن دماءكم وأموالكم وأعراضكم عليكم حرام كحرمة يومكم هذا في بلدكم هذا ». واستدل الكرابيسي بهذا الحديث على أن الغيبة الوقوع في عرض المسلمين كبيرة إما لدلالة الاقتران بالدم والمال إما لتشبيه بقوله: « كحرمة يومكم هذا في شهركم هذا في بلدكم هذا » وقد توعد الله تعالى بالعذاب الأليم عليه فقال تعالى: {وَمَنْ يُرِدْ فِيهِ بِإِلْحَادٍ بِظْلمٍ نُذِقْهُ مِنْ عَذَابٍ أليمٍ }[الحج: 25].","audio":"https://raw.githubusercontent.com/mahmoodhamdi/nawawi_40_hadith_app/main/assets/audio/audio_35.mp3"},{"n":36,"text":"الحديث السادس والثلاثون\n\nعن أبي هريرة رضي الله عنه عن النبي ﷺ قال: \"من نفّس عن مؤمن كربةً من كرب الدنيا نفّس الله عنه كربةً من كرب يوم القيامة، ومن يسّر على معسر يسّر الله عليه في الدنيا والآخرة، ومن ستر مسلماً ستره الله في الدنيا والآخرة، والله في عون العبد ما كان العبد في عون أخيه، ومن سلك طريقاً يلتمس فيه علماً سهّل الله له به طريقاً إلى الجنة، وما اجتمع قوم في بيت من بيوت الله يتلون كتاب الله ويتدارسونه بينهم إلا نزلت عليهم السكينة، وغشيتهم الرحمة، وحفّتهم الملائكة، وذكرهم الله فيمن عنده، ومن بطّأ به عمله لم يسرع به نسبه\". (رواه مسلم بهذا اللفظ)","explanation":"شرح وفوائد الحديث\nقوله ﷺ: « من نفس عن مؤمن كربة من كرب الدنيا نفس الله عنه كربة من كرب يوم القيامة » فيه دليل على استحباب خلاص الأسير من أيدي الكفار بماله يعطيه، وعلى تخليص المسلم من أيدي الظلمة وخلاصه من السجن.يقال: إن يوسف عليه السلام لما خرج من السجن كتب على بابه: « هذا قبر الأحياء، وشماتة الأعداء، وتجربة الأصدقاء ». ويدخل في هذا الباب الضمان عن المعسر، والكفالة ببدنه، لمن هو قادر عليه، أما العاجز فلا ينبغي له ذلك، وقال بعض أصحاب القفال: إن في التوراة مكتوباً: « الكفالة مذمومة » أولها ندامة وأوسطها ملامة، وآخرها غرامة ». فإن قيل: قال الله تعالى: {ومن جاء بالحسنة فله عَشْرُ أمثالها }[الأنعام: 160]. وهذا الحديث يدل على أن الحسنة بمثلها لأنها قوبلت بتنفيس كربة واحدة، ولم تقابل بعشر كرب من يوم القيامة. \nفجوابه من وجهين: أحدهما أن هذا من باب مفهوم العدد، والحكم المعلق بعدد لا يدل على نفي الزيادة والنقصان. \nوالثاني: أن كل كربة من كرب يوم القيامة تشتمل على أهوال كثيرة وأحوال صعبة ومخاوف جمة، وتلك الأهوال تزيد علىالعشرة وأضعافها. وفي الحديث سر آخر مكتوم يظهر بطريق اللازم للملزوم، وذلك أن فيه وعداً بإخبار الصادق: أن من نفس الكربة عن المسلم يختم له بخير، ويموت على الإسلام، لأن الكفار لا يرحم في دار الآخرة ولا ينفس عنه من كربه شيء، ففي الحديث إشارة إلى بشارة تضمنتها العبارة الواردة عن صاحب الإمارة، فبهذا الوعد العظيم فليثق الواثقون {لمثل هذا فليعمل العاملون }[الصافات: 61].فأفضل العمل تنفيس الكرب. \nوفي الحديث دليل على استحباب ستر المسلم إذا اطلع عليه أنه عمل فاحشة قال الله تعالى: {إنَّ الذين يحبون أن تشيع الفاحشة في الذين آمنوا، لهم عذاب أليم في الدنيا والآخرة }[النور: 19]. والمستحب للإنسان إذا اقترف ذنباً أن يستر علىنفسه، وأما شهود الزنا، فاختلف فيهم على وجهين، احدهما: يستحب لهم الستر، والثاني: الشهادة. \nوفصل بعضهم فقال: إن رأوا مصلحة في الشهادة شهدوا، أو في الستر ستروا. \nوفي الحديث دليل على استحباب المشي في طلب العلم، ويروى أن الله سبحانه وتعالى أوحى إلى داود عليه الصلاة والسلام: أن خذ عصا من حديد ونعلين من حديد وامش في طلب العلم حتى يتخرق النعلان وتتكسر العصا. \nوفيه دليل على خدمةالعلماء وملازمتهم والسفر معهم واكتساب العلم منهم، قال الله تعالى حاكياً عن موسى عليه الصلاة والسلام: {هل أَتِبعُكَ على أن تعلمني مما علمت رُشداً }[الكهف: 66]. \nوعلم أن هذا الحديث له شرائط، منها العمل بما يعلمه، وقال أنس رضي الله عنه: العلماء همتهم الرعاية، والسفهاء همتهم الرواية. \nومن شرائطه نشره قال الله تعالى: {فلولا نفر من كل فرقة منهم طائفة لَيتَفَقَّهُوا في الدين ولينذروا قومهم إذا رجعوا إليهم لعلهم يحذرون }[التوبة: 122]. وروى أنس رضي الله تعالى عنه أن النبي ﷺ قال لأصحابه: «ألا أخبركم عن أجود الأجواد » قالوا بلى يا رسول الله، قال: « الله أجود الأجواد، وأنا أجود ولد آدم، وأجودهم بعدي رجل علم علماً فنشره يبعث يوم القيامة أمةوحده، ورجل بنفسه في سبيل الله حتى قتل ». \nومن شرائطه ترك المباهاة والممارة. وروي عن النبي ﷺ أنه قال: « من طلب العلم لأربعة دخل النار: ليباهي به العلماء، أو يماري به السفهاء، أو يأخذ به الأموال، أو يصرف به وجوه الناس إليه ». \nومن شرائطه الاحتساب في نشره وترك البخل به، قال الله تعالى: {قل لا أسألكم عليه أجراً }[الأنعام: 90]. \nومن شرائطه ترك الأنفة من قول لا أدري، قال ﷺ في علو مرتبته لما سئل عن الساعة: « ما المسؤول عنها بأعلم من السائل ». وسئل عن الروح فقال: « لا أدري ». \nومن شرائطه التواضع قال الله تعالى: {وعبادُ الرحمن الذين يمشون على الأرض هونا ً}[الفرقان63]. قال ﷺ لأبي ذر: « يا أبا ذر احفظ وصية نبيك عسى أن ينفعك الله بها، تواضع لله عز وجل عسى أن يرفعك القيامة، وسلم على من لقيت من أمتي برَّها وفاجرها، والبس الخشن من الثياب، ولاتُرِدْ بذلك إلا وجه الله تعالى، لعل الكبر والحمية لا يجدان في قبلك مساغاً ». \nومن شرائطه احتمال الأذى في بذل النصيحة والاقتداء بالسلف الصالح في ذلك قال الله تعالى: {وأنه عن المنكر واصبر على ما أصابك}[لقمان: 17]. وقال ﷺ: «ما أوذي نبِّي مثل ما أوذيت ». \nومن شرائطه أن يقصد بعلمه من كان أحوج إلى التعليم، كما يقصد بالصدقة بالمال الأحوج فالأحوج، فمن أحيا جاهلاُ بتعليم العلم فكأنما أحيا الناس جمعياً، ومما قيل في تنبيه الغافل ورده إلى الطاعة. \nقوله ﷺ: « إلا نزلت عليه السكينة » هي فعيلة من السكون، أي الطمأنينة من الله، قال الله تعالى: {ألا بذكرِ تطمَئِنُّ القلوب }[الرعد: 28]. وكفى بذكر الله شرفاً ذكر الله العبد في الملأ الأعلى. \nقوله ﷺ: « ومن بطأ به عمله » أي وإنكان نسيباً « لم يسرع به نسبه » إلى الجنة فيقدم العامل بالطاعة ولو كان عبداً حبشياً على غير العامل ولو كان شريفاً قرشياً، قال الله تعالى: {إن أكرمكم عند الله أتقاكم }[الحجرات: 13].","audio":"https://raw.githubusercontent.com/mahmoodhamdi/nawawi_40_hadith_app/main/assets/audio/audio_36.mp3"},{"n":37,"text":"الحديث السابع والثلاثون\n\nعن ابن عباس رضي الله عنهما عن رسول الله ﷺ فيما يرويه عن ربه تبارك وتعالى قال: \"إن الله كتب الحسنات والسيئات، ثم بين ذلك، فمن همّ بحسنة فلم يعملها كتبها الله عنده حسنةً كاملةً، وإن همّ بها فعملها كتبها الله عنده عشر حسنات إلى سبعمائة ضعف، وإن همّ بسيئة فلم يعملها كتبها الله عنده حسنةً كاملةً، وإن هم بها فعملها كتبها الله سيئةً واحدةً\". (رواه البخاري ومسلم في صحيحيهما بهذه الحروف)","explanation":"شرح وفوائد الحديث\nقوله ﷺ: « كتبها الله عنده عشر حسنات إلى سبعمائة ضعف إلى أضعاف كثيرة » روى البزار في مسنده أنه ﷺ قال: (الأعمال سبعة: عملان موجبان، وعملان واحد بواحد، وعمل الحسنة فيه بعشرة، وعمل الحسنة فيه بسبعمائة ضعف، وعمل لا يحصي ثوابه إلا الله تعالى. فأما العملان الموجبان فالكفر والإيمان، فالإيمان يوجب الجنة والكفر يوجب النار، وأما العملان اللذان هما واحد بواحد، فمن هم بحسنة ولم يعملها كتبها الله له حسنة، ومن عمل سيئة كتب الله عليه سيئة واحدة، وأما العمل الذي بسبعمائة ضعف فهو الجهاد في سبيل الله تعالى: { كمثل حبةٍ أنْبتَتْ سبع سنابل في كل سنبلة مائةُ حبة }[البقرة: 26]. ثم ذكر الله سبحانه وتعالى أنه يضاعف لمن يشاء زيادة على ذلك، وقال الله تعالى: {وإن تكُ حَسَنة يضاعفها ويؤتِ من لدنه أجراً عظيما ً}[النساء: 40].فدلت الآية والحديث وهو قوله ﷺ: «إلى أضعاف كثيرة » إن العشر والسبعمائة كلمة ليست للتحديد وأنه يضاعف لمن يشاء ويعطي من لدنه ما لا يعد ولا يحصى فسبحان من لا تحصى آلاؤه ولا تعد نعماؤه فله الشكر والنعمة والفضل. \nوأما السابع فهو الصوم، «يقول الله تعالى: كُلُّ عَمَلِ ابْن آدم له إلا الصومُ فإنَّهُ لي وأنا أجزي به ». فلا يعلم ثواب الصوم إلا الله.","audio":"https://raw.githubusercontent.com/mahmoodhamdi/nawawi_40_hadith_app/main/assets/audio/audio_37.mp3"},{"n":38,"text":"الحديث الثامن والثلاثون\n\nعن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ: \"إن الله تعالى قال: من عادى لي ولياً فقد آذنته في الحرب، وما تقرّب إليّ عبدي بشيء أحبّ إليّ مما افترضته عليه، ولا يزال عبدي يتقرب إليّ بالنوافل حتى أحبه، فإذا أحببته كنت سمعه الذي يسمع به، وبصره الذي يبصر به، ويده التي يبطش بها، ورجله التي يمشي بها، ولئن سألني لأعطينّه، ولئن استعاذني لأعيذنّه\". (رواه البخاري)","explanation":"شرح وفوائد الحديث\nقوله ﷺ عن ربه تعالى: «من عادى لي ولياً فقد آذنته بالحرب » المراد هنا بالولي: المؤمن قال الله تعالى: {الله ولي الذين آمنوا }[البقرة: 257].فمن آذى مؤمناً فقد آذنه الله، أي أعلمه الله أنه محارب له، والله تعالى إذا حارب العبد أهلكه، فليحذر الإنسان من التعرض لكل مسلم قوله تعالى: « وما تقرب إليَّ عبدي بشيء أحب إليًّ مما افترضته عليه » فيه دليل على أن فعل الفريضة من أفضل النوافل، وجاء في الحديث: «إن ثواب الفريضة يفضل على ثواب النافلة بسبعين مرة ». \nقوله تعالى: « ولا يزال عبدي يتقرب إليَّ بالنوافل حتى أحبه » ضرب العلماء رضي الله تعالى عنهم لذلك مثلاً فقالوا: مثل الذي يأتي بالنوافل مع الفرائض، ومثل غيره كمثل رجل أعطى لأحد عبديه درهماً ليشتري به فاكهة، وأعطى آخر درهماً ليشتري فاكهة، فذهب أحد العبدين فاشترى فاكهة فوضعها في قوصرة، وطرح عليها ريحاناً ومشموماً من عنده، ثم جاء فوضعها بين يدي السيد، وذهب الآخر واشترى الفاكهة في حجره ثم جاء فوضعها بين يدي السيد على الأرض، فكل واحد من العبدين قد امتثل، لكن أحدهما زاد من عنده القوصرة والمشموم فيصير أحب إلى السيد. فمن صلى النوافل مع الفرائض يصير أحب إلى الله، والمحبة من الله إرادة الخير، فإذا أحب عبده شغله بذكره وطاعته وحفظه من الشيطان، واستعمل أعضاءه في الطاعة، وحبب إليه سماع القرآن والذكر وكرَّه إليه سماع الغناء وآلات اللهو وصار من الذين قال الله تعالى: {وإذا خاطبهم الجاهلون قالوا سلاماً }[الفرقان: 63].فإذا سمعوا منهم كلاماً فاحشاً أضربوا عنه وقالوا قولاً يسلمون فيه، وحفظ بصره عن المحارم فلا ينظر إلى ما لا يحل له، وصار نظره فكر واعتبار، فلا يرى شيئاً من المصنوعات إلا استدل به على خالقه. وقال على رضي الله عنه: ما رأيت شيئاً إلا ورأيت الله تعالى قبله. ومعنى الاعتبار العبور الفكر في المخلوقات إلى قدرة الخالق، فيسبح عند ذلك ويقدس ويعظم وتصير حركاته باليدين والرجلين كلها لله تعالى ولا يمشي فيما لا يعنيه ولا يفعل بيده شيئاً عبثاً بل تكون حركاته وسكناته لله تعالى، فيثاب على ذلك في حركاته وسكناته وفي وفي سائر أفعاله. \nقوله تعالى: «كنت سمعه »يحتمل كنت الحافظ لسمعه ولبصره ولبطش يده ورجله من الشيطان، ويحتمل كنت في قلبه عند سمعه وبصره وبطشه. فإذا ذكرني كفَّ عن العمل لغيري.","audio":"https://raw.githubusercontent.com/mahmoodhamdi/nawawi_40_hadith_app/main/assets/audio/audio_38.mp3"},{"n":39,"text":"الحديث التاسع والثلاثون\n\nعن ابن عباس رضي الله عنهما أن رسول الله ﷺ قال: \"إن الله تجاوز لي عن أمتي الخطأ والنسيان وما استكرهوا عليه\". (حديث حسن رواه ابن ماجه والبيهقي وغيرهما)","explanation":"شرح وفوائد الحديث\nقوله ﷺ: «إن الله تعالى تجاوز لي عن أمتي الخطأ والنسيان وما استكرهوا عليه »أي تجاوز عنهم إثم الخطأ والنسيان وما استكرهوا عليه، وأما حكم الخطأ والنسيان والمكره عليه فغير مرفوع، فلو أتلف شيئاً خطأ أو ضاعت منه الوديعة نسياناً ضمن، ويستثنى من الإكراه علىالزنا والقتل فلا يباحان بالإكراه، ويستثنى من النسيان ما تعاطى الإنسان سببه فإنه يأثم بفعله لتقصيره.","audio":"https://raw.githubusercontent.com/mahmoodhamdi/nawawi_40_hadith_app/main/assets/audio/audio_39.mp3"},{"n":40,"text":"الحديث الأربعون\n\nعن ابن عمر رضي الله عنهما قال: أخذ رسول الله ﷺ بمنكبي فقال: \"كن في الدنيا كأنك غريب أو عابر سبيل، وكان ابن عمر رضي الله عنهما يقول: إذا أمسيت فلا تنتظر الصباح، وإذا أصبحت فلا تنتظر المساء، وخذ من صحتك لمرضك، ومن حياتك لموتك\". (رواه البخاري)","explanation":"شرح وفوائد الحديث\nقوله ﷺ: « كن في الدنيا كأنك غريب أو عابر سبيل » أي لا تركن إليها ولا تتخذها وطناً ولا تحدث نفسك بالبقاء فيها ولا تتعلق منها إلا بما يتعلق الغريب به في غير وطنه الذي يريد الذهاب منه إل أهله، وهذا معنى قول سلمان الفارسي رضي الله عنه: أمرني خليلي ﷺ أن لا أتخذ من الدنيا إلا كمتاع الراكب. \nوفي الحديث دليل على قصر الأمل وتقديم التوبة والاستعداد للموت فإن أمل فليقل إن شاء الله تعالى، قال الله تعالى: {ولا تقولن لشيء إني فاعل ذلك غداً إلا أن يشاء الله } [الكهف: 23-24]. \nقوله: «وخذ من صحتك » أمره ﷺ أن يغتنم أوقات الصحة بالعمل الصالح فيها، فإنه يعجز عن الصيام والقيام ونحوها لعلة تحصل من المرض والكبر. \nوقوله ﷺ: « ومن حياتك لموتك »، أمره ﷺ بتقديم الزاد. وهذا كقوله تعالى: {نظر نفسٌ ما قَدَّمتْ لِغد ٍ}[الحشر: 18]. لا يفرط فيها حتى يدركه الموت فيقول: {رب ارجعونِ لعلي أعمل صالحاً فيما تركت }[المؤمنون: 99: 100].وقال الغزالي رحمه الله تعالى: ابن آدم بدنه معه كالشبكة يكتسب بها الأعمال الصالحة، فإذا اكتسب خيراً ثم مات كفاه ولم يحتج بعد ذلك إلى الشبكة، وهو البدن الذي فارقه بالموت، ولا شك أن الإنسان إذا مات انقطعت شهوته من الدنيا واشتهت نفسه العمل الصالح لأنه زاد القبر، فإن كان معه استغنى به وإن لم يكن معه طلب الرجوع منها إلى الدنيا ليأخذ منها الزاد، وذلك بعد ما أخذت منه الشبكة فيقال له: هيهات قد فات! فيبقى متحيراً دائماً نادماً على تفريطه في أخذ الزاد قبل انتزاع الشبكة. \nفلهذا قال رسول الله ﷺ: وخذ من حياتك لموتك ». لا حول ولا قوة إلا بالله العلي العظيم ».","audio":"https://raw.githubusercontent.com/mahmoodhamdi/nawawi_40_hadith_app/main/assets/audio/audio_40.mp3"},{"n":41,"text":"الحديث الحادي والأربعون\n\nعن أبي محمد عبد الله بن عمرو بن العاص رضي الله عنهما قال: قال رسول الله ﷺ: \"لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به\". (حديث حسن صحيح، رويناه في كتاب الحجة بإسناد صحيح).","explanation":"شرح وفوائد الحديث\nقوله ﷺ: « لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به » يعني أن الشخص يجب عليه أن يعرض عمله على الكتاب والسنةويخالف هواه ويتبع ما جاء به ﷺ، وهذا نظير قوله تعالى: {وما كان لمؤمن ولا مؤمنة إذا قضى الله ورسوله أمراً أن يكون لهم الخيرة من أمرهم} [الأحزاب: 36]. فليس لأحد مع الله عز وجل ورسوله ﷺ أمر ولا هوى. \nوعن إبراهيم بن محمد الكوفي قال: رأيت الشافعي بمكة يفتي الناس، ورأيت إسحاق بن راهويه وأحمد بن حنبل حاضرين، فقال أحمد لإسحاق: تعال حتى أريك رجلاً لم تر عيناك مثله. فقال له إسحاق: لم تر عيناي مثله؟! قل نعم ؛ فجاء به فوقفه على الشافعي فذكر القصة إلى أن قال: ثم تقدم إسحاق إلى مجلس الشافعي فسأله عن كراء بيوت مكة، فقال الشافعي: هذا عندنا جائز. قال رسول الله ﷺ: «فهل ترك لنا عقيل من دار »؟ فقال إسحاق: أخبرنا يزيد ابن هارون عن هشام عن الحسن أنه لم يكن يرى ذلك، وعطاء وطاووس لم يكونا يريان ذلك، فقال له الشافعي: أنت الذي تزعم أهل خرسان أنك فقيههم؟ قال إسحاق: كذا يزعمون! قال الشافعي: ما أحوجني أن يكون غيرك في موضعك فكنت آمراً بفرك أذنيه، أنا أقول: قال رسول الله ﷺ: وأنت تقول: قال عطاء وطاووس والحسن وإبراهيم، هؤلاء لا يرون ذلك؟ وهل لأحد مع رسول الله ﷺ حجة؟ ثم قال الشافعي: قال الله تعالى: {للفقراء المهاجرين الذين أخرجوا من ديارهم} [الحشر: 8]. أفتنسب الديار إلى مالكين أو غير مالكين؟ قال إسحاق: إلى مالكين. قال الشافعي: فقول الله تعالى أصدق الأقاويل. وقد قال رسول الله ﷺ: « من دخل دار أبي سفيان فهو آمن ». وقد اشترى عمر بن الخطاب رضي الله تعالى عنه دار الحجلتين. وذكر الشافعي جماعات من أصحاب رسول الله ﷺ، فقال له إسحاق: {سواء العاكف فيه والباد }[الحج: 25].فقال له الشافعي: فالمراد به المسجد خاصة، وهو الذي حول الكعبة ولو كان كما تزعم لكان لا يجوز لأحد أن ينشد في دور مكة ضالة، ولا تحبس فيها البدن، ولا تلقى الأرواث، ولكن هذا في المسجد خاصة، فسكت إسحاق ولم يتكلم فسكت الشافعي عنه.","audio":"https://raw.githubusercontent.com/mahmoodhamdi/nawawi_40_hadith_app/main/assets/audio/audio_41.mp3"},{"n":42,"text":"الحديث الثاني والأربعون\n\nعن أنس رضي الله عنه قال: سمعت رسول الله ﷺ يقول: \"قال الله تعالى: يا ابن آدم إنك ما دعوتني ورجوتني غفرت لك على ما كان منك ولا أبالي، يا ابن آدم لو بلغت ذنوبك عنان السماء ثم استغفرتني غفرت لك، يا ابن آدم إنك لو أتيتني بقراب الأرض خطايا ثم لقيتني لا تشرك بي شيئاً لأتيتك بقرابها مغفرة\". (رواه الترمذي، وقال: حديث حسن صحيح).","explanation":"شرح وفوائد الحديث\nقوله تعالى: «عنان السماء »، هو بفتح العين المهملة قيل هوالسحاب وقيل: ما عن لك منها، أي ظهر إذا رفعت رأسك. \nقوله تعالى: « ثم استغفرتني غفرت لك »، هو نظير قوله تعالى: {ومن يعمل سوءاً أو يظلم نفسه ثم يستغفر الله يجد الله غفوراً رحيماً }[النساء: 110]. الاستغفار لا بد أن يكون مقروناً بالتوبة. قال الله تعالى: {وأن استغفروا ربكم ثم توبوا إليه }[هود: 3].وقال تعالى: {وتوبوا إلى الله جمعياً أيها المؤمنون لعلكم تفلحون }[النور: 31]. \nواعلم أن الاستغفار معناه طلب المغفرة وهو استغفار المذنبين، وقد يكون عن تقصير في أداء الشكر؛ وهو استغفار الأولياء والصالحين، وقد يكون لا عن واحد منهما بل يكون شكراً وهو استغفاره ﷺ واستغفار الأنبياء عليهم الصلاة والسلام قال ﷺ: « سيد الاستغفار: الله أنت ربي لا إله إلا أنت خلقتني وأنا عبدك وأنا على عهدك ووعدك ما استعطعت، أعوذ بك من شر ما صنعت أبوء لك بنعمتك على وأوبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت ». وقال ﷺ لأبي بكر رضي الله عنه: « قل اللهم إني ظلمت نفسي ظلماً كثيراً. وفي رواية ـ كبيراً ـ ولا يغفر الذنوب إلا أنت فاغفر لي مغفرة من عندك وارحمني إنك أنت الغفور الرحيم ».\nوهذا صلوا وسلموا على محمد وعلى آله وصحبه أجمعين","audio":"https://raw.githubusercontent.com/mahmoodhamdi/nawawi_40_hadith_app/main/assets/audio/audio_42.mp3"}],nawawiState='ready',nawawiFailure='';
function loadNawawiCorpus(){
 if(nawawiState!=='idle')return;
 nawawiState='loading';
 fetch('./data/nawawi42.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(v=>{
  if(!Array.isArray(v.items)||v.items.length!==42||v.items.some((x,i)=>x.n!==i+1||!x.text||!x.explanation))throw Error('invalid data');
  nawawiCorpus=v.items;nawawiState='ready';if(tab==='library'&&activeLibraryBook==='nawawi')render();
 }).catch(e=>{nawawiFailure=String(e);nawawiState='error';if(tab==='library'&&activeLibraryBook==='nawawi')render()});
}
function nawawiReaderHtml(){
 if(nawawiState==='idle')loadNawawiCorpus();
 if(nawawiState==='loading')return `<div class="hadith-status" role="status">⏳ جار تحميل نصوص الأحاديث الـ42 وشروحها…</div>`;
 if(nawawiState==='error')return `<div class="notice">تعذر تحميل نصوص الأحاديث الآن؛ تحققي من الاتصال أو افتحي التطبيق في المتصفح مباشرة. يمكنك الرجوع إلى الكتاب الرسمي من زر «كتاب الحفظ».</div>`;
 return `<div class="source-note"><b>📘 متن كامل + شرح لكل حديث:</b> هنا 42 حديثاً من «الأربعين النووية» بنصوصها وشروحها من قاعدة بيانات مفتوحة الاستخدام، مع صوت مرقّم من مشروع مفتوح المصدر مستقل. <b>قد تختلف الألفاظ والضبط عن نسخة حفظ الحلقة.</b> للمراجعة النهائية اعتمدي النسخة الرسمية للشيخ عبد المحسن القاسم. الأحاديث الثمانية الإضافية لابن رجب لم تُدرج نصوصها هنا بعد.</div>
 <div class="hadith-collection">${nawawiCorpus.map((h,i)=>{
  const id='nawawi-'+h.n,meta=MATN_INDEX.nawawi.flatMap(c=>c.items).find(x=>x.id===id),status=unitState('nawawi',id);
  const raw=h.text.replace(/^الحديث[^\n]*\n+/,'').trim();

ata-month="1">❮</button></div></div><div class="cal">${['أح','اث','ثل','أر','خم','جم','سب'].map(w=>`<div class="micro muted" style="text-align:center">${w}</div>`).join('')}${calendarCells()}</div><div class="chips" style="margin-top:12px"><span class="chip">🟢 حضور</span><span class="chip">🟠 يوم به حفظ/مراجعة</span><span class="chip">الرمادي: إجازة</span></div></section><section class="card" style="margin-top:16px"><div class="section-head"><h2>📖 الحفظ بحسب المتن</h2></div>${levelMatnStats()}</section>`}
function calendarCells(){const d=parse(calendarAnchor),ym=d.getFullYear(),mm=d.getMonth(),first=new Date(ym,mm,1),n=new Date(ym,mm+1,0).getDate();const blanks=Array.from({length:first.getDay()},()=>'<div></div>');return blanks.concat(Array.from({length:n},(_,i)=>{const day=dt(new Date(ym,mm,i+1)),r=db.days[day];return `<button class="calcell ${!workDay(day)?'nonwork':''} ${r?.attended?'hit':''} ${day===today?'current':''}" data-godate="${day}" ${day>today?'disabled':''}><b>${i+1}</b>${r?.attended?'✓':r?.saved&&(r.newPages||r.reviewPages)?'<span class="dot"></span>':' '}</button>`})).join('')}

document.addEventListener('input',e=>{if(e.target.closest('#day-form'))syncCard();if(e.target.id==='index-search'){const q=e.target.value.trim().toLocaleLowerCase('ar');document.querySelectorAll('.chapter').forEach(c=>{let visible=0;c.querySelectorAll('[data-unitrow]').forEach(x=>{const match=x.dataset.search.toLocaleLowerCase('ar').includes(q);x.hidden=!match;if(match)visible++});c.hidden=!visible;if(q&&visible)c.open=true})}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-level],[data-openbook],[data-memunit],[data-reviewunit],[data-useunit],[data-shift],[data-month],[data-choosebook],[data-godate],[data-finish],[data-copy],[data-share],[data-export],[data-clear]');if(!t)return;const d=t.dataset;if(d.tab){tab=d.tab;selected=today;render();window.scrollTo(0,0)}else if(d.level){libraryLevel=d.level;activeLibraryBook=(LEVELS.find(x=>x.id===libraryLevel)||LEVELS[0]).books[0][0];render()}else if(d.openbook){if(BOOKS[d.openbook]){activeLibraryBook=d.openbook;render()}}else if(d.memunit||d.reviewunit){const token=d.memunit||d.reviewunit;const [bk,un]=token.split('|');if(BOOKS[bk]&&MATN_INDEX[bk]?.some(c=>c.items.some(u=>u.id===un))){let key=bk+':'+un;let old=db.units[key]||{};if(d.memunit){db.units[key]={...old,memorized:!old.memorized,memorizedAt:!old.memorized?today:null}}else{db.units[key]={...old,reviewCount:(old.reviewCount||0)+1,lastReviewed:today}}persist();render();toast(d.memunit?'تم تحديث حالة الحفظ 🌼':'تم تسجيل مراجعة المقطع 🌿')}}else if(d.useunit){const [bk,un]=d.useunit.split('|');let unit=MATN_INDEX[bk]?.flatMap(c=>c.items).find(u=>u.id===un);if(unit&&BOOKS[bk]){tab='home';selected=today;render();let f=document.getElementById('day-form');if(f){f.elements.book.value=bk;f.elements.newText.value=unit.title;f.elements.newFrom.value=String(unit.number);f.elements.newTo.value=String(unit.number);syncCard()}window.scrollTo(0,0);toast('أضفنا الموضع إلى بطاقة اليوم؛ احفظي البطاقة بعد التسميع')}}else if(d.shift){let next=add(selected,Number(d.shift));if(next<=today){selected=next;render()}}else if(d.month){let x=parse(calendarAnchor);x.setDate(1);x.setMonth(x.getMonth()+Number(d.month));calendarAnchor=dt(x);render()}else if(d.choosebook){const book=BOOKS[d.choosebook];if(book){db.profile.book=book.id;db.profile.level=book.level;persist();render();toast('اخترتِ المتن الحالي 🌿')}}else if(d.godate){selected=d.godate;tab='home';render();window.scrollTo(0,0)}else if(d.finish){markReview(d.finish)}else if(d.copy||d.share){const form=document.getElementById('day-form');let card=autoCard(form?dataFromForm(form):getDay(selected));if(d.share&&navigator.share){navigator.share({text:card}).catch(()=>{})}else{copyText(card).then(()=>toast('نُسخت بطاقة الحضور 🌼')).catch(()=>toast('اختاري النص وانسخيه يدويًا'))}}else if(d.export){exportData()}else if(d.clear){if(confirm('هل تريدين فعلًا مسح جميع بطاقاتك ومراجعاتك واسمك من هذا المتصفح؟')){if(confirm('تأكيد أخير: هل لديك نسخة احتياطية؟')){db=emptyDB();persist();tab='home';selected=today;render();toast('تم مسح البيانات المحلية')}}}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script><!-- PAGEWIZARD_START --><script>
/* رفيقة المتون — مساعد صفحات الحفظ، v1. يقرأ طبعات تم التحقق من مواضعها فقط. */
(()=>{
'use strict';
const KEY='rafiqah-pages-selection-v1';
const ED={
 'full-1441':{label:'الأذكار والآداب — التمهيدي، طبعة 1441هـ',pdf:'https://islamcontent.com/storage/contents/13700/ar-2807403-pp-athkaar.pdf'},
 'short-1445':{label:'مختصر الأذكار والآداب — 1445هـ',pdf:'https://d1.islamhouse.com/data/ar/ih_books/single_010/ar-0102mukhtasaralathkaar.pdf'},
 'full-1445':{label:'الأذكار والآداب — المستوى الأول، طبعة 1445هـ (قيد فهرسة الصفحات)',pdf:'https://files.a-alqasim.com/books/mutoon/0101Athkaar.pdf'}
};
const CHAPTERS=[['athkar-1','فضل طلب العلم'],['athkar-2','فضل تعلّم القرآن'],['athkar-3','فضل الذكر'],['athkar-4','فضل مجالس الذكر'],['athkar-5','دخول الخلاء'],['athkar-6','الخروج من الخلاء'],['athkar-7','إذا فرغ من الوضوء'],['athkar-8','الأذان'],['athkar-9','دخول المسجد والخروج منه']];
// [صفحة البداية، صفحة النهاية] لكل حديث، كما ورد في طبعة المصدر المحددة.
const MAP={
 'full-1441':{
  'athkar-1':[[11,11],[11,11],[11,12]],
  'athkar-2':[[13,13],[13,13],[14,14]],
  'athkar-3':[[15,15],[15,15],[15,15]],
  'athkar-4':[[16,16]], 'athkar-5':[[19,19]],'athkar-6':[[20,20]],'athkar-7':[[21,21]],
  'athkar-8':[[24,24],[24,24],[25,25],[25,26]],'athkar-9':[[27,27]]
 },
 'short-1445':{
  'athkar-1':[[11,11],[11,11],[11,12]],
  'athkar-2':[[13,13],[13,13],[14,14]],
  'athkar-3':[[15,15],[15,15],[16,16]],
  'athkar-4':[[17,17]],'athkar-5':[[21,21]],'athkar-6':[[22,22]],'athkar-7':[[23,23]],
  'athkar-8':[[24,24]],'athkar-9':[[25,25]]
 }
};
const css=document.createElement('style');
css.textContent=`.pgwizard{padding:14px;border:1px solid #b8ddc9;background:linear-gradient(150deg,#f0fbf4,#f7faf5);border-radius:17px;display:grid;gap:10px}.pgwizard h4{font-size:14px;color:#235f4a;margin:0}.pgwizard .wfield{display:grid;gap:5px}.pgwizard .wfield>label{font-size:11px;font-weight:750;color:#496f5d}.pgwizard .wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pgwizard .wresult{font-size:13px;line-height:1.8;padding:11px 12px;border-radius:12px;background:white;border:1px solid #d3e5d8;color:#27664f}.pgwizard .wresult.warn{background:#fff7eb;border-color:#f2dfc4;color:#8b6735}.pgwizard .wlink{font-size:12px;text-decoration:underline;color:#216b52}.pgwizard .whint{font-size:11px;color:#617a6a}.pgwizard input,.pgwizard select{padding:9px 10px;font-size:13px}.pgwizard .whead{display:flex;justify-content:space-between;align-items:center;gap:8px}.pgwizard .wbadge{font-size:10px;color:#38765a;background:#e0f1e6;border-radius:12px;padding:3px 8px}@media(max-width:420px){.pgwizard .wgrid{gap:7px}.pgwizard{padding:11px}}`;
document.head.append(css);
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function names(side){return {book:side==='new'?'book':'reviewBook',edition:side+'Edition',chapter:side+'Chapter',start:side+'HadithFrom',end:side+'HadithTo',from:side+'From',to:side+'To',pages:side+'Pages',text:side+'Text'};}
function getData(date){try{const a=JSON.parse(localStorage.getItem(KEY)||'{}');return a[date]||{}}catch{return {}}}
function dateKey(){return (typeof selected==='string'&&selected)||new Date().toISOString().slice(0,10);}
function displayWizard(f,side){const n=names(side),v=getData(dateKey()),existing=(typeof getDay==='function'?getDay(dateKey()):{})||{};
 const edition=existing[n.edition]||v[n.edition]||'full-1441',chapter=existing[n.chapter]||v[n.chapter]||'athkar-1';
 const hs=existing[n.start]??v[n.start]??'',he=existing[n.end]??v[n.end]??'';
 return `<div class="pgwizard" data-side="${side}"><div class="whead"><h4>🧮 حاسبة الصفحات الذكية</h4><span class="wbadge">تعبئة تلقائية</span></div>
 <div class="wfield"><label>اختاري نسخة الكتاب أولًا</label><select name="${n.edition}">${Object.entries(ED).map(([k,x])=>`<option value="${k}" ${k===edition?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>
 <div class="wfield"><label>الباب</label><select name="${n.chapter}">${CHAPTERS.map(([k,l])=>`<option value="${k}" ${k===chapter?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
 <div class="wgrid"><div class="wfield"><label>من الحديث رقم</label><input name="${n.start}" type="number" min="1" step="1" inputmode="numeric" placeholder="١" value="${esc(hs)}"></div><div class="wfield"><label>إلى الحديث رقم</label><input name="${n.end}" type="number" min="1" step="1" inputmode="numeric" placeholder="٣" value="${esc(he)}"></div></div>
 <div class="wresult" id="${side}-page-result" aria-live="polite">اختاري أرقام الأحاديث، وسيظهر المدى إن كان موثّقًا.</div>
 <div class="whint">عند الحساب: تُحتسب كل صفحة يشملها المدى، حتى لو كان الحديث في جزء منها. ويمكن إدخال صفحات البداية والنهاية يدويًا في الخانات أدناه لأي متن آخر.</div>
 <a class="wlink" data-edition-link="${side}" target="_blank" rel="noopener noreferrer" href="${esc(ED[edition]?.pdf)}">📖 التحقق من صفحات الطبعة المعتمدة</a></div>`;}
function mount(){const f=document.getElementById('day-form');if(!f||f.querySelector('[data-side="new"]'))return;
 for(const [side,i] of [['new',0],['review',1]]){
  const section=f.querySelectorAll('.form-section')[i];if(!section)continue;
  const el=document.createElement('div');el.innerHTML=displayWizard(f,side);
  const target=section.querySelector('.form-row.triple');if(target)target.before(el.firstElementChild);
 }
 refresh(f,null,false);
}
function isInt(v){return /^\d+$/.test(String(v||''))&&Number(v)>0&&Number.isSafeInteger(Number(v));}
function setResult(f,side,message,warning=false){const el=f.querySelector('#'+side+'-page-result');if(el){el.className='wresult'+(warning?' warn':'');el.textContent=message;}}
function refresh(f,target=null,apply=true){if(!f)return;
 for(const side of ['new','review']){
  const n=names(side),bk=f.elements[n.book]?.value,edition=f.elements[n.edition]?.value,chapter=f.elements[n.chapter]?.value;
  if(!f.elements[n.edition])continue;
  const p=MAP[edition]?.[chapter],start=f.elements[n.start]?.value,end=f.elements[n.end]?.value;
  const source=ED[edition];const link=f.querySelector(`[data-edition-link="${side}"]`);if(link&&source)link.href=source.pdf;
  const manualChange=target&&(target.name===n.from||target.name===n.to);
  if(manualChange){ // الانتهاء من تحديد أرقام الحديث عند التصحيح اليدوي
   f.elements[n.start].value='';f.elements[n.end].value='';
   const a=f.elements[n.from].value.trim(),b=f.elements[n.to].value.trim();
   if(isInt(a)&&isInt(b)&&+b>=+a){f.elements[n.pages].value=(+b-+a+1);setResult(f,side,`📖 الصفحات ${a}–${b} · ${+b-+a+1===1?'صفحة واحدة':+b-+a+1===2?'صفحتان':(+b-+a+1)+' صفحات'} (من إدخالك اليدوي، غير متحقق من فهرس المتن).`)}
   else setResult(f,side,'أدخلي صفحتي البداية والنهاية يدويًا؛ سأحسب عدد الصفحات فورًا.',true);
   continue;
  }
  if(bk!=='athkar'){
   setResult(f,side,'هذا المتن لم تُراجع بعد خريطة أرقام أحاديثه وصفحاته. استخدمي خانتي من صفحة وإلى صفحة أدناه وسيُحسب العدد تلقائيًا، دون تخمين.',true);continue;
  }
  if(!start&&!end){setResult(f,side,'مثال: فضل طلب العلم، من الحديث ١ إلى ٣ ← الصفحات ١١–١٢، صفحتان في الطبعة المحددة.');continue;}
  if(!isInt(start)||!isInt(end)||Number(end)<Number(start)){
   setResult(f,side,'أدخلي رقم الحديث الأول والأخير بترتيب صحيح.',true);continue;
  }
  if(!p||!p[Number(start)-1]||!p[Number(end)-1]){
   setResult(f,side,'لم أوثّق بعد صفحات هذه الأحاديث في هذه الطبعة. لا يمكن حسابها بدقة تلقائيًا حاليًا؛ أدخلي من صفحة وإلى صفحة أدناه.',true);continue;
  }
  const first=p[Number(start)-1][0],last=p[Number(end)-1][1],count=last-first+1;
  setResult(f,side,`✅ من صفحة ${first} إلى ${last} · ${count===1?'صفحة واحدة':count===2?'صفحتان':count+' صفحات'} · حسب ${source.label}`);
  if(apply){f.elements[n.from].value=first;f.elements[n.to].value=last;f.elements[n.pages].value=count;
   const title=CHAPTERS.find(x=>x[0]===chapter)?.[1]||'الباب';
   const label=`${title} · الحديث ${start}${start!==end?' إلى '+end:''}`;
   const input=f.elements[n.text];
   if(input&&(!input.value||input.dataset.smartLabel==='1')){input.value=label;input.dataset.smartLabel='1'}
  }
 }
}
// ملاحظة: الدالة الأم تحفظ السجلات القديمة كما هي؛ نضيف بيانات التحديد فقط عند الحفظ الجديد.
if(typeof window.dataFromForm==='function'){
 const previous=window.dataFromForm;
 window.dataFromForm=function(form){const x=previous(form);if(form?.id==='day-form'){
   for(const side of ['new','review']){const n=names(side);for(const k of ['edition','chapter','start','end']){
     const field=n[k];x[field]=form.elements[field]?.value??'';
   }}
 }return x};
}
if(typeof window.autoCard==='function'){
 const original=window.autoCard;
 window.autoCard=function(x){let s=original(x);const fmt=(side)=>{
   const a=x[side+'From'],b=x[side+'To'];return isInt(a)&&isInt(b)?`📍 ${side==='new'?'صفحات الحفظ':'صفحات المراجعة'}: ${a}${a===b?'':'–'+b}`:'';
 };
 const n=fmt('new'),r=fmt('review');
 if(n)s=s.replace(/\n🌼 عدد صفحات الحفظ:/,'\n'+n+'\n🌼 عدد صفحات الحفظ:');
 if(r)s=s.replace(/\n🌼عدد الصفحات:/,'\n'+r+'\n🌼عدد الصفحات:');return s;
 };
}
const root=document.getElementById('root');if(root){const obs=new MutationObserver(()=>mount());obs.observe(root,{childList:true});}
mount();
// المستمعون المسجلون من التطبيق الأصلي يعملون أولاً؛ نحدّث الحسبة بعدهم مباشرة.
document.addEventListener('change',e=>{const f=e.target.closest('#day-form');if(!f)return;const t=e.target;
 const side=t.name?.startsWith('review')?'review':'new';const n=names(side);
 if(t.name===n.book){f.elements[n.start].value='';f.elements[n.end].value='';}
 if(t.name===n.edition||t.name===n.chapter){f.elements[n.start].value='';f.elements[n.end].value='';}
 refresh(f,t,true);if(typeof window.syncCard==='function')window.syncCard();
});
document.addEventListener('input',e=>{const f=e.target.closest('#day-form');if(!f)return;
 if(!/^(new|review)(HadithFrom|HadithTo|From|To)$/.test(e.target.name||''))return;
 refresh(f,e.target,true);if(typeof window.syncCard==='function')window.syncCard();
});
})();

</script><!-- PAGEWIZARD_END -->
</body></html>

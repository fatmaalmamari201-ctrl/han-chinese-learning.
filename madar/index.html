<script>

const dateLabel=(s,opts={day:'numeric',month:'short'})=>{try{return new Intl.DateTimeFormat('ar-OM',opts).format(fromDay(s))}catch{return s}};
const hm=(v)=>`${Math.floor(v/60)}س ${Math.round(v%60)}د`;
const esc=x=>String(x??'').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));

let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh();if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.courses)||!data.meta)throw 0;}catch{data=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('تعذر الحفظ محليًا؛ تحققي من مساحة التخزين')}}
function activityDates(){const s=new Set();data.tasks.filter(t=>t.done&&t.completedAt).forEach(t=>s.add(t.completedAt));data.sessions.forEach(x=>s.add(x.date));data.habits.forEach(h=>(h.dates||[]).forEach(x=>s.add(x)));return s}
function streak(){const a=activityDates();let d=today();if(!a.has(d))d=addDays(d,-1);let n=0;while(a.has(d)&&n<3000){n++;d=addDays(d,-1)}return n}
function sessionsFor(subj=null,n=7){const start=addDays(today(),-(n-1));return data.sessions.filter(s=>s.date>=start&&(!subj||s.subject===subj))}
function minutes(ss){return Math.round(ss.reduce((n,x)=>n+(Number(x.minutes)||0),0))}
function tasksDone(ts=data.tasks){return ts.filter(t=>t.done).length}
function courseObj(id){return data.courses.find(x=>x.id===id)}
function courseStats(c){const topics=c.topics||[];const covered=topics.filter(t=>t.done).length;return {topics:topics.length,covered,percent:pct(covered,topics.length),minutes:minutes(sessionsFor(c.id,7)),sessions:sessionsFor(c.id,7).length}}
function progressProject(p){const m=p.milestones||[];return {done:m.filter(x=>x.done).length,total:m.length,pct:pct(m.filter(x=>x.done).length,m.length)}}
function priorityText(p){return p==='A'?'عالية':p==='B'?'متوسطة':'مرنة'}
function categoryTag(key){const c=CAT[key]||CAT.life;return `<span class="tag" style="color:${c[2]};background:${c[2]}13">${c[0]} ${c[1]}</span>`}
function taskScore(t){const dist=t.due?Math.round((fromDay(t.due)-fromDay(today()))/864e5):99;return (t.priority==='A'?200:t.priority==='B'?100:30)+(dist<0?150:dist===0?110:dist===1?70:dist<7?20:0)+(t.planDate===today()?65:0)}
function sortTasks(ts){return [...ts].sort((a,b)=>(Number(a.done)-Number(b.done))||taskScore(b)-taskScore(a))}
const navMain=['home','tasks','university','focus','week','goals','habits','analytics','review','settings'];

let focused={running:false,paused:false,started:0,elapsed:0,target:25,subject:'PMMT'},focusTicker=null;
let toastTimeout;
function toast(message){const el=document.getElementById('toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),3200)}
const action=(name,id='',additional='')=>`data-act="${esc(name)}" data-id="${esc(id)}" ${additional}`;
function side(){return `<aside class="side"><div class="brand"><div class="brand-logo">م</div><div><div class="brand-title">مَدار <span style="font-size:12px;color:var(--purple)">✦</span></div><small>PERSONAL COMMAND CENTER</small></div></div><div class="side-group">نظام التشغيل</div><nav class="side-nav">${navMain.map((id,i)=>`${i===5?'<div class="side-group">حياتك الأوسع</div>':''}<button class="nav-btn ${page===id?'active':''}" data-nav="${id}"><span class="ni">${ICONS[id]}</span>${PAGES[id]}</button>`).join('')}</nav><div class="side-bottom"><div class="mini-label">YOUR SYSTEM</div><strong>وضوح ← قرار ← تنفيذ</strong><p>التقدم الحقيقي يُسجّل، ولا يُفترض. خطتك تتكيّف معك.</p><div class="progress"><i style="width:${pct(tasksDone(),data.tasks.length)}%;background:#7467e7"></i></div><small>${tasksDone()} من ${data.tasks.length} مهام مكتملة</small></div></aside>`}
function mobileNav(){const b=[['home','⌂','الرئيسية'],['tasks','☑','المهام'],['university','▤','موادي'],['focus','◎','تركيز'],['more','☷','المزيد']];return `<nav class="bottomnav" aria-label="التنقل الرئيسي">${b.map(([id,icon,label])=>`<button class="${page===id||(id==='more'&&overflow)?'active':''}" ${id==='more'?'data-act="more"':`data-nav="${id}"`}><span>${icon}</span>${label}</button>`).join('')}</nav>${overflow?`<div class="over-menu">${['week','goals','habits','analytics','review','settings'].map(k=>`<button data-nav="${k}">${ICONS[k]} ${PAGES[k]}</button>`).join('')}</div>`:''}`}

function render(){document.documentElement.dataset.theme=data.meta.theme==='dark'?'dark':'light';document.getElementById('app').innerHTML=`<div class="shell">${side()}<main class="main">${header()}${({home:homePage,tasks:tasksPage,university:universityPage,focus:focusPage,week:weekPage,goals:goalsPage,habits:habitsPage,analytics:analyticsPage,review:reviewPage,settings:settingsPage}[page]||homePage)()}</main></div>${mobileNav()}`;if(page==='focus')syncTimer();if(!data.meta.onboarded&&!document.querySelector('.modal-back'))showModal('welcome')}
function section(title,subtitle='',button=''){return `<div class="section"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${button}</div>`}
function statCard(icon,color,label,value,foot){return `<div class="card kpi ${color}"><div class="kpi-top"><span class="symbol" style="color:var(--${color});background:color-mix(in srgb,var(--${color}) 13%,transparent)">${icon}</span><span style="font-size:10px;color:var(--muted)">●</span></div><div class="kpi-label">${label}</div><div class="kpi-num">${value}</div><div class="kpi-footer">${foot}</div><i class="accent"></i></div>`}
function renderTask(t,mode='normal'){const metadata=[categoryTag(t.category),t.subject?`<span>📘 ${esc(t.subject)}</span>`:'',t.due?`<span style="${t.due<today()&&!t.done?'color:#d75865;font-weight:900':''}">📆 ${dateLabel(t.due)}</span>`:'',`<span>⏳ ${t.minutes||25} دقيقة</span>`].filter(Boolean).join('');return `<div class="task ${t.done?'done':''}"><button class="tick ${t.done?'checked':''}" ${action('task-toggle',t.id)} title="${t.done?'إلغاء الإنجاز':'إنجاز المهمة'}">${t.done?'✓':''}</button><div class="task-body"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${metadata}</div></div><span class="pill ${t.priority==='A'?'high':t.priority==='B'?'medium':'low'}">${t.priority}</span><div class="task-actions">${mode!=='compact'?`<button class="mini-icon" ${action('task-plan',t.id)} title="${t.planDate===today()?'إزالة من اليوم':'ضع في خطة اليوم'}">${t.planDate===today()?'📌':'＋'}</button><button class="mini-icon" data-modal="task" data-id="${esc(t.id)}" title="تعديل">✎</button>`:''}</div></div>`}
function homePage(){const now=today(),tod=data.tasks.filter(x=>x.planDate===now||x.due===now),planned=tod.filter(x=>!x.done);const doneDay=data.tasks.filter(x=>x.done&&x.completedAt===now).length;const d1=fromDay(data.meta.createdAt),d2=fromDay(now);const dayNum=Math.max(1,Math.round((d2-d1)/864e5)+1);const focusM=minutes(sessionsFor(null,1));const urgent=sortTasks(data.tasks.filter(t=>!t.done&&t.due&&t.due<=addDays(now,1)));const top=sortTasks(planned.length?planned:data.tasks.filter(x=>!x.done)).slice(0,4);const habitsToday=data.habits.filter(x=>x.dates.includes(now)).length;return `<div class="hero"><div style="position:relative;z-index:1"><div class="hero-tag">YOUR LIFE, BY DESIGN · مدار</div><h2>${data.meta.name?`يا ${esc(data.meta.name)}، `:''}كل يوم واضح. كل خطوة محسوبة.</h2><p>ابدئي بالأولوية، قيسي التنفيذ، وراجعي المسار. برنامج واحد للدراسة والطموح والتطوير والحياة.</p><button class="btn" data-nav="tasks">✦ رتّبي مهامك الآن</button></div><div class="hero-art"><div class="hero-ring"><div class="hero-ring-inner"><strong>${dayNum}</strong><small>اليوم في مدار</small></div></div><p>العدّاد يبدأ من استخدامك الأول</p></div></div>

function weekPage(){const start=addDays(weekStart(today()),weekOffset*7);const dates=Array.from({length:7},(_,i)=>addDays(start,i));const tasks=data.tasks.filter(x=>x.due>=start&&x.due<=dates[6]||x.planDate>=start&&x.planDate<=dates[6]);return `<div class="card"><div class="between wrap"><div><strong>🗓️ أسبوع ${dateLabel(start)} — ${dateLabel(dates[6])}</strong><p class="muted sm">خططي بواقعية: يمكنك وضع مهمة لليوم من أي قائمة مهام.</p></div><div class="flex"><button class="icon-btn" data-act="week-next" title="الأسبوع التالي">‹</button><button class="btn sm ghost" data-act="week-reset">الأسبوع الحالي</button><button class="icon-btn" data-act="week-prev" title="الأسبوع السابق">›</button></div></div><div class="calendar-days" style="margin-top:16px">${dates.map(d=>{const ts=sortTasks(data.tasks.filter(x=>x.due===d||x.planDate===d));return `<div class="calendar-day ${d===today()?'today':''}"><div class="cal-head"><span>${dateLabel(d,{weekday:'short'})}</span>${d===today()?'<span class="pill" style="color:var(--purple)">اليوم</span>':''}</div><div class="cal-num">${fromDay(d).getDate()}</div>${ts.slice(0,4).map(t=>`<div class="calendar-task" style="border-color:${(CAT[t.category]||CAT.life)[2]};${t.done?'opacity:.45;text-decoration:line-through':''}" title="${esc(t.title)}">${esc(t.title)}</div>`).join('')}${ts.length>4?`<small class="muted">+${ts.length-4} مهمة</small>`:''}</div>`}).join('')}</div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="between"><strong>أهداف الأسبوع</strong><button class="link-btn" data-nav="university">المواد ←</button></div>${data.courses.map(c=>{const m=minutes(data.sessions.filter(s=>s.subject===c.id&&s.date>=start&&s.date<=dates[6]));return `<div class="course-bar"><span class="course-label" style="color:${c.color}">${esc(c.id)}</span><div class="progress"><i style="width:${pct(m,c.weeklyTarget)}%;background:${c.color}"></i></div><span class="val">${m}/${c.weeklyTarget}د</span></div>`}).join('')}</div><div class="card"><div class="between"><strong>التحضير القادم</strong><button class="link-btn" data-modal="task">＋ مهمة</button></div><div class="line"></div>${tasks.length?`<div class="task-list">${sortTasks(tasks).slice(0,5).map(x=>renderTask(x,'compact')).join('')}</div>`:empty('🗓️','أسبوع غير مجدول','أضيفي مواعيد لمهامك ليظهر توزيع العمل هنا.')}</div></div>`}
function goalCard(p,brief=false){const s=progressProject(p);const color=(CAT[p.area]||CAT.growth)[2];return `<div class="goal"><div class="goal-head"><div class="goal-emoji">${esc(p.symbol||'✦')}</div><div style="flex:1;min-width:0"><div class="goal-title">${esc(p.title)}</div><div class="goal-caption">${CAT[p.area]?.[1]||'أهداف'} · ${s.done}/${s.total} خطوة مكتملة</div></div><strong style="color:${color};font-size:19px">${s.pct}%</strong></div><div class="progress" style="margin:15px 0 12px"><i style="width:${s.pct}%;background:${color}"></i></div>${!brief?`<div class="line"></div>${p.milestones.length?p.milestones.map(m=>`<div class="milestone ${m.done?'done':''}"><button class="tick ${m.done?'checked':''}" ${action('milestone-toggle',p.id+':'+m.id)}>${m.done?'✓':''}</button><span style="flex:1">${esc(m.text)}</span><button class="mini-icon" ${action('milestone-delete',p.id+':'+m.id)} title="حذف الخطوة">×</button></div>`).join(''):'<p class="muted sm">لم تُضف خطوات لهذا الهدف.</p>'}<button class="link-btn" data-modal="milestone" data-id="${esc(p.id)}">＋ أضيفي خطوة للهدف</button><button class="mini-icon" ${action('project-delete',p.id)} title="حذف المشروع">🗑</button>`:''}</div>`}
function goalsPage(){return `<div class="between wrap" style="margin-bottom:17px"><p class="head-sub">هنا تتحول أهدافك الكبيرة إلى خطوات قابلة للقياس. الأهداف المضافة مبدئيًا هي قوالب قابلة للتعديل، وليست أعمالًا منجزة.</p><button class="btn primary" data-modal="project">✦ هدف جديد</button></div><div class="grid two">${data.projects.length?data.projects.map(p=>goalCard(p)).join(''):empty('✨','لا توجد أهداف بعد','أضيفي أول هدف طويل المدى.','project')}</div>`}
function habitList(brief=false){if(!data.habits.length)return empty('🌱','مساحة عاداتك','أضيفي عادة يومية، وأكمليها بضغطة واحدة.','habit');return data.habits.map(h=>`<div class="habit"><div class="h-icon" style="background:${h.color||'#7467e7'}1c">${esc(h.icon||'🌱')}</div><div class="habit-name">${esc(h.name)}<div class="muted sm">${(h.dates||[]).filter(d=>d>=addDays(today(),-6)).length} / 7 أيام مؤخرًا</div></div><button class="tick ${h.dates.includes(today())?'checked':''}" ${action('habit-toggle',h.id)} title="${h.dates.includes(today())?'إلغاء':'تأكيد'} إنجاز اليوم">${h.dates.includes(today())?'✓':''}</button>${!brief?`<button class="mini-icon" ${action('habit-delete',h.id)} title="حذف العادة">×</button>`:''}</div>`).join('')}
function habitsPage(){const hdone=data.habits.filter(h=>h.dates.includes(today())).length;return `<div class="grid three">${statCard('☘','teal','عادات اليوم',`${hdone}/${data.habits.length}`,'تم تسجيلها اليوم')}${statCard('♨','orange','سلسلة النشاط',streak(),'مرتبطة بالأنشطة المسجلة')}${statCard('◈','purple','المعدل اليومي',data.habits.length?`${pct(hdone,data.habits.length)}%`:'—','من عاداتك المسجلة')}</div>${section('خطة التكرار','اضغطي المربع عند تنفيذ العادة بالفعل',`<button class="btn primary sm" data-modal="habit">＋ عادة جديدة</button>`)}<div class="grid two"><div class="card">${habitList()}</div><div class="card"><strong>📅 نشاطك في آخر 35 يومًا</strong><p class="muted sm">الألوان ترتفع مع تسجيل الأنشطة، لا لمجرد فتح البرنامج.</p>${heatMap()}<div class="line"></div><div class="note">إضافة القراءة أو الحركة أو الرسم أو أي هواية عادةً اختيارية تمامًا؛ اختاري ما له معنى لك.</div></div></div>`}
function heatMap(){const a=activityCounts();const ds=Array.from({length:35},(_,i)=>addDays(today(),i-34));return `<div class="heatmap">${ds.map(d=>{const val=a[d]||0;return `<i class="${val>4?'a4':val>2?'a3':val>1?'a2':val>0?'a1':''}" title="${d}: ${val} نشاط"></i>`}).join('')}</div><div class="between sm muted" style="margin-top:7px"><span>قبل 35 يومًا</span><span>اليوم</span></div>`}
function activityCounts(){const x={};function add(d,n=1){if(d)x[d]=(x[d]||0)+n}data.tasks.forEach(t=>{if(t.done)add(t.completedAt)});data.sessions.forEach(s=>add(s.date));data.habits.forEach(h=>(h.dates||[]).forEach(d=>add(d)));return x}
function analyticsPage(){const d0=addDays(today(),-analyticsRange+1),complete=data.tasks.filter(t=>t.done&&t.completedAt>=d0).length,ss=sessionsFor(null,analyticsRange);const mm=minutes(ss),act=activityDates(),active=Array.from({length:analyticsRange},(_,i)=>addDays(today(),-i)).filter(d=>act.has(d)).length;const days=Array.from({length:analyticsRange},(_,i)=>addDays(today(),i-analyticsRange+1));const byDays=days.map(d=>minutes(ss.filter(s=>s.date===d)));const max=Math.max(30,...byDays);return `<div class="tab-row">${[7,14,30].map(n=>`<button class="tab ${analyticsRange===n?'active':''}" data-range="${n}">آخر ${n} أيام</button>`).join('')}</div><div class="grid four">${statCard('✓','teal','مهام منجزة',complete,'خلال الفترة المحددة')}${statCard('◎','purple','وقت التركيز',hm(mm),'مسجّل من جلساتك')}${statCard('♨','orange','أيام النشاط',`${active}/${analyticsRange}`,'أيام فيها إنجاز فعلي')}${statCard('◩','pink','جلسات موثقة',ss.length,'مكتملة ومسجلة')}</div>${section('منحنى الإنجاز','هل تزداد ساعاتك فعلًا أم مجرد الشعور بالإنتاجية؟')}
<div class="grid two"><div class="card"><div class="between"><strong>الدقائق المدروسة يوميًا</strong><span class="pill">${analyticsRange} يومًا</span></div><div class="bars">${days.map((d,i)=>`<div class="bar-col" title="${d}: ${byDays[i]} دقيقة"><i style="height:${Math.max(3,byDays[i]/max*100)}%"></i><small>${dateLabel(d,{day:'numeric'})}</small></div>`).join('')}</div><div class="chart-axis"><span>${dateLabel(days[0])}</span><span>${dateLabel(today())}</span></div><div class="note" style="margin-top:13px">تُحسب المدة المسجلة في مؤقت التركيز أو الجلسات التي أضفتِها يدويًا.</div></div><div class="card"><strong>توزيع الجهد بين المواد</strong><p class="muted sm">حصة كل مادة من وقت مذاكرتك خلال الفترة</p>${subjectDonut(ss)}<div style="margin-top:14px">${data.courses.map(c=>`<div class="between sm" style="margin-bottom:6px"><span><span class="color-dot" style="background:${c.color}"></span>${esc(c.title)}</span><strong>${minutes(ss.filter(x=>x.subject===c.id))} دقيقة</strong></div>`).join('')}</div></div></div>${section('المواد: قياس التغطية','مواضيع مكتملة + إجمالي جلسات الأسبوع')}
<div class="card">${data.courses.map(c=>{const s=courseStats(c);return `<div class="course-bar"><div class="course-label" style="color:${c.color}">${esc(c.id)}</div><div class="progress"><i style="width:${s.percent}%;background:${c.color}"></i></div><div class="val">${s.covered}/${s.topics} · ${s.percent}%</div></div>`}).join('')}<div class="line"></div><div class="between"><span class="muted">خريطة نشاط آخر 35 يومًا</span><span class="pill">سجل واقعي</span></div><div style="margin-top:12px">${heatMap()}</div></div>`}
function subjectDonut(ss){const arr=data.courses.map(c=>({color:c.color,value:minutes(ss.filter(s=>s.subject===c.id))}));const total=arr.reduce((n,x)=>n+x.value,0);if(!total)return `<div class="donut"><div class="donut-inner"><div><strong>0</strong><small class="muted" style="display:block">دقيقة بعد</small></div></div></div>`;let cursor=0;const stops=arr.filter(x=>x.value).map(x=>{const a=cursor;cursor+=x.value/total*100;return `${x.color} ${a}% ${cursor}%`});return `<div class="donut" style="background:conic-gradient(${stops.join(',')})"><div class="donut-inner"><div><strong>${total}</strong><small class="muted" style="display:block">دقيقة</small></div></div></div>`}
function weekSummary(start){const end=addDays(start,6);const ss=data.sessions.filter(s=>s.date>=start&&s.date<=end);return {mins:minutes(ss),completed:data.tasks.filter(t=>t.done&&t.completedAt>=start&&t.completedAt<=end).length,habits:data.habits.reduce((n,h)=>n+h.dates.filter(d=>d>=start&&d<=end).length,0)}}
function reviewPage(){const start=weekStart(today()),info=weekSummary(start),review=data.reviews[start]||{};return `<div class="card" style="margin-bottom:15px"><div class="between wrap"><div><strong>🧠 اجتماعك الأسبوعي مع نفسك</strong><p class="muted sm">الأسبوع الحالي: ${dateLabel(start)} إلى ${dateLabel(addDays(start,6))}</p></div><span class="pill">Strategic Review</span></div><div class="grid three" style="margin-top:13px">${statCard('✓','teal','مهام أغلقتها',info.completed,'هذا الأسبوع')}${statCard('◎','purple','وقت الدراسة',hm(info.mins),'جلسات مسجّلة')}${statCard('☘','orange','تكرارات العادات',info.habits,'تأكيدات يومية')}</div></div><div class="card"><form id="review-form" class="form-stack"><div class="form-control"><label for="review-win">١. ما الإنجاز الحقيقي الذي أعتز به؟</label><textarea class="field" id="review-win" name="wins" rows="3" placeholder="نتيجة ملموسة…">${esc(review.wins||'')}</textarea></div><div class="form-control"><label for="review-challenge">٢. ما الذي عطّل التنفيذ؟</label><textarea class="field" id="review-challenge" name="challenge" rows="3" placeholder="المشكلة والسبب، دون تجميل…">${esc(review.challenge||'')}</textarea></div><div class="form-control"><label for="review-action">٣. ما التعديل المحدد للأسبوع القادم؟</label><textarea class="field" id="review-action" name="next" rows="3" placeholder="قرار واحد واضح قابل للتنفيذ…">${esc(review.next||'')}</textarea></div><div class="between"><small class="muted">المراجعة تحفظ بتاريخ بداية الأسبوع</small><button class="btn primary" type="submit">حفظ مراجعتي ✓</button></div></form></div>`}
function settingsPage(){return `<div class="grid two"><div class="card"><h3>⚙️ تفضيلات النظام</h3><div class="setting-row"><div><strong>اسمك في لوحة القيادة</strong><div class="muted sm">اختياري</div></div><input class="field" maxlength="30" id="name-setting" value="${esc(data.meta.name||'')}" placeholder="الاسم"></div><div class="setting-row"><div><strong>هدف التركيز اليومي</strong><div class="muted sm">بالدقائق</div></div><select class="field" id="target-setting">${[30,45,60,90,120,180,240,360].map(n=>`<option value="${n}" ${data.meta.dailyTarget===n?'selected':''}>${n} دقيقة</option>`).join('')}</select></div><div class="setting-row"><strong>مظهر التطبيق</strong><button class="btn sm ghost" data-act="theme">${data.meta.theme==='dark'?'☀ فاتح':'☾ داكن'}</button></div><button class="btn primary" data-act="settings-save" style="margin-top:15px">حفظ التفضيلات</button></div><div class="card"><h3>📘 أهداف موادك الأسبوعية</h3><p class="muted sm">تعديلات الأهداف لا تغيّر ساعاتك المسجلة.</p>${data.courses.map(c=>`<div class="setting-row"><strong style="color:${c.color}">${esc(c.id)}</strong><div class="flex"><input class="field" id="target-${esc(c.id)}" type="number" min="15" max="3000" step="15" value="${c.weeklyTarget}" style="width:94px"><span class="sm muted">دقيقة</span></div></div>`).join('')}<button class="btn primary" data-act="courses-save" style="margin-top:13px">حفظ أهداف المواد</button></div></div>${section('بياناتك وخصوصيتك','بياناتك محفوظة محليًا على هذا الجهاز والمتصفح، لا تُرسل إلى خادم مدار')}<div class="card"><div class="grid two"><div><h3>📦 نسخة احتياطية</h3><p class="muted sm">لتغيير الهاتف أو المتصفح، صدّري ملف بيانات JSON واستورديه من الجهاز الآخر.</p><button class="btn" data-act="export">↓ تصدير نسخة احتياطية</button></div><div><h3>↥ استعادة البيانات</h3><p class="muted sm">الاستيراد يستبدل بيانات مدار الحالية بعد تأكيدك.</p><label class="btn" style="cursor:pointer" for="import-json">↑ اختيار ملف نسخة احتياطية</label><input type="file" accept="application/json,.json" id="import-json" class="hidden"></div></div><div class="line"></div><div class="between wrap"><div><strong>بدء نظام جديد</strong><div class="muted sm">يمسح جميع المهام والجلسات والعادات المسجلة على هذا الجهاز فقط.</div></div><button class="btn danger sm" data-act="reset">حذف البيانات المحلية</button></div></div>`}
function focusPage(){const ss=sessionsFor(null,1),saved=minutes(ss);return `<div class="focus-container"><div class="card"><div class="eyebrow" style="color:var(--purple);letter-spacing:2px">DEEP WORK MODE</div><h2 style="font-size:28px;margin:8px 0">جلسة عمل عميق</h2><p class="muted">حددي مادة أو مجالًا، وأكملي وقتًا حقيقيًا دون ادّعاء إنجاز.</p><div class="form-control" style="max-width:300px;margin:17px auto"><label for="focus-subject">الجلسة مخصصة لـ</label><select id="focus-subject" class="field" ${focused.running?'disabled':''}>${data.courses.map(x=>`<option value="${esc(x.id)}" ${focused.subject===x.id?'selected':''}>📘 ${esc(x.id)}</option>`).join('')}<option value="general" ${focused.subject==='general'?'selected':''}>✦ تطوير ومهام عامة</option></select></div><div class="focus-orb"><div><strong id="clock">${formatClock(focused.target*60)}</strong><small id="clock-label">${focused.running?'الوقت جارٍ':'جاهزة للبدء'}</small></div></div><div class="focus-controls" style="margin-bottom:18px">${[25,50,90].map(n=>`<button class="focus-preset ${focused.target===n?'selected':''}" data-preset="${n}" ${focused.running?'disabled':''}>${n} دقيقة</button>`).join('')}</div><div class="focus-controls">${focused.running?`<button class="btn ${focused.paused?'primary':'ghost'}" data-act="focus-pause">${focused.paused?'▶ متابعة':'Ⅱ إيقاف مؤقت'}</button><button class="btn primary" data-act="focus-finish">✓ إنهاء وتسجيل</button><button class="btn danger" data-act="focus-cancel">إلغاء الجلسة</button>`:`<button class="btn primary" data-act="focus-start" style="min-width:210px">▶ ابدئي التركيز</button>`}</div><div class="line"></div><div class="between wrap"><div><strong>دقائق مسجلة اليوم: ${saved}</strong><div class="muted sm">هدف اليوم: ${data.meta.dailyTarget} دقيقة</div></div><button class="btn sm ghost" data-modal="session">＋ أضيفي جلسة سابقة</button></div><div class="progress" style="margin-top:12px"><i style="width:${pct(saved,data.meta.dailyTarget)}%;background:var(--teal)"></i></div></div></div>`}
function formatClock(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function focusSeconds(){return focused.elapsed+(focused.running&&!focused.paused?Math.max(0,Math.floor((Date.now()-focused.started)/1000)):0)}
function syncTimer(){const clock=document.getElementById('clock'),lab=document.getElementById('clock-label');if(!clock)return;clock.textContent=formatClock(Math.max(0,focused.target*60-focusSeconds()));if(lab)lab.textContent=focused.running?(focused.paused?'متوقفة مؤقتًا':focusSeconds()>=focused.target*60?'الهدف تحقق! يمكنك إنهاء الجلسة':'الوقت جارٍ'):'جاهزة للبدء'}
focusTicker=setInterval(()=>{if(page==='focus')syncTimer()},1000);
function showModal(type,id='',subject=''){const root=document.getElementById('modal-root');let title='',body='';const fld=(label,control)=>`<div class="form-control"><label>${label}</label>${control}</div>`;
if(type==='welcome'){title='مرحبًا بك في مَدار ✦';body=`<p class="muted">نظامك الشخصي بدأ الآن. كل قسم قابل للتطوير لاحقًا، وكل رقم في لوحتك يبدأ من الصفر.</p><form id="onboard-form" class="form-stack">${fld('كيف تحبين يظهر اسمك؟ (اختياري)','<input name="name" class="field" maxlength="30" placeholder="يمكن تركه فارغًا">')}${fld('ما هدف التركيز الواقعي في اليوم؟',`<select name="target" class="field"><option value="60">ساعة يوميًا</option><option value="90">90 دقيقة</option><option value="120" selected>ساعتان يوميًا</option><option value="180">3 ساعات</option><option value="240">4 ساعات</option></select>`)}<div class="note">أنشأت لك مواد PMMT وTP1 وEIM وDBA، وقوالب اختيارية لمشروع SCADA ومنحة الصين والصينية. كلها تبدأ بلا إنجازات مسجلة.</div><button class="btn primary" type="submit" style="width:100%">ابدئي مركز قيادتي ←</button></form>`}
if(type==='task'){const t=data.tasks.find(t=>t.id===id);title=t?'تعديل المهمة':'مهمة جديدة';const initialSubject=t?.subject||subject;const cat=t?.category||(initialSubject?'university':'university');body=`<form id="task-form" class="form-stack" data-id="${esc(id)}">${fld('عنوان المهمة *',`<input name="title" class="field" required autofocus maxlength="150" value="${esc(t?.title||'')}" placeholder="مثال: حل أسئلة المسار الحرج">`)}<div class="field-row">${fld('المجال',`<select class="field" name="category">${Object.keys(CAT).map(k=>`<option value="${k}" ${cat===k?'selected':''}>${CAT[k][0]} ${CAT[k][1]}</option>`).join('')}</select>`)}${fld('مرتبطة بمادة',`<select class="field" name="subject"><option value="">بدون مادة</option>${data.courses.map(c=>`<option value="${esc(c.id)}" ${initialSubject===c.id?'selected':''}>${esc(c.id)}</option>`).join('')}</select>`)}</div><div class="field-row">${fld('الموعد النهائي',`<input class="field" type="date" name="due" value="${esc(t?.due||'')}">`)}${fld('الأولوية',`<select name="priority" class="field">${[['A','A — مهم'],['B','B — متوسط'],['C','C — مرن']].map(([k,v])=>`<option value="${k}" ${(t?.priority||'B')===k?'selected':''}>${v}</option>`).join('')}</select>`)}</div><div class="field-row">${fld('الوقت المتوقع بالدقائق',`<input class="field" type="number" min="5" max="1440" step="5" name="minutes" value="${t?.minutes||25}">`)}${fld('تخطيط',`<select name="plan" class="field"><option value="" ${!t?.planDate?'selected':''}>غير مثبتة</option><option value="today" ${t?.planDate===today()?'selected':''}>ضمن خطة اليوم</option></select>`)}</div>${fld('ملاحظة اختيارية',`<textarea name="description" class="field" rows="2" maxlength="500" placeholder="تفاصيل أو مرجع…">${esc(t?.description||'')}</textarea>`)}<div class="form-footer">${t?`<button class="btn danger sm" type="button" ${action('task-delete',id)}>حذف المهمة</button>`:'<span class="muted sm">الإنجاز لا يُحتسب حتى تؤشري المهمة.</span>'}<button type="submit" class="btn primary">${t?'حفظ التعديل':'إضافة المهمة'} ✓</button></div></form>`}
if(type==='topic'){const c=courseObj(id)||courseObj(course);if(!c)return;title='موضوع جديد في '+c.id;const examples={PMMT:['WBS وتقسيم العمل','Gantt والجدولة','المسار الحرج CPM','مصفوفة RACI'],EIM:['TOGAF','Zachman','IT Governance','Data Governance'],DBA:['Users & Privileges','Roles','Profiles','Tablespaces'],TP1:[]};body=`<form id="topic-form" class="form-stack" data-id="${esc(c.id)}">${fld('اسم الفصل أو المحور',`<input class="field" name="name" id="topic-name" required maxlength="130" placeholder="اكتبي عنوان الموضوع…">`)}${examples[c.id]?.length?`<div class="sm muted">اقتراحات للمساعدة، ولا تُضاف إلا إذا اخترتِها:</div><div class="flex wrap">${examples[c.id].map(t=>`<button type="button" class="btn sm ghost" data-fill-topic="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}<button type="submit" class="btn primary">إضافة الموضوع</button></form>`}
if(type==='session'){title='تسجيل مذاكرة فعلية';const chosen=courseObj(id)?id:focused.subject;body=`<form id="session-form" class="form-stack">${fld('لماذا كانت الجلسة؟',`<select class="field" name="subject">${data.courses.map(c=>`<option value="${esc(c.id)}" ${chosen===c.id?'selected':''}>📘 ${esc(c.id)}</option>`).join('')}<option value="general" ${chosen==='general'?'selected':''}>✦ تطوير عام</option></select>`)}<div class="field-row">${fld('الدقائق التي درستِها بالفعل',`<input type="number" min="1" max="1440" step="1" name="minutes" required class="field" placeholder="مثال 45">`)}${fld('تاريخ الجلسة',`<input type="date" name="date" value="${today()}" max="${today()}" required class="field">`)}</div><div class="note">هذا تسجيل يدوي لجلسة أُنجزت سابقًا، وليس وعدًا بوقت مستقبلي.</div><button class="btn primary" type="submit">تسجيل الجلسة ✓</button></form>`}
if(type==='habit'){title='عادة جديدة';body=`<form id="habit-form" class="form-stack">${fld('اسم العادة',`<input name="name" class="field" maxlength="100" required placeholder="مثال: قراءة 15 دقيقة">`)}<div class="field-row">${fld('الرمز',`<select name="icon" class="field">${['📚','🇨🇳','🏃','🎨','💡','🧘','✍️','☘','🎯','🧭'].map(x=>`<option value="${x}">${x}</option>`).join('')}</select>`)}${fld('لون العادة',`<select class="field" name="color"><option value="#7467e7">بنفسجي</option><option value="#ed719c">وردي</option><option value="#26b6ac">فيروزي</option><option value="#f2a74f">برتقالي</option><option value="#568ef4">أزرق</option></select>`)}</div><button class="btn primary" type="submit">إنشاء العادة</button></form>`}
if(type==='project'){title='هدف أو مشروع جديد';body=`<form id="project-form" class="form-stack">${fld('اسم المشروع',`<input class="field" name="title" maxlength="130" required placeholder="مثال: إنهاء دورة تخصصية">`)}<div class="field-row">${fld('التصنيف',`<select name="area" class="field">${Object.keys(CAT).map(k=>`<option value="${k}">${CAT[k][0]} ${CAT[k][1]}</option>`).join('')}</select>`)}${fld('الرمز',`<select name="symbol" class="field">${['✨','🎓','🛡️','🇨🇳','📚','🎨','🚀','🌱'].map(x=>`<option>${x}</option>`).join('')}</select>`)}</div><button class="btn primary" type="submit">إضافة المشروع</button></form>`}
if(type==='milestone'){const p=data.projects.find(x=>x.id===id);if(!p)return;title='خطوة جديدة: '+p.title;body=`<form id="milestone-form" class="form-stack" data-id="${esc(id)}">${fld('الخطوة المحددة',`<input class="field" required name="text" maxlength="140" placeholder="نتيجة صغيرة قابلة للتحقيق">`)}<button type="submit" class="btn primary">إضافة الخطوة</button></form>`}
root.innerHTML=`<div class="modal-back" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2>${type!=='welcome'?`<button class="icon-btn" data-act="modal-close" title="إغلاق">×</button>`:''}</div>${body}</section></div>`;root.querySelector('input[autofocus]')?.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function switchPage(id){if(!PAGES[id])return;page=id;overflow=false;window.scrollTo({top:0,behavior:'instant'});render()}
function markTask(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?today():null;save();render();toast(t.done?'سُجّل إنجازك ✓':'أُعيدت المهمة إلى قائمة العمل')}
function taskDelete(id){if(!confirm('حذف هذه المهمة نهائيًا؟'))return;data.tasks=data.tasks.filter(t=>t.id!==id);save();closeModal();render();toast('حُذفت المهمة')}
function toggleTopic(id){const [cid,tid]=id.split(':');const t=courseObj(cid)?.topics.find(x=>x.id===tid);if(!t)return;t.done=!t.done;save();render()}
function toggleHabit(id){const h=data.habits.find(x=>x.id===id);if(!h)return;h.dates=h.dates||[];h.dates.includes(today())?h.dates=h.dates.filter(d=>d!==today()):h.dates.push(today());save();render()}
function toggleMilestone(id){const [pid,mid]=id.split(':');const m=data.projects.find(p=>p.id===pid)?.milestones.find(x=>x.id===mid);if(!m)return;m.done=!m.done;save();render()}
function exportJSON(){const content=JSON.stringify(data,null,2);const url=URL.createObjectURL(new Blob([content],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`MADAR-backup-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('تم تجهيز النسخة الاحتياطية')}
function validateImport(x){return x&&x.version===1&&x.meta&&typeof x.meta==='object'&&Array.isArray(x.courses)&&Array.isArray(x.tasks)&&Array.isArray(x.projects)&&Array.isArray(x.sessions)&&Array.isArray(x.habits)&&typeof x.reviews==='object'&&x.courses.length<40&&x.tasks.length<30000&&x.sessions.length<30000&&x.habits.length<1000}
function handleAction(act,id){switch(act){case'more':overflow=!overflow;render();break;case'theme':data.meta.theme=data.meta.theme==='dark'?'light':'dark';save();render();break;case'modal-close':closeModal();break;case'task-toggle':markTask(id);break;case'task-delete':taskDelete(id);break;case'task-plan':{const t=data.tasks.find(x=>x.id===id);if(t){t.planDate=t.planDate===today()?'':today();save();render();toast(t.planDate?'أضيفت لخطة اليوم':'أُزيلت من خطة اليوم')}break}case'topic-toggle':toggleTopic(id);break;case'topic-delete':{const [c,t]=id.split(':');if(confirm('حذف هذا الموضوع من المادة؟')){const x=courseObj(c);x.topics=x.topics.filter(i=>i.id!==t);save();render()}break}case'habit-toggle':toggleHabit(id);break;case'habit-delete':if(confirm('حذف العادة وسجلها؟')){data.habits=data.habits.filter(h=>h.id!==id);save();render()}break;case'milestone-toggle':toggleMilestone(id);break;case'milestone-delete':{const [p,m]=id.split(':');if(confirm('حذف هذه الخطوة؟')){const x=data.projects.find(q=>q.id===p);x.milestones=x.milestones.filter(q=>q.id!==m);save();render()}break}case'project-delete':if(confirm('حذف المشروع وخطواته؟')){data.projects=data.projects.filter(p=>p.id!==id);save();render()}break;case'week-prev':weekOffset--;render();break;case'week-next':weekOffset++;render();break;case'week-reset':weekOffset=0;render();break;
case'focus-start':focused.running=true;focused.paused=false;focused.started=Date.now();focused.elapsed=0;render();toast('بدأ التركيز — بالتوفيق');break;
case'focus-pause':if(!focused.running)return;if(!focused.paused){focused.elapsed=focusSeconds();focused.paused=true}else{focused.started=Date.now();focused.paused=false}render();break;
case'focus-finish':if(!focused.running)return;{const seconds=focusSeconds();if(seconds<30){toast('لم تُسجّل الجلسة؛ تحتاجين 30 ثانية على الأقل');return}const mins=Math.round(seconds/60);data.sessions.push({id:uid(),subject:focused.subject,date:today(),minutes:mins});focused={...focused,running:false,paused:false,elapsed:0};save();render();toast(`سُجّلت جلسة ${mins} دقيقة ✓`)}break;
case'focus-cancel':if(confirm('إلغاء الجلسة دون احتساب وقتها؟')){focused.running=false;focused.paused=false;focused.elapsed=0;render()}break;
case'settings-save':{data.meta.name=document.getElementById('name-setting').value.trim().slice(0,30);data.meta.dailyTarget=Number(document.getElementById('target-setting').value)||120;save();render();toast('تم حفظ التفضيلات')}break;
case'courses-save':data.courses.forEach(c=>{const v=Number(document.getElementById('target-'+c.id)?.value);if(Number.isFinite(v)&&v>=15&&v<=3000)c.weeklyTarget=v});save();render();toast('تم تحديث أهداف المواد');break;
case'export':exportJSON();break;
case'reset':if(prompt('هذا سيمسح كل بيانات مدار المحلية. اكتبي كلمة حذف للتأكيد:')==='حذف'){data=fresh();page='home';save();closeModal();render();toast('تم بدء سجل جديد')}break;}}
function onSubmit(form){const f=new FormData(form),str=n=>String(f.get(n)||'').trim();switch(form.id){case'onboard-form':data.meta.name=str('name').slice(0,30);data.meta.dailyTarget=Number(str('target'))||120;data.meta.onboarded=true;save();closeModal();render();toast('هذا نظامك الآن ✦');break;
case'quick-task':{const title=str('title').slice(0,150);if(!title)return;data.tasks.unshift({id:uid(),title,category:'university',subject:'',due:'',priority:'B',minutes:25,description:'',planDate:'',done:false,completedAt:null,createdAt:today()});save();render();toast('تم التقاط المهمة ✓');break}
case'task-form':{const id=form.dataset.id,t=data.tasks.find(t=>t.id===id);const cat=str('category');const subj=str('subject');const title=str('title').slice(0,150);if(!title)return;const value={title,category:CAT[cat]?cat:'life',subject:courseObj(subj)?subj:'',due:/^\d{4}-\d{2}-\d{2}$/.test(str('due'))?str('due'):'',priority:['A','B','C'].includes(str('priority'))?str('priority'):'B',minutes:Math.max(5,Math.min(1440,Number(str('minutes'))||25)),planDate:str('plan')==='today'?today():'',description:str('description').slice(0,500)};if(t)Object.assign(t,value);else data.tasks.unshift({id:uid(),...value,createdAt:today(),done:false,completedAt:null});save();closeModal();render();toast(t?'حُفظ تعديل المهمة':'أُضيفت المهمة بنجاح');break}
case'topic-form':{const c=courseObj(form.dataset.id),name=str('name').slice(0,130);if(!c||!name)return;c.topics.push({id:uid(),name,done:false});save();closeModal();course=c.id;render();toast('أُضيف الموضوع');break}
case'session-form':{const n=Number(str('minutes')),d=str('date'),s=str('subject');if(!Number.isFinite(n)||n<1||n>1440||d>today()||!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast('تحققي من تاريخ الجلسة ومدتها');return}data.sessions.push({id:uid(),date:d,subject:courseObj(s)?s:'general',minutes:Math.round(n)});save();closeModal();render();toast('حُفظت الجلسة في سجلك ✓');break}
case'habit-form':{const name=str('name').slice(0,100);if(!name)return;data.habits.push({id:uid(),name,icon:str('icon')||'🌱',color:str('color')||'#7467e7',dates:[]});save();closeModal();render();toast('أُضيفت العادة');break}
case'project-form':{const title=str('title').slice(0,130);if(!title)return;data.projects.push({id:uid(),title,area:CAT[str('area')]?str('area'):'growth',symbol:str('symbol')||'✨',milestones:[]});save();closeModal();render();toast('بدأت خريطة هدف جديد');break}
case'milestone-form':{const p=data.projects.find(x=>x.id===form.dataset.id),name=str('text').slice(0,140);if(!p||!name)return;p.milestones.push({id:uid(),text:name,done:false});save();closeModal();render();toast('أُضيفت خطوة');break}
case'review-form':{const start=weekStart(today());data.reviews[start]={wins:str('wins').slice(0,5000),challenge:str('challenge').slice(0,5000),next:str('next').slice(0,5000)};save();toast('تم حفظ مراجعتك الأسبوعية');break}}
}
document.addEventListener('click',ev=>{const target=ev.target.closest('button,[data-modal]');if(!target)return;
if(target.dataset.nav){switchPage(target.dataset.nav);return}
if(target.dataset.course){course=target.dataset.course;switchPage('university');return}
if(target.dataset.filter){filter=target.dataset.filter;render();return}
if(target.dataset.range){analyticsRange=Number(target.dataset.range)||14;render();return}
if(target.dataset.preset){if(!focused.running){focused.target=Number(target.dataset.preset);render()}return}
if(target.dataset.fillTopic){const input=document.getElementById('topic-name');if(input){input.value=target.dataset.fillTopic;input.focus()}return}
if(target.dataset.act){handleAction(target.dataset.act,target.dataset.id||'');return}
if(target.dataset.modal){showModal(target.dataset.modal,target.dataset.id||'',target.dataset.subject||'');return}});
document.addEventListener('submit',ev=>{ev.preventDefault();onSubmit(ev.target)});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='focus-subject'&&!focused.running){focused.subject=el.value;return}
if(el.id==='import-json'&&el.files?.[0]){const file=el.files[0];if(file.size>8e6){toast('ملف النسخة الاحتياطية كبير جدًا');el.value='';return}file.text().then(raw=>{const x=JSON.parse(raw);if(!validateImport(x))throw Error('invalid');if(confirm('هل تريدين استبدال جميع البيانات الحالية بالنسخة المستوردة؟')){data=x;data.meta.theme=['light','dark'].includes(data.meta.theme)?data.meta.theme:'light';data.meta.onboarded=true;data.meta.dailyTarget=Math.max(15,Math.min(1440,Number(data.meta.dailyTarget)||120));data.courses.forEach(c=>{c.topics=Array.isArray(c.topics)?c.topics:[];c.weeklyTarget=Number(c.weeklyTarget)||180});data.habits.forEach(h=>{h.dates=Array.isArray(h.dates)?h.dates:[]});save();page='home';render();toast('تم استيراد بياناتك بنجاح ✓')}}).catch(()=>toast('ملف غير صالح أو لا يخص مدار')).finally(()=>el.value='')}});
document.addEventListener('input',ev=>{if(ev.target.id==='task-search'){term=ev.target.value;const pos=ev.target.selectionStart;render();const el=document.getElementById('task-search');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeModal();overflow=false;render()}if(ev.key.toLowerCase()==='n'&&!ev.ctrlKey&&!ev.metaKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.querySelector('.modal-back')){ev.preventDefault();showModal('task')}});
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
})();

</script>
</body></html>

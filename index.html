function startQuiz(){const l=lessons[currentDay-1],all=[...l.words,...lessons.slice(0,currentDay).flatMap(x=>x.words)].filter(x=>x.id!==undefined);let q=[];for(let i=0;i<l.words.length;i++){const w=l.words[i],reverse=i>=l.words.length-2;const answer=reverse?w.cn:w.ar;let pool=all.filter(x=>x.id!==w.id).map(x=>reverse?x.cn:x.ar).filter(x=>x!==answer);pool=[...new Set(pool)];const intra=shuffled(l.words.filter(x=>x.id!==w.id).map(x=>reverse?x.cn:x.ar)).slice(0,3);const decoys=[...new Set([...intra,...shuffled(pool)])].filter(x=>x!==answer).slice(0,3);q.push({prompt:reverse?w.ar:w.cn,pinyin:reverse?'':w.pinyin,reverse,options:shuffled([answer,...decoys]),answer,word:w})}quiz={questions:shuffled(q),position:0,selected:null,correct:0};quizDone=null;render()}

function finishQuiz(){let score=Math.round(100*quiz.correct/quiz.questions.length),prev=data.completed[currentDay];if(!prev)data.completed[currentDay]={date:TODAY(),score,correct:quiz.correct,total:quiz.questions.length};else if(score>prev.score){prev.score=score;prev.correct=quiz.correct;prev.total=quiz.questions.length}const l=lessons[currentDay-1];for(const w of l.words)if(!data.srs[w.id])data.srs[w.id]={due:shiftDate(TODAY(),1),reps:0,interval:1,ease:2.2};quizDone={score,correct:quiz.correct,total:quiz.questions.length};quiz=null;persist();render()}
function completionPage(l){const c=quizDone;const next=lessons[currentDay]?currentDay+1:null;return `<section class="panel" style="max-width:650px;text-align:center;margin:32px auto;padding:40px 26px"><div class="completion-score">${c.score}%</div><div class="eyebrow">LESSON COMPLETE</div><h1>اكتمل اليوم ${currentDay}!</h1><p class="muted" style="margin:12px auto 20px;max-width:420px">${c.correct} من ${c.total} إجابات صحيحة. أُضيفت مفردات هذا الدرس إلى نظام المراجعة المتباعدة.</p><div class="metrics" style="grid-template-columns:repeat(2,1fr);margin:20px 0">${metric('الدرس المكتمل',currentDay+' / 30','في المسار التمهيدي','check')}${metric('مفردات الدرس',l.words.length,'بطاقات للمراجعة','book')}</div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn btn-outline" data-action="retake">أعيدي الاختبار</button>${next?`<button class="btn btn-primary" data-action="open-lesson" data-day="${next}">الدرس التالي ${ico('arrow')}</button>`:`<button class="btn btn-primary" data-action="go-review">افتحي المراجعة</button>`}</div></section>`}

function reviewPage(){const c=counts(),active=reviewIndex<reviewDeck.length,w=reviewDeck[reviewIndex];return `${pageLead('SPACED REPETITION','المراجعة الذكية','اختبري قدرتك على تذكّر المعنى قبل إظهاره. قيّمي نفسك لتحديد موعد ظهوره مجددًا.') }<div class="metrics" style="grid-template-columns:repeat(3,minmax(0,1fr))">${metric('المستحقة اليوم',c.reviewDue,'كلمات وعبارات','review')}${metric('إجمالي البطاقات',c.words,'كلمات تعلّمتها','book')}${metric('المتقَنة',c.mastered,'بعد 3 مراجعات ناجحة','trophy')}</div><div class="filters"><button data-action="review-mode" data-mode="due" class="filter-btn ${reviewMode==='due'?'active':''}">المراجعات المستحقة</button><button data-action="review-mode" data-mode="all" class="filter-btn ${reviewMode==='all'?'active':''}">تدريب حر على كل الكلمات</button></div>${active?`<div class="review-center"><div class="panel-head"><h3>${reviewMode==='due'?'جلسة المراجعة المستحقة':'جلسة التدريب الحر'}</h3><span class="tag blue">${reviewIndex+1} / ${reviewDeck.length}</span></div><div class="quiz-meter" style="margin-top:0"><span style="width:${reviewIndex/reviewDeck.length*100}%"></span></div><div class="flashcard"><div class="small muted">اليوم ${w.day} · تذكّري المعنى</div><div class="flash-cn cn">${w.cn}</div><div class="flash-pinyin">${w.pinyin}</div><button class="speak-btn" style="margin-top:12px" data-action="speak" data-say="${safe(w.cn)}" aria-label="استماع">${ico('volume')}</button>${revealed?`<div class="flash-answer">${w.ar}</div>`:`<button class="btn btn-soft" style="margin-top:25px" data-action="reveal">إظهار المعنى</button>`}</div>${revealed?`<p class="center small muted" style="margin:16px 0 8px">كيف كان استرجاع الكلمة من الذاكرة؟</p><div class="review-actions"><button class="btn btn-outline" data-action="grade" data-grade="hard">صعبة · غدًا</button><button class="btn btn-soft" data-action="grade" data-grade="good">تذكّرتها</button><button class="btn btn-primary" data-action="grade" data-grade="easy">سهلة جدًا</button></div>`:'<p class="center fineprint" style="margin:14px">حاولي تذكّر الترجمة قبل الضغط على «إظهار المعنى».</p>'}</div>`:`<div class="empty" style="max-width:710px;margin:16px auto">${ico('check')}<h3>${c.words===0?'ابدئي أول درس لتكوين بطاقات المراجعة.':reviewMode==='due'?'لا توجد مراجعات مستحقة حاليًا.':'اكتملت جلسة التدريب الحر!'}</h3><p>${c.words===0?'افتحي المسار واختاري اليوم الأول.':'يمكنك إعادة التدريب بحرية، وستعود البطاقات في موعدها التالي.'}</p><button class="btn btn-primary" data-action="${c.words===0?'open-lesson':'review-mode'}" ${c.words===0?'data-day="1"':'data-mode="all"'}>${c.words===0?'ابدئي الدرس الأول':'ابدئي تدريبًا حرًا'}</button></div>`}`}
function gradeReview(grade){let w=reviewDeck[reviewIndex];if(!w)return;let s=data.srs[w.id]||{reps:0,interval:1,ease:2.2},now=TODAY();if(grade==='hard'){s.reps=0;s.interval=1;s.ease=Math.max(1.3,(s.ease||2.2)-.15)}else{const prior=s.reps||0;s.reps=prior+1;if(grade==='easy')s.ease=Math.min(3,(s.ease||2.2)+.12);if(s.reps===1)s.interval=grade==='easy'?3:1;else if(s.reps===2)s.interval=grade==='easy'?7:3;else s.interval=Math.min(90,Math.max(5,Math.round((s.interval||3)*(s.ease||2.2)*(grade==='easy'?1.3:1))))}s.due=shiftDate(now,s.interval);s.last=now;data.srs[w.id]=s;activity().reviews++;persist();reviewIndex++;revealed=false;render()}
function analyticsPage(){const c=counts(),days=studyDays().length,avg=days?Math.round(c.seconds/60/days):0,period=analysisDays;return `${pageLead('MEASURE WHAT MATTERS','تحليلات تقدّمك','الأرقام تعكس نشاطك الفعلي واختباراتك المكتملة والمراجعات المسجّلة.') }<div class="metrics">${metric('وقت التعلّم',formatMinutes(c.seconds),'داخل صفحات الدروس والمراجعة','clock')}${metric('أيام الدراسة',days,'يومًا فيه نشاط موثّق','calendar')}${metric('متوسط الجلسة اليومية',avg+' د','في الأيام النشطة','chart')}${metric('إجابات صحيحة',c.correct+' / '+c.answers,c.accuracy===null?'لم يُجرَ اختبار بعد':c.accuracy+'% دقّة','target')}</div><div class="analytics-grid"><section class="panel"><div class="panel-head"><div><h2>النشاط اليومي</h2><div class="section-sub">الدقائق المسجلة</div></div><select class="select" data-action="period" aria-label="المدة"><option value="14" ${period===14?'selected':''}>14 يومًا</option><option value="30" ${period===30?'selected':''}>30 يومًا</option></select></div>${barsChart(period)}<p class="fineprint">يُحتسب الوقت أثناء فتح الدرس أو جلسة المراجعة، ما دام التطبيق نشطًا.</p></section><section class="panel"><div class="panel-head"><div><h2>نمو المفردات</h2><div class="section-sub">الإجمالي التراكمي للمفردات في الدروس المكتملة</div></div><span class="tag blue">${c.words} كلمة وعبارة</span></div>${lineChart(30)}<p class="fineprint">يختلف «مدروس» عن «متقَن»: الإتقان يحتاج مراجعات لاحقة.</p></section><section class="panel"><div class="panel-head"><h2>خريطة الالتزام · آخر 30 يومًا</h2><span class="tag">أغمق = نشاط أكثر</span></div><div class="heat-grid">${Array.from({length:30},(_,i)=>{let d=shiftDate(TODAY(),i-29),a=data.activity[d]||{},minutes=(a.seconds||0)/60,active=(a.answers||0)+(a.reviews||0);let intensity=minutes>=20?4:minutes>=10?3:minutes>=3?2:minutes>=.5||active?1:0;return `<div class="heat-cell ${intensity?'heat-'+intensity:''}" title="${dateLabel(d)}: ${Math.floor(minutes)} دقيقة، ${active} تفاعلًا" role="img" aria-label="${dateLabel(d)} ${Math.floor( function recentActivityTable(){const rows=Object.entries(data.activity).filter(([,a])=>a.seconds||a.answers||a.reviews).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);return `<section class="panel"><div class="panel-head"><h2>سجل آخر الجلسات</h2><span class="tag">7 أيام نشطة كحد أقصى</span></div>${rows.length?`<div style="overflow-x:auto"><table class="stat-table"><thead><tr><th>التاريخ</th><th>وقت التعلّم</th><th>إجابات الاختبار</th><th>المراجعات</th></tr></thead><tbody>${rows.map(([d,a])=>`<tr><td>${dateLabel(d)}</td><td>${formatMinutes(a.seconds||0)}</td><td>${a.correct||0} / ${a.answers||0}</td><td>${a.reviews||0}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">ستظهر هنا جلساتك بمجرد بدء التدريب.</p>'}</section>`}

function barsChart(count){const W=600,H=210,L=25,R=13,T=19,B=33,plotW=W-L-R,plotH=H-T-B;const vals=Array.from({length:count},(_,i)=>{const date=shiftDate(TODAY(),i-count+1);return{date,v:Math.floor((data.activity[date]?.seconds||0)/60)}});let max=Math.max(5,...vals.map(x=>x.v)),step=plotW/count,bw=Math.min(24,step*.54);const bars=vals.map((a,i)=>{let x=L+i*step+(step-bw)/2,h=clamp((a.v/max)*(plotH-10),a.v>0?3:0,plotH),y=T+plotH-h;return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${a.date===TODAY()?'#365ec5':'#9db4f1'}"><title>${dateLabel(a.date)} · ${a.v} دقيقة</title></rect>${count<=14||i%3===0?`<text x="${(x+bw/2).toFixed(1)}" y="${H-9}" fill="currentColor" opacity=".55" text-anchor="middle" font-size="9">${dateAt(a.date).getDate()}</text>`:''}`}).join('');let lines=[0,.5,1].map(k=>{let y=T+plotH*(1-k);return `<path d="M${L} ${y} H${W-R}" stroke="currentColor" opacity=".10" stroke-dasharray="4 5"/><text x="${L-5}" y="${y+3}" fill="currentColor" opacity=".4" text-anchor="end" font-size="9">${Math.round(max*k)}</text>`}).join('');return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="مخطط أعمدة لنشاط آخر ${count} يومًا، بعدد دقائق التعلّم">${lines}${bars}</svg></div>`}
function lineChart(count){const W=600,H=210,L=28,R=14,T=18,B=32,plotW=W-L-R,plotH=H-T-B;const dates=Array.from({length:count},(_,i)=>shiftDate(TODAY(),i-count+1));let vals=dates.map(date=>lessons.filter(l=>data.completed[l.day]&&data.completed[l.day].date<=date).reduce((n,l)=>n+l.words.length,0));const max=Math.max(10,...vals),xy=vals.map((v,i)=>[L+(i/(count-1))*plotW,T+plotH-(v/max)*(plotH-10)]);let poly=xy.map(v=>v.map(x=>x.toFixed(1)).join(',')).join(' ');let area=`${L},${T+plotH} ${poly} ${W-R},${T+plotH}`;let lines=[0,.5,1].map(k=>{const y=T+plotH*(1-k);return `<path d="M${L} ${y} H${W-R}" stroke="currentColor" opacity=".1" stroke-dasharray="4 5"/><text x="${L-6}" y="${y+3}" fill="currentColor" opacity=".45" font-size="10" text-anchor="end">${Math.round(max*k)}</text>`}).join('');const tick=[0,Math.floor((count-1)/2),count-1].map(i=>`<text x="${xy[i][0]}" y="${H-8}" fill="currentColor" opacity=".55" text-anchor="middle" font-size="10">${dateLabel(dates[i])}</text>`).join('');return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم خطي تراكمي للكلمات المدروسة خلال 30 يومًا">${lines}<polygon points="${area}" fill="#678de1" opacity=".11"/><polyline points="${poly}" fill="none" stroke="#5176d8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${xy[xy.length-1][0]}" cy="${xy[xy.length-1][1]}" r="4.5" fill="#5176d8"/>${tick}</svg></div>`}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3800)}
function navigate(to){page=to;quiz=null;quizDone=null;if(to==='review')initReview('due');else render();window.scrollTo({top:0,behavior:'instant'})}
function speak(text){if(!('speechSynthesis' in window)){toast('ميزة النطق غير متاحة في هذا المتصفح.');return}try{window.speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(text.replaceAll('…',''));s.lang='zh-CN';s.rate=.83;s.pitch=1;const voices=window.speechSynthesis.getVoices();const chinese=voices.find(v=>/^zh[-_](CN|Hans)/i.test(v.lang))||voices.find(v=>v.lang.toLowerCase().startsWith('zh'));if(chinese)s.voice=chinese;window.speechSynthesis.speak(s);if(!chinese)toast('سيحاول المتصفح النطق بالصينية. قد تحتاجين تثبيت صوت صيني من إعدادات الجهاز.')}catch{toast('تعذّر تشغيل الصوت على هذا الجهاز.')}}
function downloadData(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`han-progress-${TODAY()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('تم تجهيز النسخة الاحتياطية.')}
function validateImport(x){if(!x||typeof x!=='object'||typeof x.startDate!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(x.startDate)||typeof x.completed!=='object'||!x.completed||Array.isArray(x.completed)||typeof x.activity!=='object'||!x.activity||typeof x.srs!=='object'||!x.srs)return false;for(const [k,v] of Object.entries(x.completed))if(!/^(?:[1-9]|[12][0-9]|30)$/.test(k)||typeof v?.date!=='string'||typeof v.score!=='number')return false;return true}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;lastInteraction=Date.now();const a=b.dataset.action;if(a==='navigate'){navigate(b.dataset.to);return}if(a==='theme'){data.settings.theme=data.settings.theme==='dark'?'light':'dark';persist();render();return}if(a==='open-lesson'){currentDay=clamp(+b.dataset.day||1,1,30);page='lesson';quiz=null;quizDone=null;render();window.scrollTo(0,0);return}if(a==='go-review'){initReview('due');window.scrollTo(0,0);return}if(a==='speak'){speak(b.dataset.say);return}if(a==='filter'){pathFilter=b.dataset.filter;render();return}if(a==='start-quiz'||a==='retake'){startQuiz();window.scrollTo(0,0);return}if(a==='close-quiz'){quiz=null;render();return}if(a==='answer'&&quiz&&quiz.selected===null){const q=quiz.questions[quiz.position],option=q.options[+b.dataset.index];quiz.selected=option;const correct=option===q.answer;if(correct)quiz.correct++;let act=activity();act.answers++;if(correct)act.correct++;persist();render();return}if(a==='quiz-next'&&quiz&&quiz.selected!==null){if(quiz.position+1===quiz.questions.length)finishQuiz();else{quiz.position++;quiz.selected=null;render()}return}if(a==='review-mode'){initReview(b.dataset.mode);return}if(a==='reveal'){revealed=true;render();return}if(a==='grade'&&revealed){gradeReview(b.dataset.grade);return}if(a==='export'){downloadData();return}if(a==='import'){document.getElementById('import-file').click();return}if(a==='reset'){if(confirm('هل تريدين محو جميع الدروس ونتائجك والبدء من الصفر؟')){data=fresh();persist();page='home';render();toast('بدأ مسار جديد.')}return}});
root.addEventListener('change',e=>{if(e.target.matches('#daily-goal')){const n=+e.target.value;if([10,15,20,30,45].includes(n)){data.settings.goal=n;persist();render()}}else if(e.target.dataset.action==='period'){analysisDays=+e.target.value===30?30:14;render()}});
document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>3e6)throw Error('big');const obj=JSON.parse(await f.text());if(!validateImport(obj))throw Error('invalid');if(confirm('سيستبدل هذا الملف تقدمك الحالي. هل تريدين المتابعة؟')){data={version:1,startDate:obj.startDate,completed:obj.completed,activity:obj.activity,srs:obj.srs,settings:{goal:15,theme:'light',...(obj.settings||{})}};data.settings.goal=[10,15,20,30,45].includes(+data.settings.goal)?+data.settings.goal:15;data.settings.theme=data.settings.theme==='dark'?'dark':'light';persist();page='home';quiz=null;render();toast('تم استيراد تقدمك بنجاح.')}}catch{toast('الملف غير صالح أو ليس نسخة احتياطية من HÀN.')}e.target.value=''})
// Count seconds only while the app's learning views are open, visible, and recently active.
window.addEventListener('keydown',()=>lastInteraction=Date.now());
document.addEventListener('touchstart',()=>lastInteraction=Date.now(),{passive:true});
setInterval(()=>{if(document.visibilityState==='visible'&&(page==='lesson'||page==='review')&&Date.now()-lastInteraction<5*60*1000){activity().seconds=(activity().seconds||0)+5;persist()}},5000);
render();

  </script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script>

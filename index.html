/* Level onboarding, adaptive vocabulary studio, responsive analytics */
.level-onboarding{min-height:100vh;padding:32px 18px 55px;background:radial-gradient(circle at 5% 0%,#dce9ff 0%,transparent 32%),radial-gradient(circle at 94% 100%,#e2f4f0 0%,transparent 32%),var(--bg)}
.level-onboard-wrap{max-width:1120px;margin:auto}
.level-onboard-logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:22px;letter-spacing:1px}
.level-onboard-logo small{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.level-onboarding h1{font-size:clamp(29px,4vw,48px);letter-spacing:-.7px;margin:10px 0}
.level-onboard-desc{max-width:720px;color:var(--muted);font-size:15px;margin:12px 0 30px}
.level-picker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.level-choice{min-height:240px;text-align:right;display:flex;flex-direction:column;align-items:stretch;background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:21px;box-shadow:var(--shadow);color:var(--ink);transition:border-color .2s,transform .2s}
.level-choice:hover,.level-choice:focus-visible{border-color:var(--blue);transform:translateY(-2px)}
.level-choice.level-recommended{border-color:#9aafe7;background:linear-gradient(145deg,var(--paper),var(--blue-bg))}
.level-choice-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:17px}
.level-number{color:var(--muted);font:700 12px var(--sans)}
.level-choice-title{font-size:26px;direction:ltr;text-align:right;letter-spacing:1px}
.level-choice-label{font-size:13px;font-weight:800;margin-top:1px}
.level-choice-hint{font-size:11px;color:var(--muted);margin-top:8px;min-height:35px}
.level-choice-sample{font-size:18px;color:var(--blue);margin:12px 0;direction:ltr;text-align:right}
.level-choice-arrow{color:var(--blue);font-weight:800;font-size:11px;margin-top:auto;border-top:1px solid var(--line);padding-top:11px}
.level-onboard-foot{display:flex;align-items:flex-start;gap:8px;margin-top:22px;color:var(--muted);font-size:12px;max-width:950px}
.level-onboard-foot svg{color:var(--blue);margin-top:2px}
.level-banner{margin:15px 0 20px;border:1px solid #cad9f5;border-radius:21px;background:linear-gradient(130deg,var(--blue-bg),var(--paper));display:flex;justify-content:space-between;align-items:center;gap:18px;padding:20px 22px}
.level-banner-title{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.level-banner-title strong{font-size:26px;direction:ltr}.level-banner-title span{font-weight:750}
.level-banner p{font-size:12px;color:var(--muted);margin:6px 0 12px}.level-banner-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.vocab-top-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:16px 0}
.vocab-controls{display:flex;align-items:center;justify-content:space-between;gap:15px}
.vocab-controls p{font-size:12px;margin:8px 0 0}
.vocab-control-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.vocab-control-actions .select{min-width:205px;max-width:280px}
.vocab-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.vocab-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0;box-shadow:var(--shadow)}
.vocab-card.is-studied{border-color:#a9d7ce}
.vocab-card-head{display:flex;align-items:center;justify-content:space-between}
.vocab-hanzi{font-size:clamp(29px,3vw,39px);font-weight:750;margin-top:8px;min-height:48px;line-height:1.4;overflow-wrap:anywhere}
.vocab-pinyin{font-size:14px;color:var(--blue);text-align:right;margin-top:1px;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.vocab-meaning{font-size:13px;margin:11px 0 16px;min-height:25px;color:var(--ink)}
.vocab-mark{font-size:12px;padding:9px 11px;width:100%}
.vocab-finish-actions{display:flex;justify-content:center;gap:11px;flex-wrap:wrap;margin:25px 0 0}
.level-analytics{display:grid;gap:15px}.level-analytics-row{display:grid;grid-template-columns:105px minmax(0,1fr) 70px;gap:13px;align-items:center}.level-analytics-row span{font-size:12px;font-weight:750;direction:ltr;text-align:right}.level-analytics-row strong{text-align:left;font-size:12px;direction:ltr;color:var(--muted)}
@media(max-width:1120px){.level-picker-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.vocab-top-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){.level-picker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.vocab-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.level-banner{align-items:flex-start;flex-direction:column}}
@media(max-width:620px){.level-onboarding{padding:20px 15px 40px}.level-onboarding h1{font-size:30px}.level-onboard-logo small{display:none}.level-picker-grid{gap:9px}.level-choice{padding:15px;min-height:228px;border-radius:16px}.level-choice-title{font-size:23px}.level-choice-sample{font-size:15px}.level-choice-hint{font-size:11px}.level-choice-arrow{font-size:10px}.level-banner{padding:16px}.level-banner-actions{width:100%}.level-banner-actions .btn{flex:1;min-width:120px}.vocab-grid{gap:9px}.vocab-card{padding:14px;border-radius:15px}.vocab-meaning{font-size:12px}.vocab-controls{align-items:stretch;flex-direction:column}.vocab-control-actions{flex-direction:column;align-items:stretch}.vocab-control-actions .select{width:100%;max-width:none}.vocab-control-actions .btn{width:100%}.mobile-nav .nav-btn{width:16.666%;font-size:8px;letter-spacing:-.15px}.mobile-nav{padding-left:3px;padding-right:3px}.mobile-nav .nav-btn svg{width:17px;height:17px}.level-analytics-row{grid-template-columns:80px minmax(0,1fr) 60px;gap:8px}}
@media(max-width:360px){.level-picker-grid,.vocab-grid{grid-template-columns:1fr}.level-choice{min-height:192px}}

{t:'الأصوات والنغمات الأربع',g:'تمييز تغيّر المعنى عند اختلاف النغمة الصينية.',r:'في الماندرين أربع نغمات رئيسية (ā á ǎ à)، بالإضافة إلى نغمة خفيفة بلا علامة. تغيّر النغمة قد يغيّر معنى الكلمة بالكامل. استمعي لكل مثال ثم كرّريه.',e:'妈妈|māma|أمي / ماما',v:'妈|mā|أم;麻|má|قنب;马|mǎ|حصان;骂|mà|يوبّخ;吗|ma|أداة سؤال'},
{t:'التحيات الأساسية',g:'إلقاء التحية والشكر والوداع بأبسط العبارات.',r:'تتكوّن 你好 من 你 (أنت) و好 (جيد). النطق المعتاد للتحية هو nǐ hǎo. ردي على 谢谢 بعبارة 不客气.',e:'你好！|nǐ hǎo!|مرحبًا!',v:'你|nǐ|أنت;好|hǎo|جيد;你好|nǐ hǎo|مرحبًا;谢谢|xièxie|شكرًا;再见|zàijiàn|إلى اللقاء;不客气|bú kèqi|عفوًا'},
{t:'الضمائر الشخصية',g:'التعريف بنفسك والحديث عن الآخرين.',r:'الضمائر الصينية لا تتغير وفق موقعها في الجملة عادة. لاحظي أن 他 و她 يُنطقان بالطريقة نفسها tā.',e:'我是学生。|wǒ shì xuésheng.|أنا طالبة.',v:'我|wǒ|أنا;你|nǐ|أنت;他|tā|هو;她|tā|هي;我们|wǒmen|نحن;他们|tāmen|هم'},
{t:'النفي والإثبات',g:'فهم الفرق بين «يكون» و«يملك» والنفي.',r:'استخدمي 不 لنفي الصفات والأفعال المعتادة، و没有 لنفي الملكية أو الوجود. أما 是 فتربط الشخص بهويته أو صفته الاسمية.',e:'我不是老师。|wǒ bú shì lǎoshī.|أنا لست معلّمة.',v:'是|shì|يكون / هو;不是|bú shì|ليس;不|bù|لا / ليس;对|duì|صحيح;有|yǒu|يوجد / يملك;没有|méi yǒu|لا يوجد / لا يملك'},
{t:'الأرقام من صفر إلى خمسة',g:'قراءة الأرقام الصينية الأولى ونطقها.',r:'الأرقام الصينية منتظمة نسبيًا. احفظي نطق الرموز قبل تركيب الأعداد الأطول.',e:'一、二、三。|yī, èr, sān.|واحد، اثنان، ثلاثة.',v:'零|líng|صفر;一|yī|واحد;二|èr|اثنان;三|sān|ثلاثة;四|sì|أربعة;五|wǔ|خمسة'},
{t:'الأرقام من ستة إلى عشرة',g:'إكمال الأرقام وتعلّم سؤال الكمية.',r:'بعد عشرة يصبح تركيب الأعداد أكثر سهولة: 十一 = 11 و二十 = 20. استخدمي 多少 للسؤال عن الكمية.',e:'十个。|shí ge.|عشرة أشياء.',v:'六|liù|ستة;七|qī|سبعة;八|bā|ثمانية;九|jiǔ|تسعة;十|shí|عشرة;多少|duōshao|كم عدد'},
{t:'محادثة الأسبوع الأول',g:'ربط التحية والسؤال عن الحال والاعتذار.',r:'تضيف 吗 إلى الجملة لتحويلها غالبًا إلى سؤال نعم/لا؛ أما 呢 فتُستخدم في أسئلة متابعة مثل «وأنتِ؟».',e:'你好吗？我很好。|nǐ hǎo ma? wǒ hěn hǎo.|كيف حالك؟ أنا بخير.',v:'你好吗|nǐ hǎo ma|كيف حالك;我很好|wǒ hěn hǎo|أنا بخير;你呢|nǐ ne|وأنت;请|qǐng|من فضلك;对不起|duìbuqǐ|آسف;没关系|méi guānxi|لا بأس'},
{t:'العائلة',g:'التحدث عن أفراد العائلة بأسماء شائعة.',r:'تُكرّر بعض أسماء القرابة المقطع نفسه مثل 爸爸 و妈妈، ويكون المقطع الثاني عادة خفيف النغمة.',e:'这是我的家。|zhè shì wǒ de jiā.|هذه عائلتي / بيتي.',v:'家|jiā|عائلة / منزل;爸爸|bàba|أب;妈妈|māma|أم;哥哥|gēge|أخ أكبر;姐姐|jiějie|أخت أكبر;妹妹|mèimei|أخت أصغر'},
{t:'الاسم والبلد',g:'السؤال عن الاسم وذكر عُمان والصين.',r:'استخدمي 你叫什么名字؟ للسؤال «ما اسمك؟». والإجابة الشائعة 我叫 + الاسم.',e:'我叫安娜。|wǒ jiào Ānnà.|اسمي آنا.',v:'叫|jiào|يُدعى / اسمه;名字|míngzi|اسم;什么|shénme|ماذا;哪|nǎ|أيّ;中国|Zhōngguó|الصين;阿曼|Āmàn|عُمان'},
{t:'اللغات والتعلّم',g:'التعبير عن تعلّم الصينية والتحدث باللغات.',r:'صيغة مفيدة: 我 + فعل + مفعول، مثل 我学中文 (أنا أتعلم الصينية). 中文 و汉语 كلاهما يشيران إلى اللغة الصينية.',e:'我学中文。|wǒ xué Zhōngwén.|أنا أتعلم الصينية.',v:'人|rén|شخص;中文|Zhōngwén|اللغة الصينية;汉语|Hànyǔ|اللغة الصينية;英语|Yīngyǔ|اللغة الإنجليزية;学|xué|يتعلّم;说|shuō|يتكلم'},
{t:'أدوات الاستفهام',g:'تكوين أسئلة بسيطة عن الأشخاص والأماكن والأسباب.',r:'غالبًا تبقى كلمة السؤال في مكان المعلومة المطلوبة، مثل 你叫什么؟ «ماذا تُدعين؟». لا حاجة لقلب ترتيب الجملة كالإنجليزية.',e:'你住在哪里？|nǐ zhù zài nǎlǐ?|أين تسكنين؟',v:'谁|shéi|مَن;哪里|nǎlǐ|أين;为什么|wèishénme|لماذا;怎么|zěnme|كيف;什么时候|shénme shíhou|متى;几|jǐ|كم (عدد قليل)'},
{t:'الوقت والأيام',g:'التعبير عن أمس واليوم وغدًا والساعة.',r:'للتوقيت قولي الرقم ثم 点 للساعة، ثم الرقم و分 للدقائق، مثل 三点十分 = 3:10.',e:'现在三点。|xiànzài sān diǎn.|الساعة الثالثة الآن.',v:'今天|jīntiān|اليوم;明天|míngtiān|غدًا;昨天|zuótiān|أمس;现在|xiànzài|الآن;点|diǎn|ساعة (في التوقيت);分|fēn|دقيقة'},
{t:'أيام الأسبوع',g:'معرفة أيام الأسبوع من الإثنين للأحد.',r:'أيام الأسبوع تبدأ غالبًا بكلمة 星期، ويتبعها رقم من 1 إلى 6، ويُقال للأحد 星期天 أو 星期日.',e:'今天星期一。|jīntiān xīngqīyī.|اليوم الإثنين.',v:'星期一|xīngqīyī|الإثنين;星期二|xīngqīèr|الثلاثاء;星期三|xīngqīsān|الأربعاء;星期四|xīngqīsì|الخميس;星期五|xīngqīwǔ|الجمعة;星期六|xīngqīliù|السبت;星期天|xīngqītiān|الأحد'},
{t:'الرغبات والقدرة',g:'التعبير عن ما تحبين وما تريدين وما تستطيعين فعله.',r:'喜欢 للتفضيل والحب، 想 للرغبة أو التفكير، 要 للرغبة القوية أو الاحتياج، 会 للمهارة المكتسبة، 能 للقدرة، و可以 للإذن أو الإمكان.',e:'我想学中文。|wǒ xiǎng xué Zhōngwén.|أريد تعلّم الصينية.',v:'喜欢|xǐhuan|يحب;想|xiǎng|يريد / يفكر;要|yào|يريد / يحتاج;会|huì|يعرف كيف / سوف;可以|kěyǐ|يمكن / مسموح;能|néng|يستطيع'},
{t:'أفعال الحياة اليومية',g:'فهم ستة أفعال تستخدم يوميًا.',r:'أفعال الصينية لا تتصرّف بتغير الشخص كما في العربية. مثل 我喝 و你喝 و他喝، يبقى الفعل 喝 كما هو.',e:'我看书。|wǒ kàn shū.|أنا أقرأ كتابًا.',v:'吃|chī|يأكل;喝|hē|يشرب;看|kàn|يشاهد / يقرأ;听|tīng|يستمع;读|dú|يقرأ بصوت / يدرس;写|xiě|يكتب'},
{t:'الطعام والمشروبات',g:'طلب مشروب أو طعام بسيط بالصينية.',r:'تركيب سهل للطلب: 我要 + الشيء. مثل 我要茶 «أريد شايًا». وأضيفي 请 لجعل الطلب ألطف.',e:'我要一杯茶。|wǒ yào yì bēi chá.|أريد كوب شاي.',v:'水|shuǐ|ماء;茶|chá|شاي;咖啡|kāfēi|قهوة;米饭|mǐfàn|أرز مطبوخ;面条|miàntiáo|نودلز;苹果|píngguǒ|تفاح'},
{t:'المرافق والأماكن',g:'تسمية الأماكن الشائعة وسؤال أين يقع المكان.',r:'اسألي عن مكان معين باستخدام 在哪里؟. مثال: 学校在哪里؟ «أين المدرسة؟».',e:'大学在哪里？|dàxué zài nǎlǐ?|أين الجامعة؟',v:'学校|xuéxiào|مدرسة;大学|dàxué|جامعة;家|jiā|منزل;医院|yīyuàn|مستشفى;商店|shāngdiàn|متجر;餐厅|cāntīng|مطعم'},
{t:'الناس والدراسة والعمل',g:'معرفة المهن والتعبير عن الدراسة والأصدقاء.',r:'تأتي أداة الإضافة 的 بين الضمير والاسم، مثل 我的朋友 «صديقي». ويمكن حذفها أحيانًا مع العلاقات القريبة.',e:'她是我的朋友。|tā shì wǒ de péngyou.|هي صديقتي.',v:'老师|lǎoshī|معلّم;学生|xuésheng|طالب;朋友|péngyou|صديق;同学|tóngxué|زميل دراسة;医生|yīshēng|طبيب;工作|gōngzuò|عمل / يعمل'},
{t:'الموقع والمكان',g:'تمييز هنا وهناك وفوق وتحت وداخل وخارج.',r:'غالبًا تأتي كلمات الموقع بعد الاسم مع 在 للتعبير عن المكان، مثل 在里面 «في الداخل».',e:'书在这里。|shū zài zhèlǐ.|الكتاب هنا.',v:'这里|zhèlǐ|هنا;那里|nàlǐ|هناك;上|shàng|فوق;下|xià|تحت;里面|lǐmiàn|داخل;外面|wàimiàn|خارج'},
{t:'الاتجاهات والحركة',g:'فهم أوصاف الاتجاه والطريق القصير.',r:'يمكن تركيب الاتجاهات مع 边 أو 面 مثل 左边 «الجهة اليسرى». وتُستخدم 走 للمشي و到 للوصول.',e:'往左走。|wǎng zuǒ zǒu.|امشي إلى اليسار.',v:'左|zuǒ|يسار;右|yòu|يمين;前|qián|أمام;后|hòu|خلف;走|zǒu|يمشي;到|dào|يصل إلى'},
{t:'محادثة الأسبوع الثالث',g:'الطلب بلطف والتعبير عن الفهم أو عدم الفهم.',r:'من الجمل المهمة للمتعلم: 请再说一遍 «كرري، من فضلك» و慢一点 «أبطأ قليلًا». ليست هناك مشكلة في استخدامهما كثيرًا.',e:'请再说一遍。|qǐng zài shuō yí biàn.|من فضلك كرري مرة أخرى.',v:'请问|qǐngwèn|عذرًا، سؤال;我不知道|wǒ bù zhīdào|لا أعرف;我知道|wǒ zhīdào|أعرف;我明白|wǒ míngbai|أفهم;再说一遍|zài shuō yí biàn|كرّر مرة أخرى;慢一点|màn yì diǎn|أبطأ قليلًا'},

function markWord(w,correct=null){const p=data.wordProgress[w.id]||{seen:false,streak:0,correct:0,wrong:0,due:TODAY(),last:null};p.seen=true;p.last=TODAY();if(correct===true){p.correct++;p.streak++;p.due=shiftDate(TODAY(),p.streak>=5?14:p.streak>=3?7:p.streak===2?3:1)}else if(correct===false){p.wrong++;p.streak=0;p.due=shiftDate(TODAY(),1)}else if(!p.due||p.due<TODAY())p.due=shiftDate(TODAY(),1);data.wordProgress[w.id]=p;persist()}

function activity(date=TODAY()){if(!data.activity[date])data.activity[date]={seconds:0,answers:0,correct:0,reviews:0};return data.activity[date]}

function completedDays(){return Object.keys(data.completed).map(Number).filter(x=>x>=1&&x<=30).sort((a,b)=>a-b)}

function studyDays(){return Object.entries(data.activity).filter(([d,a])=>(a.seconds||0)>=30||(a.answers||0)>0||(a.reviews||0)>0).map(([d])=>d)}

function counts(){const days=completedDays(),words=reviewRecords(),act=Object.values(data.activity),answers=act.reduce((a,b)=>a+(b.answers||0),0),correct=act.reduce((a,b)=>a+(b.correct||0),0),seconds=act.reduce((a,b)=>a+(b.seconds||0),0);return {days:days.length,words:words.length,mastered:words.filter(w=>(data.srs[w.id]?.reps||0)>=3).length,answers,correct,accuracy:answers?Math.round(100*correct/answers):null,seconds,reviewDue:words.filter(w=>!data.srs[w.id]||data.srs[w.id].due<=TODAY()).length}}

function homePage(){const c=counts(),cur=nextDay(),dayIndex=Math.max(1,diffDays(TODAY(),data.startDate)+1),dayActive=studyDays().includes(TODAY()),doneToday=Object.values(data.completed).some(o=>o.date===TODAY()),currentMinutes=Math.floor((data.activity[TODAY()]?.seconds||0)/60);const targets=[{name:'أنجزي درسًا',desc:'خطوة ثابتة نحو 30 درسًا',done:doneToday,icon:'book'},{name:'صفّري المراجعات المستحقة',desc:`${c.reviewDue} بطاقة تحتاج مراجعة`,done:c.reviewDue===0,icon:'review'},{name:`ادرسي ${data.settings.goal} دقيقة`,desc:`${currentMinutes} / ${data.settings.goal} دقيقة اليوم`,done:currentMinutes>=data.settings.goal,icon:'clock'}];return `<div class="eyebrow">YOUR DAILY SYSTEM</div><div class="hero"><div class="hero-text"><span class="kicker">اليوم ${dayIndex} منذ البداية · المستوى التمهيدي · كلمات ${levelInfo().name}</span><h1>${c.days===30?'أنهيتِ المسار التمهيدي!':'الصينية، بخطة قابلة للقياس.'}</h1><p>${c.days===30?'يمكنك متابعة المراجعة الذكية حتى تترسخ الكلمات.':'كل يوم: مفردات محددة، نطق عملي، اختبار قصير، ومراجعة متباعدة. لا عشوائية، فقط تقدّم موثّق.'}</p><button class="btn btn-white" data-action="${c.days===30?'go-review':'open-lesson'}" ${c.days===30?'':'data-day="'+cur+'"'}>${ico(c.days===30?'review':'arrow')} ${c.days===30?'ابدئي المراجعة':'ابدئي درس '+cur}</button></div><div class="hero-stats"><div class="ring" style="--pct:${Math.round(c.days/30*100)}"><div class="ring-inner"><strong>${Math.round(c.days/30*100)}%</strong><span>المسار</span></div></div></div></div>${levelSnapshot()}<div class="metrics">${metric('الأيام التي درستِ فيها',studyDays().length,'أيام نشاط فعلي','calendar')}${metric('سلسلة الاستمرار',streak()+' 🔥','أيام متتالية','flame')}${metric('المفردات المدروسة',c.words,'من أصل '+lessons.reduce((x,l)=>x+l.words.length,0)+' كلمة وعبارة','book')}${metric('دقة الاختبارات',c.accuracy===null?'—':c.accuracy+'% ',c.answers+' إجابة مُسجلة','target')}</div><div class="two-cols"><section class="panel"><div class="panel-head"><div><h2>نشاط التعلّم</h2><div class="section-sub">الدقائق خلال آخر 14 يومًا</div></div><button class="link" data-action="navigate" data-to="analytics">كل التحليلات ${ico('chevron')}</button></div><div class="chart-box">${barsChart(14)}</div><div class="chart-meta"><span class="chart-key">دقائق التعلّم الفعلية</span><span>${formatMinutes(c.seconds)} إجمالًا</span></div></section><section class="panel"><div class="panel-head"><h2>مهام اليوم</h2><span class="tag blue">${targets.filter(x=>x.done).length} / 3</span></div>${targets.map(x=>`<div class="mini-target"><div class="target-icon ${x.done?'done':''}">${ico(x.done?'check':x.icon)}</div><div class="target-copy"><strong>${x.name}</strong><span>${x.desc}</span></div><span class="tag ${x.done?'green':''}">${x.done?'تم':'قيد العمل'}</span></div>`).join('')}</section></div><div class="section-head"><div><h2>دروسك التالية</h2><div class="section-sub">اسلكي المسار بالترتيب، ويمكنك فتح أي درس في أي وقت.</div></div><button class="link" data-action="navigate" data-to="path">عرض 30 يومًا</button></div><div class="course-row">${nextLessons().map(l=>courseCard(l)).join('')}</div><div class="two-cols"><section class="panel"><div class="panel-head"><h2>المراجعة المتباعدة</h2><span class="tag ${c.reviewDue?'gold':'green'}">${c.reviewDue} مستحقة</span></div><p class="muted">لا يكفي رؤية الكلمة مرة واحدة. ستعود لك الكلمات على فترات متباعدة بحسب تقييمك لسهولة تذكرها.</p><button class="btn btn-soft" data-action="go-review">${ico('review')} افتحي بطاقات المراجعة</button></section><section class="panel"><div class="panel-head"><h2>مبدأ البرنامج</h2><span class="tag">منهج عملي</span></div><p class="muted" style="margin:0">الهدف ليس تعلّم اللغة كاملة في 30 يومًا، بل تأسيس النطق ومفردات أساسية واختبار الاسترجاع بصورة منظّمة، ثم توسيع المسار تدريجيًا.</p></section></div>`}

function courseCard(l){const completed=!!data.completed[l.day],next=l.day===nextDay()&&!completed;return `<button data-action="open-lesson" data-day="${l.day}" class="course-card ${next?'next':''}"><div><span class="lesson-n">اليوم ${String(l.day).padStart(2,'0')}</span><span class="tag ${completed?'green':next?'blue':''}" style="float:left">${completed?'مكتمل':next?'التالي':'متاح'}</span><div class="lesson-title">${l.title}</div></div><div class="lesson-bottom"><span class="small muted">${l.words.length} كلمات وعبارات</span>${ico('chevron')}</div></button>`}
function pathPage(){const c=counts();return `${pageLead('30-DAY LEARNING MAP','مسار من 30 درسًا','أربع مراحل، أهداف محددة، واختبار في نهاية كل درس. الترتيب مقترح وليس قفلًا.') }<section class="panel" style="margin-bottom:18px"><div class="panel-head"><h3>مؤشر الخطة</h3><span class="tag blue">${c.days} من 30</span></div><div class="progress-track" style="height:11px"><div class="progress-fill" style="width:${c.days/30*100}%"></div></div><div class="chart-meta" style="margin-top:12px"><span>بدأتِ: ${dateLabel(data.startDate)}</span><span>المفردات: ${c.words} / ${lessons.reduce((n,l)=>n+l.words.length,0)}</span></div></section><div class="filters">${[['all','كل الدروس'],['next','غير المكتملة'],['done','المكتملة']].map(([k,t])=>`<button class="filter-btn ${pathFilter===k?'active':''}" data-action="filter" data-filter="${k}">${t}</button>`).join('')}</div>${phases.map((p,i)=>{let group=lessons.filter(l=>l.day>=p.from&&l.day<=p.to&&((pathFilter==='all')||(pathFilter==='done'&&data.completed[l.day])||(pathFilter==='next'&&!data.completed[l.day])));if(!group.length)return '';return `<div class="path-phase"><div class="phase-number">0${i+1}</div><div><h2>${p.name}</h2><div class="phase-desc">الأيام ${p.from}–${p.to} · ${p.desc}</div></div></div><div class="path-grid">${group.map(l=>pathCard(l)).join('')}</div>`}).join('')||'<div class="empty">لا توجد دروس ضمن هذا الفلتر.</div>'}`}
function pathCard(l){const done=!!data.completed[l.day],next=l.day===nextDay()&&!done;return `<button class="path-card ${next?'current':''}" data-action="open-lesson" data-day="${l.day}"><div class="path-card-head"><span class="small muted">اليوم ${String(l.day).padStart(2,'0')}</span><span class="tag ${done?'green':next?'blue':''}">${done?'✓ مكتمل':next?'الخطوة التالية':'متاح'}</span></div><div class="path-card-title">${l.title}</div><div class="path-card-goal">${l.goal}</div><div class="path-card-foot"><span>${l.words.length} مفردات</span><span>${done?'أفضل نتيجة '+data.completed[l.day].score+'%':'افتحي الدرس ←'}</span></div></button>`}
function lessonPage(){const l=lessons[currentDay-1];if(!l)return pathPage();if(quizDone)return completionPage(l);if(quiz)return quizPage(l);const done=!!data.completed[currentDay];return `<div class="section-head" style="margin-top:0"><button class="btn btn-outline btn-small" data-action="navigate" data-to="path">${ico('chevron')} جميع الدروس</button><span class="tag ${done?'green':'blue'}">${done?'سبق إكماله':'درس '+currentDay+' من 30'}</span></div><div class="lesson-layout"><div class="lesson-main"><section class="panel"><div class="eyebrow">DAY ${String(currentDay).padStart(2,'0')} · MANDARIN</div><div class="lesson-titlebox"><h1>${l.title}</h1><span class="tag">${l.words.length} مفردات</span></div><div class="lesson-objective"><strong>الهدف المحدد</strong><p>${l.goal}</p></div><h3>الفكرة الأساسية</h3><p class="study-rule">${l.rule}</p>${currentDay===1?`<div class="note-box" style="margin-top:16px"><h3>أولًا: كيف أقرأ الصينية؟</h3><p><strong>Pinyin</strong> هو نظام لكتابة نطق الصينية بالحروف اللاتينية؛ لا تفترضي أن كل حرف يُنطق كالإنجليزية. اقرئي المقطع مع علامته الصوتية، ثم استخدمي زر الصوت لسماع النطق الفعلي.</p><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px"><span class="tag blue en">mā — نغمة مستوية</span><span class="tag blue en">má — صاعدة</span><span class="tag blue en">mǎ — هابطة ثم صاعدة</span><span class="tag blue en">mà — هابطة حادة</span><span class="tag en">ma — خفيفة</span></div><p style="margin-top:12px">ستقابلين أصواتًا مثل <span class="en">zh · ch · sh · j · q · x · ü</span>. لا تحفظي نطقها من تخمينك؛ اربطي الصوت بكل كلمة عبر الاستماع والتكرار.</p></div>`:''}<div class="section-head"><h3>جملة تطبيقية</h3></div><div class="sentence"><div><div class="sentence-cn cn">${l.example.cn}</div><div class="word-pinyin">${l.example.pinyin}</div><div class="small" style="margin-top:7px">${l.example.ar}</div></div><button class="speak-btn" data-action="speak" data-say="${safe(l.example.cn)}" aria-label="الاستماع للجملة">${ico('volume')}</butt function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(){const l=lessons[currentDay-1],all=[...l.words,...lessons.slice(0,currentDay).flatMap(x=>x.words)].filter(x=>x.id!==undefined);let q=[];for(let i=0;i<l.words.length;i++){const w=l.words[i],reverse=i>=l.words.length-2;const answer=reverse?w.cn:w.ar;let pool=all.filter(x=>x.id!==w.id).map(x=>reverse?x.cn:x.ar).filter(x=>x!==answer);pool=[...new Set(pool)];const intra=shuffled(l.words.filter(x=>x.id!==w.id).map(x=>reverse?x.cn:x.ar)).slice(0,3);const decoys=[...new Set([...intra,...shuffled(pool)])].filter(x=>x!==answer).slice(0,3);q.push({prompt:reverse?w.ar:w.cn,pinyin:reverse?'':w.pinyin,reverse,options:shuffled([answer,...decoys]),answer,word:w})}quiz={questions:shuffled(q),position:0,selected:null,correct:0};quizDone=null;render()}

function finishQuiz(){let score=Math.round(100*quiz.correct/quiz.questions.length),prev=data.completed[currentDay];if(!prev)data.completed[currentDay]={date:TODAY(),score,correct:quiz.correct,total:quiz.questions.length};else if(score>prev.score){prev.score=score;prev.correct=quiz.correct;prev.total=quiz.questions.length}const l=lessons[currentDay-1];for(const w of l.words)if(!data.srs[w.id])data.srs[w.id]={due:shiftDate(TODAY(),1),reps:0,interval:1,ease:2.2};quizDone={score,correct:quiz.correct,total:quiz.questions.length};quiz=null;persist();render()}

function initReview(mode='due'){reviewMode=mode;let all=reviewRecords(),due=all.filter(w=>!data.srs[w.id]||data.srs[w.id].due<=TODAY());reviewDeck=shuffled(mode==='due'?due:all);reviewIndex=0;revealed=false;page='review';render()}
function reviewPage(){const c=counts(),active=reviewIndex<reviewDeck.length,w=reviewDeck[reviewIndex];return `${pageLead('SPACED REPETITION','المراجعة الذكية','اختبري قدرتك على تذكّر المعنى قبل إظهاره. قيّمي نفسك لتحديد موعد ظهوره مجددًا.') }<div class="metrics" style="grid-template-columns:repeat(3,minmax(0,1fr))">${metric('المستحقة اليوم',c.reviewDue,'كلمات وعبارات','review')}${metric('إجمالي البطاقات',c.words,'كلمات تعلّمتها','book')}${metric('المتقَنة',c.mastered,'بعد 3 مراجعات ناجحة','trophy')}</div><div class="filters"><button data-action="review-mode" data-mode="due" class="filter-btn ${reviewMode==='due'?'active':''}">المراجعات المستحقة</button><button data-action="review-mode" data-mode="all" class="filter-btn ${reviewMode==='all'?'active':''}">تدريب حر على كل الكلمات</button></div>${active?`<div class="review-center"><div class="panel-head"><h3>${reviewMode==='due'?'جلسة المراجعة المستحقة':'جلسة التدريب الحر'}</h3><span class="tag blue">${reviewIndex+1} / ${reviewDeck.length}</span></div><div class="quiz-meter" style="margin-top:0"><span style="width:${reviewIndex/reviewDeck.length*100}%"></span></div><div class="flashcard"><div class="small muted">اليوم ${w.day} · تذكّري المعنى</div><div class="flash-cn cn">${w.cn}</div><div class="flash-pinyin">${w.pinyin}</div><button class="speak-btn" style="margin-top:12px" data-action="speak" data-say="${safe(w.cn)}" aria-label="استماع">${ico('volume')}</button>${revealed?`<div class="flash-answer">${w.ar}</div>`:`<button class="btn btn-soft" style="margin-top:25px" data-action="reveal">إظهار المعنى</button>`}</div>${revealed?`<p class="center small muted" style="margin:16px 0 8px">كيف كان استرجاع الكلمة من الذاكرة؟</p><div class="review-actions"><button class="btn btn-outline" data-action="grade" data-grade="hard">صعبة · غدًا</button><button class="btn btn-soft" data-action="grade" data-grade="good">تذكّرتها</button><button class="btn btn-primary" data-action="grade" data-grade="easy">سهلة جدًا</button></div>`:'<p class="center fineprint" style="margin:14px">حاولي تذكّر الترجمة قبل الضغط على «إظهار المعنى».</p>'}</div>`:`<div class="empty" style="max-width:710px;margin:16px auto">${ico('check')}<h3>${c.words===0?'ابدئي أول درس لتكوين بطاقات المراجعة.':reviewMode==='due'?'لا توجد مراجعات مستحقة حاليًا.':'اكتملت جلسة التدريب الحر!'}</h3><p>${c.words===0?'افتحي المسار واختاري اليوم الأول.':'يمكنك إعادة التدريب بحرية، وستعود البطاقات في موعدها التالي.'}</p><button class="btn btn-primary" data-action="${c.words===0?'open-lesson':'review-mode'}" ${c.words===0?'data-day="1"':'data-mode="all"'}>${c.words===0?'ابدئي الدرس الأول':'ابدئي تدريبًا حرًا'}</button></div>`}`}
function gradeReview(grade){let w=reviewDeck[reviewIndex];if(!w)return;let s=data.srs[w.id]||{reps:0,interval:1,ease:2.2},now=TODAY();if(grade==='hard'){s.reps=0;s.interval=1;s.ease=Math.max(1.3,(s.ease||2.2)-.15)}else{const prior=s.reps||0;s.reps=prior+1;if(grade==='easy')s.ease=Math.min(3,(s.ease||2.2)+.12);if(s.reps===1)s.interval=grade==='easy'?3:1;else if(s.reps===2)s.interval=grade==='easy'?7:3;else s.interval=Math.min(90,Math.max(5,Math.round((s.interval||3)*(s.ease||2.2)*(grade==='easy'?1.3:1))))}s.due=shiftDate(now,s.interval);s.last=now;data.srs[w.id]=s;activity().reviews++;persist();reviewIndex++;revealed=false;render()}
function analyticsPage(){const c=counts(),days=studyDays().length,avg=days?Math.round(c.seconds/60/days):0,period=analysisDays;return `${pageLead('MEASURE WHAT MATTERS','تحليلات تقدّمك','الأرقام تعكس نشاطك الفعلي واختباراتك المكتملة والمراجعات المسجّلة.') }<div class="metrics">${metric('وقت التعلّم',formatMinutes(c.seconds),'داخل الدروس والكلمات والمراجعة','clock')}${metric('أيام الدراسة',days,'يومًا فيه نشاط موثّق','calendar')}${metric('متوسط الجلسة اليومية',avg+' د','في الأيام النشطة','chart')}${metric('إجابات صحيحة',c.correct+' / '+c.answers,c.accuracy===null?'لم يُجرَ اختبار بعد':c.accuracy+'% دقّة','target')}</div><div class="analytics-grid"><section class="panel"><div class="panel-head"><div><h2>النشاط اليومي</h2><div class="section-sub">الدقائق المسجلة</div></div><select class="select" data-action="period" aria-label="المدة"><option value="14" ${period===14?'selected':''}>14 يومًا</option><option value="30" ${period===30?'selected':''}>30 يومًا</option></select></div>${barsChart(period)}<p class="fineprint">يُحتسب الوقت أثناء فتح الدرس أو الكلمات أو جلسة المراجعة، ما دام التطبيق نشطًا.</p></section><section class="panel"><div class="panel-head"><div><h2>نمو المفردات</h2><div class="section-sub">الإجمالي التراكمي للمفردات في الدروس المكتملة</div></div><span class="tag blue">${c.words} كلمة وعبارة</span></div>${lineChart(30)}<p class="fineprint">يختلف «مدروس» عن «متقَن»: الإتقان يحتاج مراجعات لاحقة.</p></section><section class="panel"><div class="panel-head"><h2>خريطة الالتزام · آخر 30 يومًا</h2><span class="tag">أغمق = نشاط أكثر</span></div><div class="heat-grid">${Array.from({length:30},(_,i)=>{let d=shiftDate(TODAY(),i-29),a=data.activity[d]||{},minutes=(a.seconds||0)/60,active=(a.answers||0)+(a.reviews||0);let intensity=minutes>=20?4:minutes>=10?3:minutes>=3?2:minutes>=.5||active?1:0;return `<div class="heat-cell ${intensity?'heat-'+intensity:''}" title="${dateLabel(d)}: ${Math.floor(minutes)} دقيقة، ${active} تفاعلًا" role="img" aria-label="${dateLabel(d)} ${Math.floor(minutes)} دقيقة"></div>`}).join('')}</div><div class="heat-legend"><span>أقل</span>${[0,1,2,3,4].map(x=>`<div class="heat-cell ${x?'heat-'+x:''}"></div>`).join('')}<span>أكثر</span></div></section><section class="panel"><div class="panel-head"><h2>إنجاز المراحل</h2><span class="tag">4 مراحل</span></div>${phases.map((p,i)=>{const total=p.to-p.from+1,done=Object.keys(data.completed).map(Number).filter(d=>d>=p.from&&d<=p.to).length;return `<div class="milestone"><span>${p.name}</span><div class="progress-track"><div class="progress-fill" style="width:${done/total*100}%"></div></div><strong>${done}/${total}</strong></div>`}).join('')}<div class="note-box" style="margin-top:24px"><h3>مقياس الإتقان</h3><p>${c.mastered} من ${c.words} بطاقة وصلت إلى 3 مراجعات ناجحة على الأقل. إنها إشارة عملية للتقدّم، لا شهادة طلاقة لغوية.</p></div></section></div>${miniLevelChart()}${recentActivityTable()}`}
function recentActivityTable(){const rows=Object.entries(data.activity).filter(([,a])=>a.seconds||a.answers||a.reviews).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);return `<section class="panel"><div class="panel-head"><h2>سجل آخر الجلسات</h2><span class="tag">7 أيام نشطة كحد أقصى</span></div>${rows.length?`<div style="overflow-x:auto"><table class="stat-table"><thead><tr><th>التاريخ</th><th>وقت التعلّم</th><th>إجابات الاختبار</th><th>المراجعات</th></tr></thead><tbody>${rows.map(([d,a])=>`<tr><td>${dateLabel(d)}</td><td>${formatMinutes(a.seconds||0)}</td><td>${a.correct||0} / ${a.answers||0}</td><td>${a.reviews||0}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">ستظهر هنا جلساتك بمجرد بدء التدريب.</p>'}</section>`}
function formatMinutes(seconds){const n=Math.floor(seconds/60);return n>=60?`${Math.floor(n/60)} س ${n%60} د`:`${n} د`}
function barsChart(count){const W=600,H=210,L=25,R=13,T=19,B=33,plotW=W-L-R,plotH=H-T-B;const vals=Array.from({length:count},(_,i)=>{const date=shiftDate(TODAY(),i-count+1);return{date,v:Math.floor((data.activity[date]?.seconds||0)/60)}});let max=Math.max(5,...vals.map(x=>x.v)),step=plotW/count,bw=Math.min(24,step*.54);const bars=vals.map((a,i)=>{let x=L+i*step+(step-bw)/2,h=clamp((a.v/max)*(plotH-10),a.v>0?3:0,plotH),y=T+plotH-h;return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${a.date===TODAY()?'#365ec5':'#9db4f1'}"><title>${dateLabel(a.date)} · ${a.v} دقيقة</title></rect>${count<=14||i%3===0?`<text x="${(x+bw/2).toFixed(1)}" y="${H-9}" fill="currentColor" opacity=".55" text-anchor="middle" font-size="9">${dateAt(a.date).getDate()}</text>`:''}`}).join('');let lines=[0,.5,1].map(k=>{let y=T+plotH*(1-k);return `<path d="M${L} ${y} H${W-R}" stroke="currentColor" opacity=".10" stroke-dasharray="4 5"/><text x="${L-5}" y="${y+3}" fill="currentColor" opacity=".4" text-anchor="end" font-size="9">${Math.round(max*k)}</text>`}).join('');return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="مخطط أعمدة لنشاط آخر ${count} يومًا، بعدد دقائق التعلّم">${lines}${bars}</svg></div>`}
function lineChart(count){const W=600,H=210,L=28,R=14,T=18,B=32,plotW=W-L-R,plotH=H-T-B;const dates=Array.from({length:count},(_,i)=>shiftDate(TODAY(),i-count+1));let vals=dates.map(date=>lessons.filter(l=>data.completed[l.day]&&data.completed[l.day].date<=date).reduce((n,l)=>n+l.words.length,0));const max=Math.max(10,...vals),xy=vals.map((v,i)=>[L+(i/(count-1))*plotW,T+plotH-(v/max)*(plotH-10)]);let poly=xy.map(v=>v.map(x=>x.toFixed(1)).join(',')).join(' ');let area=`${L},${T+plotH} ${poly} ${W-R},${T+plotH}`;let lines=[0,.5,1].map(k=>{const y=T+plotH*(1-k);return `<path d="M${L} ${y} H${W-R}" stroke="currentColor" opacity=".1" stroke-dasharray="4 5"/><text x="${L-6}" y="${y+3}" fill="currentColor" opacity=".45" font-size="10" text-anchor="end">${Math.round(max*k)}</text>`}).join('');const tick=[0,Math.floor((count-1)/2),count-1].map(i=>`<text x="${xy[i][0]}" y="${H-8}" fill="currentColor" opacity=".55" text-anchor="middle" font-size="10">${dateLabel(dates[i])}</text>`).join('');return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم خطي تراكمي للكلمات المدروسة خلال 30 يومًا">${lines}<polygon points="${area}" fill="#678de1" opacity=".11"/><polyline points="${poly}" fill="none" stroke="#5176d8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${xy[xy.length-1][0]}" cy="${xy[xy.length-1][1]}" r="4.5" fill="#5176d8"/>${tick}</svg></div>`}
function settingsPage(){return `${pageLead('PERSONAL WORKSPACE','إعدادات التعلّم','ضبط هدفك اليومي وبيانات التقدم الخاصة بك.') }<section class="panel"><div class="settings-row"><div><h3>مستوى كلمات الصينية</h3><p>مستواك الحالي: ${levelInfo().name} — ${levelInfo().label}. يمكنك الانتقال إلى أي مستوى دون محو تقدمك.</p></div><button class="btn btn-outline" data-action="change-level">تغيير المستوى</button></div><div class="settings-row"><div><h3>الهدف الزمني اليومي</h3><p>يظهر الهدف في لوحة التحكم ويُحسب من الوقت أثناء فتح الدروس أو المراجعة.</p></div><select class="select" id="daily-goal" data-action="goal"><option value="10" ${data.settings.goal===10?'selected':''}>10 دقائق</option><option value="15" ${data.settings.goal===15?'selected':''}>15 دقيقة</option><option value="20" ${data.settings.goal===20?'selected':''}>20 دقيقة</option><option value="30" ${data.settings.goal===30?'selected':''}>30 دقيقة</option><option value="45" ${data.settings.goal===45?'selected':''}>45 دقيقة</option></select></div><div class="settings-row"><div><h3>المظهر</h3><p>يمكنك التبديل بين الوضع الفاتح والداكن.</p></div><button class="btn btn-outline" data-action="theme">${ico(data.settings.theme==='dark'?'sun':'moon')} ${data.settings.theme==='dark'?'الوضع الفاتح':'الوضع الداكن'}</button></div><div class="settings-row"><div><h3>تصدير نسخة احتياطية</h3><p>احفظي ملف JSON يتضمن الأيام والدروس والنتائج وبطاقات المراجعة، حتى لا تضيع إذا تغير المتصفح.</p></div><button class="btn btn-outline" data-action="export">${ico('download')} تصدير التقدم</button></div><div class="settings-row"><div><h3>استيراد تقدم سابق</h3><p>يستبدل التقدم الحالي ببيانات ملف سبق تصديره من هذا التطبيق.</p></div><button class="btn btn-outline" data-action="import">${ico('upload')} اختيار ملف</button></div><div class="settings-row"><div><h3>تصفير البرنامج</h3><p>يبدأ المسار من جديد ويمحو تقدمك المخزّن في هذا المتصفح فقط. خذي نسخة احتياطية أولًا.</p></div><button class="btn btn-danger" data-action="reset">إعادة البدء من الصفر</button></div></section><div class="note-box" style="margin-top:20px"><h3>كيف تُحفظ البيانات؟</h3><p>كل بيانات التقدم محفوظة على جهازك في تخزين المتصفح المحلي. لا حساب، ولا خادم، ولا مزامنة بين الأجهزة. إذا حُذفت بيانات المتصفح فقد يضيع التقدم؛ استخدمي التصدير بانتظام. يعتمد النطق الصوتي على أصوات اللغة الصينية المتاحة في جهازك ومتصفحك.</p></div>`}
function render(){document.documentElement.dataset.theme=data.settings.theme==='dark'?'dark':'light';document.documentElement.style.colorScheme=data.settings.theme==='dark'?'dark':'light';if(!data.settings.level||page==='choose-level'){root.innerHTML=pickerPage();return}const body=page==='home'?homePage():page==='path'?pathPage():page==='vocab'?vocabPage():page==='vocab-quiz'?vocabQuizPage():page==='lesson'?lessonPage():page==='review'?reviewPage():page==='analytics'?analyticsPage():settingsPage();root.innerHTML=shell(body)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3800)}
function navigate(to){page=to;quiz=null;quizDone=null;vocabQuiz=null;if(to==='review')initReview('due');else render();window.scrollTo({top:0,behavior:'instant'})}
function speak(text){if(!('speechSynthesis' in window)){toast('ميزة النطق غير متاحة في هذا المتصفح.');return}try{window.speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(text.replaceAll('…',''));s.lang='zh-CN';s.rate=.83;s.pitch=1;const voices=window.speechSynthesis.getVoices();const chinese=voices.find(v=>/^zh[-_](CN|Hans)/i.test(v.lang))||voices.find(v=>v.lang.toLowerCase().startsWith('zh'));if(chinese)s.voice=chinese;window.speechSynthesis.speak(s);if(!chinese)toast('سيحاول المتصفح النطق بالصينية. قد تحتاجين تثبيت صوت صيني من إعدادات الجهاز.')}catch{toast('تعذّر تشغيل الصوت على هذا الجهاز.')}}
function downloadData(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`han-progress-${TODAY()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('تم تجهيز النسخة الاحتياطية.')}
function validateImport(x){if(!x||typeof x!=='object'||typeof x.startDate!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(x.startDate)||typeof x.completed!=='object'||!x.completed||Array.isArray(x.completed)||typeof x.activity!=='object'||!x.activity||typeof x.srs!=='object'||!x.srs)return false;for(const [k,v] of Object.entries(x.completed))if(!/^(?:[1-9]|[12][0-9]|30)$/.test(k)||typeof v?.date!=='string'||typeof v.score!=='number')return false;return true}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;lastInteraction=Date.now();const a=b.dataset.action;if(handleVocabAction(b))return;if(a==='navigate'){navigate(b.dataset.to);return}if(a==='theme'){data.settings.theme=data.settings.theme==='dark'?'light':'dark';persist();render();return}if(a==='open-lesson'){currentDay=clamp(+b.dataset.day||1,1,30);page='lesson';quiz=null;quizDone=null;render();window.scrollTo(0,0);return}if(a==='go-review'){initReview('due');window.scrollTo(0,0);return}if(a==='speak'){speak(b.dataset.say);return}if(a==='filter'){pathFilter=b.dataset.filter;render();return}if(a==='start-quiz'||a==='retake'){startQuiz();window.scrollTo(0,0);return}if(a==='close-quiz'){quiz=null;render();return}if(a==='answer'&&quiz&&quiz.selected===null){const q=quiz.questions[quiz.position],option=q.options[+b.dataset.index];quiz.selected=option;const correct=option===q.answer;if(correct)quiz.correct++;let act=activity();act.answers++;if(correct)act.correct++;persist();render();return}if(a==='quiz-next'&&quiz&&quiz.selected!==null){if(quiz.position+1===quiz.questions.length)finishQuiz();else{quiz.position++;quiz.selected=null;render()}return}if(a==='review-mode'){initReview(b.dataset.mode);return}if(a==='reveal'){revealed=true;render();return}if(a==='grade'&&revealed){gradeReview(b.dataset.grade);return}if(a==='export'){downloadData();return}if(a==='import'){document.getElementById('import-file').click();return}if(a==='reset'){if(confirm('هل تريدين محو جميع الدروس ونتائجك والبدء من الصفر؟')){data=fresh();persist();page='choose-level';vocabQuiz=null;render();toast('بدأ مسار جديد. اختاري المستوى.')}return}});
root.addEventListener('change',e=>{if(e.target.matches('#vocab-level-select')){const k=e.target.value;if(LEVEL_VOCAB[k]){data.settings.level=k;wordFilter='all';vocabQuiz=null;persist();render()}}else if(e.target.matches('#daily-goal')){const n=+e.target.value;if([10,15,20,30,45].includes(n)){data.settings.goal=n;persist();render()}}else if(e.target.dataset.action==='period'){analysisDays=+e.target.value===30?30:14;render()}});
document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>3e6)throw Error('big');const obj=JSON.parse(await f.text());if(!validateImport(obj))throw Error('invalid');if(confirm('سيستبدل هذا الملف تقدمك الحالي. هل تريدين المتابعة؟')){data={version:1,startDate:obj.startDate,completed:obj.completed,activity:obj.activity,srs:obj.srs,settings:{goal:15,theme:'light',level:null,...(obj.settings||{})},wordProgress:obj.wordProgress&&typeof obj.wordProgress==='object'?obj.wordProgress:{},vocabTests:Array.isArray(obj.vocabTests)?obj.vocabTests:[]};data.settings.goal=[10,15,20,30,45].includes(+data.settings.goal)?+data.settings.goal:15;data.settings.level=LEVEL_VOCAB[String(data.settings.level)]?String(data.settings.level):null;data.settings.theme=data.settings.theme==='dark'?'dark':'light';persist();page=data.settings.level?'home':'choose-level';quiz=null;vocabQuiz=null;render();toast('تم استيراد تقدمك بنجاح.')}}catch{toast('الملف غير صالح أو ليس نسخة احتياطية من HÀN.')}e.target.value=''})
// Count seconds only while the app's active learning views are open, visible, and recently active.
window.addEventListener('keydown',()=>lastInteraction=Date.now());
document.addEventListener('touchstart',()=>lastInteraction=Date.now(),{passive:true});
setInterval(()=>{if(document.visibilityState==='visible'&&(page==='lesson'||page==='review'||page==='vocab'||page==='vocab-quiz')&&Date.now()-lastInteraction<5*60*1000){activity().seconds=(activity().seconds||0)+5;persist()}},5000);
render();


  </script>
